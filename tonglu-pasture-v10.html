<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>同路 · 数字牧场 v10</title>
<meta name="theme-color" content="#a8e9ff"/>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8e9ff}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#4e5047}
.stage{position:fixed;inset:0;overflow:hidden;background:#a8e9ff}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
.focus-ui{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .25s ease}.stage.focus .focus-ui{opacity:1}
.back{position:absolute;left:22px;top:22px;pointer-events:auto;border:1px solid rgba(73,80,61,.18);background:rgba(255,253,236,.94);box-shadow:2px 2px 0 rgba(73,80,61,.13);padding:8px 11px;color:#555348;font:650 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
.identity-title{position:absolute;left:50%;top:7.5%;transform:translateX(-50%);font-size:18px;font-weight:700;letter-spacing:.015em;color:#41483d;text-shadow:0 1px 0 rgba(255,255,255,.82);white-space:nowrap}
.hotspot{position:absolute;pointer-events:auto;border:0;background:transparent;padding:0;cursor:pointer;outline:none}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);padding:5px 8px;background:rgba(255,254,239,.95);border:1px solid rgba(80,72,58,.15);box-shadow:2px 2px 0 rgba(80,72,58,.10);font:600 12px/1.1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#5c574f;white-space:nowrap;opacity:0;transition:opacity .14s ease;pointer-events:none}
.hotspot:hover::after,.hotspot:focus-visible::after,.hotspot.show-label::after{opacity:1}
#careHit{left:13%;top:47%;width:18%;height:28%}
#feedHit{left:32%;top:67%;width:18%;height:23%}
#departHit{right:12%;top:45%;width:22%;height:30%}
#askHit{left:20%;bottom:5%;width:18%;height:20%}
#offerHit{right:20%;bottom:5%;width:18%;height:20%}
.world-hit{position:absolute;z-index:6;border:0;background:transparent;padding:0;cursor:pointer;outline:none}
#worldNeed{left:61%;top:52%;width:16%;height:18%}
#worldGive{right:9%;bottom:12%;width:17%;height:18%}
.world-hit::after{content:attr(data-label);position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);padding:5px 8px;background:rgba(255,254,239,.95);border:1px solid rgba(80,72,58,.14);box-shadow:2px 2px 0 rgba(80,72,58,.10);font-size:12px;font-weight:600;white-space:nowrap;color:#5c574f;opacity:0;transition:opacity .14s ease;pointer-events:none}
.world-hit:hover::after,.world-hit:focus-visible::after,.world-hit.show-label::after{opacity:1}.stage.focus .world-hit{opacity:0;pointer-events:none}
.toast{position:absolute;z-index:15;left:50%;bottom:4.5%;transform:translateX(-50%);padding:7px 10px;background:rgba(255,254,242,.96);border:1px solid rgba(77,72,59,.14);box-shadow:2px 2px 0 rgba(77,72,59,.10);font-size:12px;font-weight:600;color:#5b594f;opacity:0;pointer-events:none;transition:opacity .18s ease;white-space:nowrap}.toast.show{opacity:1}
.hint{position:fixed;left:16px;bottom:max(14px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.05em;color:rgba(50,86,48,.55);pointer-events:none;opacity:0;animation:hintin 1s ease 1s forwards,hintout 1s ease 7s forwards}@keyframes hintin{to{opacity:1}}@keyframes hintout{to{opacity:0}}
@media(max-width:760px){.identity-title{top:6.5%;font-size:16px}.back{left:14px;top:14px}.hotspot::after,.world-hit::after{font-size:11px}.toast{font-size:11px;bottom:3.5%}}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="pasture" width="480" height="300" aria-label="同路数字牧场"></canvas>
<button id="worldNeed" class="world-hit" data-label="这只羊需要一根登山杖" aria-label="一只羊发出需要"></button>
<button id="worldGive" class="world-hit" data-label="这只羊愿意给出一本绘本" aria-label="一只羊愿意给出"></button>
<div class="focus-ui">
  <button class="back" id="back">← 返回牧场</button>
  <div class="identity-title" id="identityTitle">同行 1 天的 Tony</div>
  <button id="careHit" class="hotspot" data-label="风铃 · 有人来关心你" aria-label="风铃"></button>
  <button id="feedHit" class="hotspot" data-label="灵粮" aria-label="灵粮"></button>
  <button id="departHit" class="hotspot" data-label="出发" aria-label="出发"></button>
  <button id="askHit" class="hotspot" data-label="发出需要" aria-label="发出需要"></button>
  <button id="offerHit" class="hotspot" data-label="给出" aria-label="给出"></button>
</div>
<div class="toast" id="toast"></div>
</div>
<div class="hint" id="hint">点一下前景那只羊</div>
<script>
(()=>{
const c=document.getElementById('pasture'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),back=document.getElementById('back'),toast=document.getElementById('toast');ctx.imageSmoothingEnabled=false;
const W=480,H=300;let tick=0,mode='world',toastTimer=null;
const ID_KEY='tonglu.identity.v2', NEED_KEY='tonglu.self.need.v1', OFFER_KEY='tonglu.self.offer.v1';
let identity;try{identity=JSON.parse(localStorage.getItem(ID_KEY)||'null')}catch(e){}if(!identity){identity={since:Date.now(),dna:{body:'B2',fleece:'F7',horn:'H0',ear:'E1',eye:'Y3'}};localStorage.setItem(ID_KEY,JSON.stringify(identity))}
const username=identity.username||localStorage.getItem('tonglu.username')||'Tony';
const days=Math.max(1,Math.floor((Date.now()-identity.since)/86400000)+1);document.getElementById('identityTitle').textContent=`同行 ${days} 天的 ${username}`;
let selfNeed=localStorage.getItem(NEED_KEY)==='1',selfOffer=localStorage.getItem(OFFER_KEY)==='1';
const FEED_ID='lingliang-demo-001',FEED_KEY='tonglu.lingliang.opened.'+FEED_ID,MEDIA_URL='audio/dkd.mp3';let feedOpened=localStorage.getItem(FEED_KEY)==='1';
const C={sky:'#9fe8ff',sky2:'#dff9ff',sun:'#fff1a0',sunHalo:'#fff8c7',mountainFar:'#a7c1d5',mountain:'#789cbb',hill:'#9bd878',hill2:'#7dc85d',grass:'#83d75f',grass2:'#62b94a',grass3:'#4d9d3a',river:'#79dbff',riverLight:'#c9f5ff',riverDark:'#5fc1ea',trunk:'#77644f',tree1:'#6fbe56',tree2:'#95dc74',flower1:'#fff1a0',flower2:'#ffd2ee',flower3:'#d9f6ae',ink:'#564d47',wood:'#aa8059',woodDark:'#806044',chime:'#f4d993',need:'#8fb4ff',feed:'#dff19a',self:'#bfd7a4',selfHead:'#776d60',cloth:'#ffe6a1'};
function rect(a,b,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function fill(p,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function cloud(cx,cy,s,a=1,col='#fff'){ctx.globalAlpha=a;rect(cx,cy,18*s,5*s,col);rect(cx+6*s,cy-4*s,11*s,9*s,col);rect(cx+15*s,cy+1*s,16*s,4*s,col);ctx.globalAlpha=1}
function weatherKindLocal(code){code=Number(code)||0;if(code===45||code===48)return'fog';if((code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95&&code<=99))return'rain';if((code>=71&&code<=77)||(code>=85&&code<=86))return'snow';return'clear'}
function effectiveCloudCover(){
  const w=window.__tongluWeather||{},code=Number(w.weatherCode)||0;
  let cloud=Math.max(0,Math.min(100,Number(w.cloudCover)||0));
  const type=weatherKindLocal(code);
  if(type==='fog')cloud=Math.max(cloud,92);
  else if(type==='rain'||type==='snow')cloud=Math.max(cloud,88);
  else if(code===3)cloud=Math.max(cloud,85);
  else if(code===2)cloud=Math.max(cloud,55);
  else if(code===1)cloud=Math.max(cloud,25);
  return cloud;
}
function mixHex(a,b,t){
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function weatherSky(){
  const cloud=effectiveCloudCover(),t=Math.pow(cloud/100,.9);
  return{
    top:mixHex('#9fe8ff','#819ba7',t),
    bottom:mixHex('#dff9ff','#b5c6cb',t),
    cloud,
    tone:mixHex('#ffffff','#dce4e6',Math.max(0,(cloud-35)/65))
  };
}
function drawWeatherClouds(){
  const s=weatherSky(),cloudiness=s.cloud;
  const count=cloudiness<12?1:cloudiness<30?2:cloudiness<50?3:cloudiness<68?5:cloudiness<84?7:9;
  const seeds=[[28,43,.78,.82,18],[92,64,.96,.90,25],[158,35,.72,.72,31],[222,58,1.05,.88,38],[290,41,.84,.80,46],[352,67,1.08,.92,55],[416,36,.74,.74,63],[458,59,.94,.86,72],[120,24,.64,.65,84]];
  for(let i=0;i<count;i++){
    const p=seeds[i],drift=(tick/(p[4]*5))%(W+70);
    const x=((p[0]+drift+W+70)%(W+70))-35;
    cloud(x,p[1],p[2],p[3],s.tone);
  }
}
function mountains(){fill([[0,132],[20,132],[20,124],[42,124],[42,118],[59,118],[59,122],[72,122],[72,112],[90,112],[90,104],[108,104],[108,112],[124,112],[124,123],[145,123],[145,117],[162,117],[162,109],[182,109],[182,98],[200,98],[200,108],[216,108],[216,121],[236,121],[236,114],[252,114],[252,106],[270,106],[270,115],[288,115],[288,124],[307,124],[307,116],[325,116],[325,108],[342,108],[342,116],[360,116],[360,126],[380,126],[380,117],[399,117],[399,109],[418,109],[418,116],[439,116],[439,125],[460,125],[460,121],[480,121],[480,162],[0,162]],C.mountainFar);fill([[0,153],[28,153],[28,146],[53,146],[53,139],[80,139],[80,144],[107,144],[107,134],[132,134],[132,128],[156,128],[156,135],[182,135],[182,146],[210,146],[210,138],[237,138],[237,132],[263,132],[263,139],[290,139],[290,148],[318,148],[318,141],[346,141],[346,133],[369,133],[369,140],[396,140],[396,149],[421,149],[421,141],[448,141],[448,146],[480,146],[480,177],[0,177]],C.mountain)}
function river(){fill([[322,154],[340,156],[354,161],[360,168],[357,176],[348,183],[341,191],[340,199],[346,207],[359,214],[370,222],[376,232],[377,246],[371,260],[365,276],[361,300],[395,300],[398,282],[406,263],[411,246],[409,229],[401,216],[389,205],[375,195],[370,187],[372,178],[381,169],[386,161],[383,156],[365,151],[345,148]],C.riverDark);fill([[326,155],[341,157],[351,162],[354,168],[351,174],[343,181],[337,188],[336,197],[341,204],[353,211],[365,220],[370,230],[371,243],[365,258],[359,275],[355,300],[387,300],[390,282],[398,262],[403,246],[401,232],[393,219],[382,209],[368,199],[361,191],[362,181],[370,172],[376,164],[373,159],[360,154],[344,151]],C.river);fill([[350,214],[359,219],[364,225],[365,231],[360,235],[355,229],[351,223]],C.riverLight);fill([[365,264],[370,271],[368,281],[364,288],[361,296],[368,296],[372,284],[376,274],[374,267]],C.riverLight)}
function tree(px,py,s=1,ch=false){rect(px+5*s,py+12*s,3*s,10*s,C.trunk);rect(px,py+5*s,13*s,5*s,C.tree1);rect(px+2*s,py,9*s,6*s,C.tree2);rect(px+3*s,py+9*s,7*s,5*s,'#79ca5f');if(ch){const sw=((tick>>3)%2);rect(px+13*s,py+7*s,2*s,10*s,C.woodDark);rect(px+(11+sw)*s,py+16*s,7*s,3*s,C.chime);rect(px+(13+sw)*s,py+19*s,3*s,5*s,'#fff0ae')}}
function feed(px,py,s=1){const p=(tick%36<18?0:1);rect(px,py+3*s,3*s,10*s,C.feed);rect(px+4*s,py-p*s,3*s,14*s,'#d2eb7f');rect(px+8*s,py+2*s,3*s,11*s,'#e6f5a6');rect(px+3*s,py-2*s,3*s,3*s,'#fff3a0');rect(px+8*s,py-1*s,2*s,2*s,'#fff8bf')}
function needWave(px,py,strong=false){const ph=(tick%32)>>3;ctx.strokeStyle=C.need;ctx.lineWidth=strong?2:1.4;for(let i=0;i<3;i++){const r=(strong?6:5)+i*4+ph;ctx.beginPath();ctx.arc(px,py,r,-.9,.9);ctx.stroke()}}
function cloth(px,py,s=1){rect(px,py,18*s,10*s,C.cloth);rect(px+2*s,py+2*s,14*s,2*s,'#fff4c8');rect(px+3*s,py+7*s,12*s,1*s,'#d9b56f')}
function sheepBody(px,py,s,f,h,graze=false){const g=(graze&&Math.sin(tick/35)>.45)?4:0;rect(px,py,24*s,12*s,f);rect(px+4*s,py-5*s,17*s,19*s,f);rect(px+8*s,py-8*s,10*s,22*s,f);rect(px+19*s,py+2*s+g,10*s,10*s,h);rect(px+27*s,py+4*s+g,3*s,4*s,h);rect(px+17*s,py+3*s+g,3*s,3*s,h);rect(px+24*s,py+4*s+g,1.5*s,1.5*s,C.ink);rect(px+5*s,py+12*s,3*s,8*s,'#5d5851');rect(px+16*s,py+12*s,3*s,8*s,'#5d5851')}
const sheep=[{x:87,y:179,s:.62,f:'#f3ead7',h:'#8e846f'},{x:216,y:184,s:.58,f:'#f1d7bf',h:'#987b68'},{x:305,y:194,s:.78,f:'#bfd8da',h:'#806f67',need:true},{x:397,y:224,s:.82,f:'#f2e3b3',h:'#917d62',graze:true,give:true},{x:121,y:236,s:.96,f:'#d8d7ce',h:'#756d66'},{x:232,y:243,s:1.10,f:C.self,h:C.selfHead,self:true}];
function drawWorldSheep(o,i){const bob=(Math.sin((tick+i*13)/12)>0?0:1),px=Math.round(o.x),py=Math.round(o.y-bob);if(o.self)rect(px-4*o.s,py+22*o.s,23*o.s,3*o.s,'rgba(255,248,195,.30)');sheepBody(px,py,o.s,o.f,o.h,o.graze);if(o.need)needWave(px+32*o.s,py+6*o.s,true);if(o.give)cloth(px-6,py+20,1);if(o.self&&selfNeed)needWave(px+32*o.s,py+6*o.s,true);if(o.self&&selfOffer)cloth(px-6,py+20,1)}
function drawWorld(){const ws=weatherSky();rect(0,0,W,92,ws.top);rect(0,92,W,46,ws.bottom);drawWeatherClouds();mountains();fill([[0,159],[60,159],[60,155],[126,155],[126,160],[192,160],[192,157],[260,157],[260,162],[330,162],[330,158],[398,158],[398,163],[480,163],[480,300],[0,300]],C.hill);fill([[0,185],[48,185],[48,181],[112,181],[112,186],[174,186],[174,183],[238,183],[238,188],[300,188],[300,183],[352,183],[352,189],[420,189],[420,185],[480,185],[480,300],[0,300]],C.hill2);river();fill([[0,214],[55,214],[55,210],[118,210],[118,215],[180,215],[180,211],[242,211],[242,216],[314,216],[314,223],[350,223],[350,232],[331,232],[331,244],[320,244],[320,300],[0,300]],C.grass);fill([[405,216],[480,216],[480,300],[389,300],[389,280],[396,280],[396,260],[401,260]],C.grass);fill([[0,265],[52,265],[52,261],[115,261],[115,266],[184,266],[184,262],[248,262],[248,268],[308,268],[308,263],[340,263],[340,300],[0,300]],C.grass2);tree(424,189,.85,false);const flowers=[[31,230,C.flower1],[73,242,C.flower2],[157,222,C.flower3],[201,249,C.flower1],[277,228,C.flower2],[316,244,C.flower3],[443,239,C.flower1]];flowers.forEach((f,j)=>rect(f[0],f[1]+((tick+j*17)%80===0?-1:0),2,2,f[2]));for(let i=0;i<42;i++){const gx=(i*71+23)%470,gy=218+((i*37+19)%76);if(Math.abs(gx-242)>48||Math.abs(gy-246)>28)rect(gx,gy,1+(i%3===0),2+(i%4===0),i%2?C.grass3:'#6fc355')}sheep.forEach(drawWorldSheep)}
function detailSheep(){rect(0,0,W,106,C.sky2);fill([[0,126],[55,126],[55,118],[122,118],[122,124],[196,124],[196,116],[270,116],[270,123],[345,123],[345,117],[410,117],[410,123],[480,123],[480,300],[0,300]],'#a6dc83');fill([[0,169],[80,169],[80,163],[170,163],[170,171],[258,171],[258,164],[345,164],[345,172],[430,172],[430,166],[480,166],[480,300],[0,300]],'#83cc64');rect(0,224,W,76,C.grass);tree(50,147,1.8,true);if(!feedOpened)feed(145,229,2.15);for(let i=0;i<8;i++){rect(343+i*11,190+i*5,5,2,i%2?'#d9c796':'#c8b787')}const bob=(Math.sin(tick/14)>0?0:1),px=178,py=145-bob;rect(px-10,py+92,120,10,'rgba(255,248,195,.42)');rect(px,py+18,96,48,C.self);rect(px+12,py,64,82,C.self);rect(px+30,py-14,34,100,C.self);rect(px-6,py+30,18,26,'#c9dfb0');rect(px+78,py+24,20,32,'#abc892');rect(px+19,py+9,18,12,'#d4e7c2');rect(px+54,py+4,17,13,'#aac690');rect(px+5,py+52,18,14,'#aac690');rect(px+62,py+61,21,14,'#d2e5be');rect(px+80,py+24,45,40,C.selfHead);rect(px+118,py+30,14,15,C.selfHead);rect(px+72,py+27,13,12,C.selfHead);rect(px+87,py+20,12,7,'#8c7f6e');rect(px+103,py+34,5,5,C.ink);rect(px+111,py+36,4,4,C.ink);rect(px+119,py+45,6,2,'#645c52');rect(px+22,py+76,12,33,'#5d5851');rect(px+67,py+76,12,33,'#5d5851');rect(px+20,py+105,16,6,'#4f4b46');rect(px+65,py+105,16,6,'#4f4b46');if((tick%28)<14){rect(px+17,py+27,7,4,'#dceccc');rect(px+48,py+18,6,4,'#dceccc')}else{rect(px+20,py+30,7,4,'#dceccc');rect(px+51,py+21,6,4,'#dceccc')}needWave(127,258,selfNeed);cloth(332,252,1.7);if(selfOffer){rect(336,255,20,2,'#c78f58');rect(336,259,14,2,'#c78f58')}}
function render(){ctx.clearRect(0,0,W,H);mode==='world'?drawWorld():detailSheep()}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
c.addEventListener('mousemove',e=>{if(mode!=='world'){c.style.cursor='default';return}const p=point(e);c.style.cursor=Math.hypot(p.x-247,p.y-247)<32?'pointer':'default'});
c.addEventListener('click',e=>{if(mode!=='world')return;const p=point(e);if(Math.hypot(p.x-247,p.y-247)<32){mode='focus';stage.classList.add('focus');document.getElementById('hint').style.display='none'}});
back.addEventListener('click',()=>{mode='world';stage.classList.remove('focus')});
function pulseLabel(el){el.classList.add('show-label');setTimeout(()=>el.classList.remove('show-label'),1400)}
document.getElementById('worldNeed').addEventListener('click',e=>{e.stopPropagation();pulseLabel(e.currentTarget)});document.getElementById('worldGive').addEventListener('click',e=>{e.stopPropagation();pulseLabel(e.currentTarget)});
document.getElementById('careHit').addEventListener('click',e=>pulseLabel(e.currentTarget));
document.getElementById('departHit').addEventListener('click',e=>{pulseLabel(e.currentTarget);showToast('今天有一条与你有关的路')});
document.getElementById('feedHit').addEventListener('click',()=>{if(feedOpened){showToast('今天的灵粮已经打开过');return}localStorage.setItem(FEED_KEY,'1');feedOpened=true;showToast('灵粮已开启 · 本次之后不再出现');const w=window.open(MEDIA_URL,'_blank','noopener,noreferrer');if(!w)window.location.href=MEDIA_URL});
document.getElementById('askHit').addEventListener('click',()=>{selfNeed=!selfNeed;localStorage.setItem(NEED_KEY,selfNeed?'1':'0');showToast(selfNeed?'已让牧场看见你的需要':'已收起这个需要')});
document.getElementById('offerHit').addEventListener('click',()=>{selfOffer=!selfOffer;localStorage.setItem(OFFER_KEY,selfOffer?'1':'0');showToast(selfOffer?'已把一份给予放到牧场':'已收起这份给予')});
function loop(){tick++;render();setTimeout(()=>requestAnimationFrame(loop),100)}render();requestAnimationFrame(loop)})();
</script>
</body>
</html>
