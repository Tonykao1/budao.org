<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>同路 · 原野｜我的牧草 Canvas 预览</title>
<style>
:root{
  --ink:#173f73; --cream:#fffaf0; --green:#c8f09a; --green2:#aee77c;
  --scrollInk:#4b301b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92ddfa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
.scene{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#92ddfa}

/* ===== SKY ===== */
.sky-zone{position:fixed;z-index:20;left:0;right:0;top:0;height:43vh;min-height:310px;pointer-events:auto}
.sky-ui{position:absolute;inset:0;padding:30px 46px 20px;opacity:0;transform:translateY(-8px);transition:opacity .15s steps(3,end),transform .15s steps(3,end);pointer-events:none}
.sky-zone:hover .sky-ui,.sky-zone:focus-within .sky-ui,.sky-zone.book-open .sky-ui{opacity:1;transform:translateY(0)}
.pixel{background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(14,42,81,.14);position:relative}
.pixel:before,.pixel:after{content:"";position:absolute;width:8px;height:8px;background:inherit;border-color:var(--ink);border-style:solid}
.pixel:before{left:-7px;top:-7px;border-width:3px 0 0 3px}.pixel:after{right:-7px;bottom:-7px;border-width:0 3px 3px 0}
.topline{display:grid;grid-template-columns:230px 310px minmax(600px,1fr) 260px;gap:26px;align-items:start;max-width:1500px;margin:0 auto}
.brand{padding:10px 4px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55)}
.brand .zh{font-weight:900;font-size:42px;line-height:1;letter-spacing:.07em}.brand .en{margin-top:6px;font:800 12px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:#4c75a2}.brand .sub{margin-top:8px;font-size:14px;letter-spacing:.08em;color:#527ca9}
.identity{height:140px;padding:17px 18px;display:flex;gap:18px;align-items:center}
.avatar{width:78px;height:92px;flex:0 0 auto;border:3px solid #9ab7d3;background:#dff2fb;image-rendering:pixelated}
.avatar svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.idtext{min-width:0;color:var(--ink)}.idtext .name{font-size:24px;font-weight:900;margin-bottom:5px}.idtext .bid{font:700 14px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;color:#4d6f95;margin-bottom:8px}.idtext .state{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:#2a9837;margin-bottom:8px}.state-dot{width:10px;height:10px;background:#25b53b;border-radius:50%}.idtext .days{font-size:15px;font-weight:800;color:#234c7a}
.actions{display:grid;grid-template-columns:repeat(4,minmax(132px,1fr));gap:14px 16px;align-content:start;padding-top:1px}
.pbtn{height:60px;display:flex;align-items:center;justify-content:center;gap:11px;color:var(--ink);font-size:17px;font-weight:900;letter-spacing:.02em;cursor:default;pointer-events:auto;user-select:none;transition:transform .08s steps(2,end)}
.pbtn.clickable{cursor:pointer}.pbtn:hover{transform:translate(-1px,-1px)}
.pbtn.primary{background:linear-gradient(180deg,var(--green) 0%,var(--green2) 100%);height:62px;width:calc(100% + 2px);margin:-1px}
.pbtn.primary:before,.pbtn.primary:after{background:var(--green2)}
.pbtn.grass-active{background:#f5e5b8}.pbtn.grass-active:before,.pbtn.grass-active:after{background:#f5e5b8}
.icon{width:31px;height:31px;display:block;image-rendering:pixelated}.icon svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.badge{position:absolute;right:5px;top:-10px;min-width:22px;height:22px;padding:0 5px;border:2px solid #9e2b26;background:#f05249;color:white;font:900 12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
.public-screen{min-height:140px;padding:14px 16px 16px;background:rgba(255,250,240,.96);color:var(--ink);display:flex;flex-direction:column}
.public-screen .head{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:2px solid #d8e2ec}.public-screen .head strong{font-size:17px;font-weight:900}.public-screen .kind{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#597b9f;border:2px solid #7795b3;padding:4px 6px;background:#edf6ff}.public-screen .message{flex:1;display:flex;align-items:center;font-size:15px;line-height:1.75;letter-spacing:.03em;color:#31547e;padding:12px 1px 8px}.public-screen .foot{font-size:11px;color:#738da8;text-align:right}
.sky-zone.returning .sky-ui{opacity:0!important;transform:translateY(-8px)!important}

/* ===== TRUE PIXEL SCROLL ===== */
.book-layer{position:fixed;z-index:35;left:0;right:0;top:165px;bottom:0;display:flex;align-items:center;justify-content:center;padding:18px 28px 28px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .16s steps(3,end),transform .16s steps(3,end)}
body.grassbook-open .book-layer{opacity:1;transform:translateY(0);pointer-events:auto}
body.grassbook-open .sky-zone{height:205px;min-height:205px}
body.grassbook-open .sky-ui{padding-top:18px}
body.grassbook-open .identity,body.grassbook-open .public-screen,body.grassbook-open .brand,body.grassbook-open .pbtn:not(#grassBookBtn){opacity:.20}
body.grassbook-open #grassBookBtn{opacity:.58}

.book-object{position:relative;width:min(1280px,94vw);aspect-ratio:2/1;max-height:calc(100vh - 205px)}
.book-canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.book-text{position:absolute;inset:0;color:var(--scrollInk);pointer-events:none;font-family:STKaiti,KaiTi,"Songti SC",serif}
.book-text button,.book-text textarea,.book-text select,.book-text input,.book-text [role="button"]{pointer-events:auto}

/* crisp text overlays placed over canvas artwork */
.cover-title{position:absolute;left:4.2%;top:22%;width:20%;text-align:center;font-size:clamp(24px,2.4vw,40px);font-weight:900;letter-spacing:.08em}
.cover-name{position:absolute;left:4.2%;top:75%;width:20%;text-align:center;font:900 clamp(18px,1.8vw,28px)/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.page-date{position:absolute;left:31%;top:9.5%;width:27%;text-align:center;font-size:clamp(14px,1.35vw,22px);font-weight:700;letter-spacing:.06em}
.prompt-one{position:absolute;left:32%;top:20.2%;width:25%;text-align:center;font-size:clamp(13px,1.1vw,18px);font-weight:700}
.ref-display{position:absolute;left:35.4%;top:27%;width:18.5%;height:8%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.45vw,24px);font-weight:900;cursor:pointer;outline:0}
.prompt-two{position:absolute;left:32%;top:39%;width:25%;text-align:center;font-size:clamp(13px,1.1vw,18px);font-weight:700}
.note-wrap{position:absolute;left:33%;top:45%;width:24%;height:21%;pointer-events:auto}
.note-input{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--scrollInk);padding:2% 3%;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:clamp(15px,1.25vw,20px);line-height:1.72;overflow:hidden}
.note-input::placeholder{color:rgba(75,48,27,.38)}
.note-count{position:absolute;right:0;bottom:-12px;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.08}
.leave-btn{position:absolute;left:41.3%;top:69.2%;width:8.8%;height:6%;border:0;background:transparent;color:#f3dfb8;font-family:STKaiti,KaiTi,"Songti SC",serif;font-weight:900;font-size:clamp(13px,1.05vw,17px);cursor:pointer}
.archive-title{position:absolute;left:69%;top:10%;width:23%;text-align:center;font-size:clamp(20px,1.8vw,30px);font-weight:900;letter-spacing:.07em}
.archive-label{position:absolute;top:34%;width:9%;text-align:center;font-size:clamp(11px,.95vw,15px);font-weight:700}
.a1{left:66.1%}.a2{left:76.2%}.a3{left:86.2%}
.reunion-title{position:absolute;left:69%;top:44%;width:23%;text-align:center;font-size:clamp(17px,1.5vw,24px);font-weight:900}
.reunion-meta{position:absolute;left:70%;top:54.3%;width:21%;text-align:center;font:700 clamp(10px,.9vw,13px)/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.reunion-note{position:absolute;left:70.5%;top:59%;width:20%;font-size:clamp(13px,1.15vw,18px);line-height:1.65}
.reunion-hidden{display:none}
.close-book{position:absolute;right:2.9%;bottom:4.5%;border:0;background:transparent;color:#5a381e;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:clamp(13px,1vw,16px);font-weight:900;cursor:pointer;opacity:.78}

/* scripture selector - utility only */
.selector{position:absolute;z-index:8;left:35%;top:30%;width:25%;background:#d2a66a;border:4px solid #684321;padding:12px;box-shadow:6px 6px 0 rgba(78,49,25,.22);display:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.selector.open{display:block}
.selector h4{margin:0 0 8px;text-align:center;font-size:15px;color:#4b301b}
.testament{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.testament button,.selector select,.selector input,.selector .done{border:2px solid #76502f;border-radius:0;background:#e5c78c;color:#4b301b;padding:6px}
.testament button.active,.selector .done{background:#87592f;color:#f4dfb3}
.selector-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:6px;margin-bottom:6px}.verse-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px}
.selector .done{display:block;width:100%;margin-top:8px;font-weight:800;cursor:pointer}

body.saved-today .note-input{pointer-events:none}
body.saved-today .leave-btn{display:none}

@media(max-width:1180px){
  .sky-zone{height:52vh}.sky-ui{padding:22px 24px}.topline{grid-template-columns:190px 290px 1fr;gap:18px}.public-screen{grid-column:2/-1;min-height:106px}.brand .zh{font-size:32px}.actions{grid-template-columns:repeat(3,minmax(135px,1fr))}
  .book-layer{top:142px;padding:16px}.book-object{width:97vw}
}
@media(max-width:820px){
  .sky-zone{height:68vh;min-height:520px}.topline{grid-template-columns:1fr 1fr}.brand{display:none}.identity{height:126px}.actions{grid-column:1/-1;grid-template-columns:1fr 1fr;gap:10px}.pbtn{height:54px;font-size:15px}.public-screen{grid-column:1/-1;min-height:100px}
  .book-layer{top:118px;overflow:auto;align-items:flex-start}.book-object{min-width:900px;width:900px}.book-layer{justify-content:flex-start}
}
</style>
</head>
<body>
<iframe class="scene" src="./tonglu-pasture-v20.html" title="同路原野"></iframe>

<div class="sky-zone" aria-label="天空交互区">
  <div class="sky-ui">
    <div class="topline">

        <div class="zh">同路原野</div>

        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" fill="#fff6df" stroke="#1f4f7d" stroke-width="1.5"/><rect x="5" y="5" width="6" height="1" fill="#7da4c6"/><rect x="5" y="8" width="6" height="1" fill="#7da4c6"/><rect x="5" y="11" width="4" height="1" fill="#7da4c6"/></svg></span>风闻有你</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="7" width="5" height="4" fill="#e9eee5"/><rect x="3" y="5" width="3" height="3" fill="#e9eee5"/><rect x="9" y="7" width="5" height="4" fill="#cbd9c7"/><rect x="10" y="5" width="3" height="3" fill="#cbd9c7"/><rect x="6" y="9" width="4" height="3" fill="#7a766c"/></svg></span>同路伙伴</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" fill="#dceafb" stroke="#214d7b" stroke-width="1.3"/><path d="M3 5l5 4 5-4" fill="none" stroke="#214d7b" stroke-width="1.3"/></svg></span>信箱<span class="badge">3</span></div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="#d9ebb4" stroke="#315a83" stroke-width="1.3"/><path d="M5 4v8M10 4v8" stroke="#6d9258" stroke-width="1.2"/><path d="M2 9l4-3 4 2 4-3" fill="none" stroke="#4879a6" stroke-width="1.2"/></svg></span>步道卡</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="#a9bed0" stroke="#224f7a" stroke-width="1.2"/><circle cx="8" cy="8" r="1.5" fill="#fff8e8"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3M3 3l2 2M11 11l2 2M13 3l-2 2M5 11l-2 2" stroke="#224f7a" stroke-width="1.3"/></svg></span>小匣</div>
      </nav>
      <aside class="public-screen pixel" aria-label="公共信息">
        <div class="head"><strong>今日</strong><span class="kind">QUOTE</span></div>

</div>

<section class="book-layer" id="bookLayer" aria-label="我的牧草">
  <div class="book-object">
    <canvas id="grassBookCanvas" class="book-canvas" width="480" height="240" aria-hidden="true"></canvas>
    <div class="book-text">
      <div class="cover-title">我的牧草</div>

      <div class="page-date" id="pageDate"></div>

<script>
(() => {
  const frame = document.querySelector('.scene');
  const skyZone = document.querySelector('.sky-zone');
  const returnNow = document.getElementById('returnNow');
  const grassBookBtn = document.getElementById('grassBookBtn');
  const closeBook = document.getElementById('closeBook');
  const refDisplay = document.getElementById('refDisplay');
  const selector = document.getElementById('selector');
  const selectorDone = document.getElementById('selectorDone');
  const bookSelect = document.getElementById('bookSelect');
  const chapterInput = document.getElementById('chapterInput');
  const verseStart = document.getElementById('verseStart');
  const verseEnd = document.getElementById('verseEnd');
  const noteInput = document.getElementById('noteInput');
  const noteCount = document.getElementById('noteCount');
  const leaveBtn = document.getElementById('leaveBtn');
  const reunionTitle = document.getElementById('reunionTitle');
  const reunionMeta = document.getElementById('reunionMeta');
  const reunionNote = document.getElementById('reunionNote');
  const testamentButtons = [...document.querySelectorAll('[data-testament]')];
  const canvas = document.getElementById('grassBookCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const P = {
    deep:'#684321', edge:'#956033', cover:'#bc8146', cover2:'#c99456',
    paper:'#dfbd82', paperHi:'#ead19a', paperMid:'#d2a66a', stain:'#986333',
    grassD:'#397c34', grassM:'#519946', grassL:'#6db156',
    sky:'#96def6', field:'#78c957', sheep:'#f1eddb', face:'#62584e',
    flower:'#e8e2c9', blue:'#477fd1', ink:'#4b301b'
  };

  function rng(seed){
    let s=seed>>>0;
    return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  }
  const rand=rng(48271936);

  function topEdge(x){
    const pat=[2,2,1,2,0,1,1,0,2,1,0,1,2,2,1,0];
    return 7+pat[Math.floor(x/7)%pat.length];
  }
  function bottomEdge(x){
    const pat=[1,0,2,1,1,2,0,1,2,1,0,2,1,1,0,2];
    return 232-pat[Math.floor(x/8)%pat.length];
  }
  function inBook(x,y){
    return x>=5&&x<=474&&y>=topEdge(x)&&y<=bottomEdge(x);
  }

  function drawPaperBase(){
    ctx.clearRect(0,0,480,240);

    // hard pixel shadow
    ctx.fillStyle='rgba(68,43,21,.28)';
    for(let x=5;x<=474;x++){
      const t=topEdge(x), b=bottomEdge(x);
      ctx.fillRect(x+4,t+5,1,b-t+1);
    }

    // dark outer body
    ctx.fillStyle=P.deep;
    for(let x=5;x<=474;x++){
      const t=topEdge(x), b=bottomEdge(x);
      ctx.fillRect(x,t,1,b-t+1);
    }

    // inner page color by region, one-pixel columns
    for(let x=8;x<=471;x++){
      const t=topEdge(x)+2, b=bottomEdge(x)-2;
      let col=x<132?P.cover2:(x<306?P.paperHi:P.paper);
      ctx.fillStyle=col;
      ctx.fillRect(x,t,1,b-t+1);
    }

    // blocky edge wear
    ctx.fillStyle=P.edge;
    for(let x=9;x<=470;x+=9){
      if((x/9)%3<1.4) ctx.fillRect(x,topEdge(x)+2,5,2);
      if((x/9)%4<1.2) ctx.fillRect(x,bottomEdge(x)-3,6,2);
    }

    // seams
    ctx.fillStyle='#80532e';
    ctx.fillRect(130,10,2,220);
    ctx.fillStyle='#e8cb94';
    ctx.fillRect(132,10,2,220);
    ctx.fillStyle='#9b6a39';
    ctx.fillRect(304,10,2,220);
    ctx.fillStyle='#efd8a4';
    ctx.fillRect(306,10,1,220);

    // deterministic pixel stains / wear
    for(let i=0;i<135;i++){
      const x=10+Math.floor(rand()*458);
      const y=12+Math.floor(rand()*214);
      if(!inBook(x,y)) continue;
      const zone=x<132?0:(x<306?1:2);
      const r=rand();
      ctx.fillStyle=r<.52?(zone===1?P.paperMid:P.edge):P.stain;
      const w=1+Math.floor(rand()*3), h=1+Math.floor(rand()*2);
      ctx.fillRect(x,y,w,h);
    }

    // a few actual pinholes / losses
    const holes=[[17,20,3,2],[112,12,2,3],[468,32,3,2],[463,212,4,2],[318,15,2,2],[78,224,3,2]];
    holes.forEach(([x,y,w,h])=>ctx.clearRect(x,y,w,h));
  }

  function drawOwnerSeal(){
    // blocky seal at cover center
    const x=46,y=98,w=44,h=44;
    ctx.fillStyle=P.deep;
    ctx.fillRect(x+6,y,w-12,h);
    ctx.fillRect(x,y+6,w,h-12);
    ctx.fillStyle='#d6aa6a';
    ctx.fillRect(x+8,y+3,w-16,h-6);
    ctx.fillRect(x+3,y+8,w-6,h-16);
    ctx.fillStyle=P.sky;
    ctx.fillRect(x+8,y+8,28,18);
    ctx.fillStyle=P.field;
    ctx.fillRect(x+8,y+26,28,10);
    ctx.fillStyle='#fff0cf';
    ctx.fillRect(x+11,y+12,8,2); ctx.fillRect(x+17,y+10,9,2);
    // sheep
    ctx.fillStyle=P.sheep;
    ctx.fillRect(x+13,y+23,16,9);
    ctx.fillRect(x+16,y+20,10,4);
    ctx.fillStyle=P.face;
    ctx.fillRect(x+28,y+24,6,6);
    ctx.fillRect(x+16,y+31,2,5); ctx.fillRect(x+25,y+31,2,5);
  }

  function drawTodayPage(){
    // date line and writing guides
    ctx.fillStyle=P.paperMid;
    ctx.fillRect(164,46,108,1);
    // scripture patch
    ctx.fillStyle='#d8ae70';
    ctx.fillRect(170,65,96,18);
    ctx.fillRect(166,69,104,10);
    // writing lines
    ctx.fillStyle='#c59b62';
    [114,128,142].forEach(y=>ctx.fillRect(160,y,116,1));
    // wooden leave tag
    ctx.fillStyle='#704522';
    ctx.fillRect(205,166,38,13);
    ctx.fillStyle='#9b6533';
    ctx.fillRect(202,169,44,8);
    ctx.fillStyle='#c89052';
    ctx.fillRect(206,168,36,2);
  }

  function drawGrassAt(x,y,stage=4,flower=null){
    const px=(dx,dy,col)=>{ctx.fillStyle=col;ctx.fillRect(x+dx,y+dy,3,3)};
    if(stage>=1){px(9,18,P.grassD)}
    if(stage>=2){px(9,15,P.grassD);px(6,18,P.grassM);px(12,18,P.grassM)}
    if(stage>=3){px(9,12,P.grassD);px(6,15,P.grassM);px(12,15,P.grassM);px(3,18,P.grassL);px(15,18,P.grassL)}
    if(stage>=4){
      px(9,9,P.grassD);px(6,12,P.grassM);px(12,12,P.grassM);
      px(3,15,P.grassL);px(15,15,P.grassL);px(0,18,P.grassM);px(18,18,P.grassM);
      if(flower){ctx.fillStyle=flower;ctx.fillRect(x+8,y+5,5,5)}
    }
  }

  function drawScrap(x,y,w,h,shade){
    ctx.fillStyle=P.deep;ctx.fillRect(x+2,y+2,w,h);
    ctx.fillStyle=shade;ctx.fillRect(x,y,w,h);
    ctx.clearRect(x,y,2,2);ctx.clearRect(x+w-2,y+h-2,2,2);
    ctx.fillStyle=P.edge;ctx.fillRect(x+5,y+4,2,2);ctx.fillRect(x+w-9,y+h-6,2,2);
  }

  function drawArchive(showReunion){
    // specimen scraps
    drawScrap(326,58,40,46,'#d8b277');
    drawScrap(375,54,40,48,'#d5ad70');
    drawScrap(424,60,40,44,'#dcb980');
    drawGrassAt(336,72,4,null);
    drawGrassAt(385,68,4,P.blue);
    drawGrassAt(434,74,4,P.flower);

    // separator
    ctx.fillStyle='#b48952';
    ctx.fillRect(329,119,126,1);
    ctx.fillRect(333,117,28,1);
    ctx.fillRect(423,117,28,1);

    if(showReunion){
      drawScrap(330,137,125,50,'#c89557');
      drawGrassAt(340,155,3,null);
    }
  }

  let growthStage=0;
  let showReunion=true;
  function drawBook(){
    drawPaperBase();
    drawOwnerSeal();
    drawTodayPage();
    drawArchive(showReunion);
    if(growthStage>0) drawGrassAt(218,184,growthStage,null);
  }

  const books={
    old:[['创','创世记'],['出','出埃及记'],['利','利未记'],['民','民数记'],['申','申命记'],['书','约书亚记'],['士','士师记'],['得','路得记'],['撒上','撒母耳记上'],['撒下','撒母耳记下'],['王上','列王纪上'],['王下','列王纪下'],['代上','历代志上'],['代下','历代志下'],['拉','以斯拉记'],['尼','尼希米记'],['斯','以斯帖记'],['伯','约伯记'],['诗','诗篇'],['箴','箴言'],['传','传道书'],['歌','雅歌'],['赛','以赛亚书'],['耶','耶利米书'],['哀','耶利米哀歌'],['结','以西结书'],['但','但以理书'],['何','何西阿书'],['珥','约珥书'],['摩','阿摩司书'],['俄','俄巴底亚书'],['拿','约拿书'],['弥','弥迦书'],['鸿','那鸿书'],['哈','哈巴谷书'],['番','西番雅书'],['该','哈该书'],['亚','撒迦利亚书'],['玛','玛拉基书']],
    new:[['太','马太福音'],['可','马可福音'],['路','路加福音'],['约','约翰福音'],['徒','使徒行传'],['罗','罗马书'],['林前','哥林多前书'],['林后','哥林多后书'],['加','加拉太书'],['弗','以弗所书'],['腓','腓立比书'],['西','歌罗西书'],['帖前','帖撒罗尼迦前书'],['帖后','帖撒罗尼迦后书'],['提前','提摩太前书'],['提后','提摩太后书'],['多','提多书'],['门','腓利门书'],['来','希伯来书'],['雅','雅各书'],['彼前','彼得前书'],['彼后','彼得后书'],['约壹','约翰一书'],['约贰','约翰二书'],['约叁','约翰三书'],['犹','犹大书'],['启','启示录']]
  };
  let testament='new';

  function fillBooks(preferred='路'){
    bookSelect.innerHTML='';
    books[testament].forEach(([abbr,name])=>{
      const o=document.createElement('option');o.value=abbr;o.textContent=abbr+' · '+name;
      if(abbr===preferred)o.selected=true;bookSelect.appendChild(o);
    });
  }
  fillBooks();

  testamentButtons.forEach(btn=>btn.addEventListener('click',()=>{
    testament=btn.dataset.testament;
    testamentButtons.forEach(b=>b.classList.toggle('active',b===btn));
    fillBooks(testament==='new'?'路':'诗');
  }));

  function formatRef(){
    const b=bookSelect.value||'路';
    const c=Math.max(1,Number(chapterInput.value)||1);
    let s=Math.max(1,Number(verseStart.value)||1),e=Math.max(1,Number(verseEnd.value)||s);
    if(e<s)[s,e]=[e,s];
    return s===e?b+' '+c+':'+s:b+' '+c+':'+s+'–'+e;
  }

  function setReunionVisibility(){
    const b=bookSelect.value,c=Number(chapterInput.value);
    const s=Math.min(Number(verseStart.value)||1,Number(verseEnd.value)||1);
    const e=Math.max(Number(verseStart.value)||1,Number(verseEnd.value)||1);
    showReunion=b==='路'&&c===6&&e>=6&&s<=10;
    reunionTitle.classList.toggle('reunion-hidden',!showReunion);
    reunionMeta.classList.toggle('reunion-hidden',!showReunion);
    reunionNote.classList.toggle('reunion-hidden',!showReunion);
    drawBook();
  }

  refDisplay.addEventListener('click',()=>selector.classList.toggle('open'));
  refDisplay.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selector.classList.toggle('open')}});
  selectorDone.addEventListener('click',()=>{
    refDisplay.textContent=formatRef();setReunionVisibility();selector.classList.remove('open');
  });

  noteInput.addEventListener('input',()=>{noteCount.textContent=noteInput.value.length});

  function openBook(){
    document.body.classList.add('grassbook-open');
    skyZone.classList.add('book-open');grassBookBtn.classList.add('grass-active');
    drawBook();
  }
  function closeGrassBook(){
    document.body.classList.remove('grassbook-open');
    skyZone.classList.remove('book-open');grassBookBtn.classList.remove('grass-active');
    selector.classList.remove('open');
  }
  grassBookBtn.addEventListener('click',openBook);
  closeBook.addEventListener('click',closeGrassBook);

  function animateGrass(){
    growthStage=0;drawBook();
    [1,2,3,4].forEach((stage,i)=>setTimeout(()=>{growthStage=stage;drawBook()},150*(i+1)));
  }

  leaveBtn.addEventListener('click',()=>{
    if(!noteInput.value.trim()){noteInput.focus();return}
    const saved={ref:refDisplay.textContent,note:noteInput.value.trim(),date:new Date().toISOString().slice(0,10)};
    localStorage.setItem('budao-grass-preview',JSON.stringify(saved));
    document.body.classList.add('saved-today');animateGrass();
  });

  try{
    const saved=JSON.parse(localStorage.getItem('budao-grass-preview')||'null');
    if(saved){
      refDisplay.textContent=saved.ref||'路 6:1–11';noteInput.value=saved.note||'';
      noteCount.textContent=noteInput.value.length;document.body.classList.add('saved-today');growthStage=4;
    }
  }catch(e){}

  function openSelfSheep(){
    closeGrassBook();
    try{
      const win=frame.contentWindow,doc=win.document,cv=doc.querySelector('canvas');if(!cv)return;
      const rect=cv.getBoundingClientRect(),baseW=cv.width||480,baseH=cv.height||300;
      const clientX=rect.left+(247/baseW)*rect.width,clientY=rect.top+(247/baseH)*rect.height;
      skyZone.classList.add('returning');
      cv.dispatchEvent(new win.MouseEvent('click',{bubbles:true,cancelable:true,clientX,clientY,view:win}));
    }catch(err){console.warn(err)}
  }
  returnNow.addEventListener('click',openSelfSheep);
  skyZone.addEventListener('pointerleave',()=>skyZone.classList.remove('returning'));

  const now=new Date();
  document.getElementById('pageDate').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
  drawBook();
})();
</script>
</body>
