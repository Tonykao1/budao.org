<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>同路 · 原野｜天空功能区预览</title>
<style>
:root{
  --ink:#173f73;--ink2:#2b5788;--cream:#fffaf0;--green:#c8f09a;--green2:#aee77c;
  --scroll:#d8b77d;--scroll-light:#ead3a3;--scroll-dark:#8f6537;--scroll-ink:#4e321c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92ddfa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
.scene{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#92ddfa}

/* ===== SKY FUNCTION ZONE ===== */
.sky-zone{position:fixed;z-index:20;left:0;right:0;top:0;height:43vh;min-height:310px;pointer-events:auto}
.sky-ui{position:absolute;inset:0;padding:30px 46px 20px;opacity:0;transform:translateY(-8px);transition:opacity .15s steps(3,end),transform .15s steps(3,end);pointer-events:none}
.sky-zone:hover .sky-ui,.sky-zone:focus-within .sky-ui,.sky-zone.book-open .sky-ui{opacity:1;transform:translateY(0)}
.pixel{background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(14,42,81,.14);position:relative}
.pixel:before,.pixel:after{content:"";position:absolute;width:8px;height:8px;background:inherit;border-color:var(--ink);border-style:solid}
.pixel:before{left:-7px;top:-7px;border-width:3px 0 0 3px}.pixel:after{right:-7px;bottom:-7px;border-width:0 3px 3px 0}
.topline{display:grid;grid-template-columns:230px 310px minmax(600px,1fr) 260px;gap:26px;align-items:start;max-width:1500px;margin:0 auto}
.brand{padding:10px 4px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55)}
.brand .zh{font-weight:900;font-size:42px;line-height:1;letter-spacing:.07em}.brand .en{margin-top:6px;font:800 12px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:#4c75a2}.brand .sub{margin-top:8px;font-size:14px;letter-spacing:.08em;color:#527ca9}
.identity{height:140px;padding:17px 18px;display:flex;gap:18px;align-items:center}
.avatar{width:78px;height:92px;flex:0 0 auto;border:3px solid #9ab7d3;background:#dff2fb;image-rendering:pixelated}
.avatar svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.idtext{min-width:0;color:var(--ink)}.idtext .name{font-size:24px;font-weight:900;margin-bottom:5px}.idtext .bid{font:700 14px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;color:#4d6f95;margin-bottom:8px}.idtext .state{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:#2a9837;margin-bottom:8px}.state-dot{width:10px;height:10px;background:#25b53b;border-radius:50%}.idtext .days{font-size:15px;font-weight:800;color:#234c7a}
.actions{display:grid;grid-template-columns:repeat(4,minmax(132px,1fr));gap:14px 16px;align-content:start;padding-top:1px}
.pbtn{height:60px;display:flex;align-items:center;justify-content:center;gap:11px;color:var(--ink);font-size:17px;font-weight:900;letter-spacing:.02em;cursor:default;pointer-events:auto;user-select:none;transition:transform .08s steps(2,end),background .08s steps(2,end)}
.pbtn.clickable{cursor:pointer}.pbtn:hover{transform:translate(-1px,-1px);background:#fffdf7}
.pbtn.primary{background:linear-gradient(180deg,var(--green) 0%,var(--green2) 100%);height:62px;width:calc(100% + 2px);margin:-1px}
.pbtn.primary:before,.pbtn.primary:after{background:var(--green2)}
.pbtn.grass-active{background:#f5e5b8}.pbtn.grass-active:before,.pbtn.grass-active:after{background:#f5e5b8}
.sky-zone.returning .sky-ui{opacity:0!important;transform:translateY(-8px)!important}
.icon{width:31px;height:31px;display:block;image-rendering:pixelated}.icon svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.badge{position:absolute;right:5px;top:-10px;min-width:22px;height:22px;padding:0 5px;border:2px solid #9e2b26;background:#f05249;color:white;font:900 12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
.public-screen{min-height:140px;padding:14px 16px 16px;background:rgba(255,250,240,.96);color:var(--ink);display:flex;flex-direction:column}.public-screen .head{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:2px solid #d8e2ec}.public-screen .head strong{font-size:17px;font-weight:900}.public-screen .kind{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#597b9f;border:2px solid #7795b3;padding:4px 6px;background:#edf6ff}.public-screen .message{flex:1;display:flex;align-items:center;font-size:15px;line-height:1.75;letter-spacing:.03em;color:#31547e;padding:12px 1px 8px}.public-screen .foot{font-size:11px;color:#738da8;text-align:right}

/* ===== MY GRASS BOOK ===== */
.book-layer{position:fixed;z-index:35;left:0;right:0;top:154px;bottom:0;display:flex;align-items:center;justify-content:center;padding:28px 36px 34px;pointer-events:none;opacity:0;transform:translateY(16px);transition:opacity .2s steps(4,end),transform .2s steps(4,end)}
body.grassbook-open .book-layer{opacity:1;transform:translateY(0);pointer-events:auto}
body.grassbook-open .sky-zone{height:210px;min-height:210px}
body.grassbook-open .sky-ui{padding-top:18px}
body.grassbook-open .identity,body.grassbook-open .public-screen{opacity:.66}
body.grassbook-open .brand{opacity:.72}
body.grassbook-open .pbtn:not(#grassBookBtn){opacity:.62}
.book-shell{width:min(1260px,94vw);height:min(650px,calc(100vh - 205px));min-height:520px;display:grid;grid-template-columns:.86fr 1.05fr 1.05fr;position:relative;filter:drop-shadow(0 18px 18px rgba(60,42,19,.18));transform-origin:center top}
.parchment{position:relative;color:var(--scroll-ink);overflow:hidden;background:
radial-gradient(circle at 16% 18%,rgba(89,56,26,.10) 0 2px,transparent 3px),
radial-gradient(circle at 82% 25%,rgba(89,56,26,.08) 0 3px,transparent 4px),
radial-gradient(circle at 70% 78%,rgba(89,56,26,.10) 0 4px,transparent 5px),
linear-gradient(90deg,rgba(102,63,26,.08),transparent 12%,transparent 88%,rgba(102,63,26,.10)),
linear-gradient(180deg,#e8c995 0%,#dfbd84 48%,#d5ad72 100%);
border-top:4px solid #8c6237;border-bottom:5px solid #7b512b}
.parchment:before{content:"";position:absolute;inset:0;pointer-events:none;background:
linear-gradient(90deg,transparent 0 3%,rgba(255,255,255,.08) 3% 5%,transparent 5% 100%),
repeating-linear-gradient(0deg,rgba(82,48,21,.025) 0 1px,transparent 1px 5px)}
.parchment:first-child{border-left:5px solid #7b512b;border-radius:10px 0 0 8px}
.parchment:last-child{border-right:5px solid #7b512b;border-radius:0 10px 8px 0}
.cover{padding:58px 40px 42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:3px solid rgba(93,55,25,.35)}
.cover-title{font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:42px;font-weight:900;letter-spacing:.08em;margin-bottom:24px;text-shadow:0 1px rgba(255,255,255,.18)}
.cover-mark{font-size:30px;color:#557e3c;margin-bottom:22px}
.sheep-medallion{width:164px;height:164px;border-radius:50%;border:7px solid #855b32;background:linear-gradient(#9fe6ff 0 43%,#8fdb67 43%);position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 0 0 3px rgba(238,211,162,.6) inset}
.sheep-medallion .hill{position:absolute;left:-20px;right:-20px;bottom:0;height:70px;background:#76ca56;transform:skewY(-5deg)}
.sheep-medallion .cloud{position:absolute;left:18px;top:24px;width:46px;height:9px;background:#fff7df;box-shadow:18px -7px 0 #fff7df,38px 0 0 #fff7df}
.sheep-pixel{position:absolute;left:49px;top:74px;width:67px;height:44px;background:#f4f0df;border-radius:14px;box-shadow:inset -8px -6px 0 rgba(201,191,171,.28)}
.sheep-pixel:before{content:"";position:absolute;right:-20px;top:12px;width:25px;height:23px;background:#62584e;border-radius:7px}.sheep-pixel:after{content:"";position:absolute;left:10px;bottom:-16px;width:7px;height:18px;background:#554c43;box-shadow:28px 0 0 #554c43}
.cover-name{font:900 28px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}
.cover-sub{margin-top:12px;font-size:12px;letter-spacing:.2em;opacity:.62}
.today-page{padding:36px 46px 28px;border-right:3px solid rgba(93,55,25,.35)}
.page-date{text-align:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:22px;font-weight:700;letter-spacing:.08em;margin-bottom:18px}
.rule{height:2px;background:rgba(100,62,29,.34);margin:0 auto 22px;width:72%}
.prompt{text-align:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:18px;font-weight:700;letter-spacing:.07em;margin:14px 0}
.ref-display{margin:0 auto;width:78%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:14px;background:rgba(255,240,204,.34);border:2px solid rgba(121,77,38,.2);font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:23px;font-weight:800;cursor:pointer}
.ref-display:hover{background:rgba(255,244,215,.58)}
.note-wrap{width:78%;margin:0 auto;position:relative}
.note-input{width:100%;height:132px;resize:none;border:0;outline:0;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(101,65,32,.18) 31px 32px);color:var(--scroll-ink);padding:6px 8px;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:19px;line-height:32px;overflow:hidden}
.note-input::placeholder{color:rgba(78,50,28,.38)}
.note-count{text-align:right;font-size:11px;opacity:.5;margin-top:4px}
.leave-btn{display:block;margin:16px auto 0;background:#966435;color:#f8e9c9;border:3px solid #684321;padding:8px 28px;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:18px;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 rgba(74,46,21,.18)}
.leave-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(74,46,21,.18)}
.grass-stage{height:86px;margin-top:8px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.grass-sprout{width:76px;height:64px;position:relative;transform-origin:50% 100%;transform:scaleY(.12);opacity:0;transition:transform .75s steps(5,end),opacity .12s}
.grass-stage.grown .grass-sprout{transform:scaleY(1);opacity:1}
.blade{position:absolute;bottom:0;width:10px;background:#4f9a3f;border-radius:2px 2px 0 0;transform-origin:bottom}
.blade:nth-child(1){left:34px;height:58px}.blade:nth-child(2){left:18px;height:44px;transform:rotate(-24deg)}.blade:nth-child(3){left:49px;height:47px;transform:rotate(24deg)}.blade:nth-child(4){left:29px;height:39px;transform:rotate(-8deg);background:#69ae4d}.blade:nth-child(5){left:43px;height:34px;transform:rotate(10deg);background:#69ae4d}
.archive-page{padding:34px 34px 24px}
.archive-title{text-align:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:30px;font-weight:900;letter-spacing:.08em;margin-bottom:16px}
.grass-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 26px}
.grass-card{background:rgba(239,211,159,.58);border:2px solid rgba(116,73,34,.25);padding:10px 7px 9px;text-align:center;min-height:126px}
.card-grass{height:72px;position:relative}.card-grass:before{content:"";position:absolute;left:50%;bottom:4px;width:9px;height:52px;background:#559d42;box-shadow:-17px 11px 0 -1px #6aad50,17px 12px 0 -1px #6aad50,-7px 20px 0 -2px #559d42,8px 22px 0 -2px #559d42;transform:translateX(-50%)}
.grass-card:nth-child(2) .card-grass:after{content:"";position:absolute;left:49%;top:11px;width:11px;height:11px;background:#457bd3;box-shadow:8px 6px 0 #457bd3,-8px 6px 0 #457bd3}
.grass-card:nth-child(3) .card-grass:after{content:"";position:absolute;left:54%;top:16px;width:9px;height:9px;background:#f2efd8;box-shadow:7px 6px 0 #f2efd8,-7px 7px 0 #f2efd8}
.grass-card b{font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:17px}
.reunion-title{display:flex;align-items:center;gap:12px;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:24px;font-weight:900;margin:4px 0 12px}.reunion-title:before,.reunion-title:after{content:"";height:2px;background:rgba(101,63,29,.36);flex:1}
.reunion{background:rgba(239,211,159,.47);border:2px solid rgba(116,73,34,.24);padding:13px 16px;min-height:120px;transition:opacity .2s}
.reunion.hidden{opacity:.22}.reunion.hidden .reunion-note{visibility:hidden}
.reunion-meta{font-size:13px;text-align:center;margin-bottom:8px}.reunion-note{font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:18px;line-height:1.65}
.close-book{position:absolute;right:12px;bottom:10px;border:0;background:transparent;color:var(--scroll-ink);font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:17px;font-weight:800;cursor:pointer;padding:7px 10px}.close-book:hover{text-decoration:underline}

/* selector */
.selector{position:absolute;z-index:5;left:50%;top:110px;transform:translateX(-50%);width:min(360px,88%);background:#ead3a3;border:4px solid #79502b;padding:14px;box-shadow:8px 8px 0 rgba(78,49,25,.22);display:none}
.selector.open{display:block}
.selector h4{margin:0 0 10px;text-align:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:18px}
.testament{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.testament button,.selector select,.selector input,.selector .done{border:2px solid #7d5731;background:#f3deb6;color:#4e321c;padding:7px 8px}
.testament button.active{background:#9f7342;color:#fff0cd}
.selector-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;margin-bottom:8px}.verse-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.selector .done{display:block;width:100%;margin-top:10px;background:#8f6235;color:#fff0d0;font-weight:800;cursor:pointer}

/* saved note */
body.saved-today .note-input{pointer-events:none;color:#4e321c}
body.saved-today .leave-btn{display:none}

/* ===== responsive ===== */
@media(max-width:1180px){
  .sky-zone{height:52vh}.sky-ui{padding:22px 24px}.topline{grid-template-columns:190px 290px 1fr;gap:18px}.public-screen{grid-column:2 / -1;min-height:106px}.brand .zh{font-size:32px}.actions{grid-template-columns:repeat(3,minmax(135px,1fr))}
  .book-layer{top:138px;padding:20px}.book-shell{width:96vw;grid-template-columns:.75fr 1fr 1fr}.cover{padding:46px 24px}.cover-title{font-size:34px}.sheep-medallion{width:130px;height:130px}.sheep-pixel{left:38px;top:58px;transform:scale(.82)}.today-page{padding:30px 28px}.archive-page{padding:30px 24px}
}
@media(max-width:820px){
  .sky-zone{height:68vh;min-height:520px}.topline{grid-template-columns:1fr 1fr}.brand{display:none}.identity{height:126px}.actions{grid-column:1 / -1;grid-template-columns:1fr 1fr;gap:10px}.pbtn{height:54px;font-size:15px}.public-screen{grid-column:1 / -1;min-height:100px}
  .book-layer{top:120px;overflow:auto;align-items:flex-start}.book-shell{height:auto;min-height:0;grid-template-columns:1fr;width:94vw}.cover,.today-page,.archive-page{min-height:480px;border-right:0;border-bottom:3px solid rgba(93,55,25,.35)}body.grassbook-open .sky-zone{height:160px;min-height:160px}
}
</style>
</head>
<body>
<iframe class="scene" src="./tonglu-pasture-v20.html" title="同路原野"></iframe>

<div class="sky-zone" aria-label="天空交互区">
  <div class="sky-ui">
    <div class="topline">
      <div class="brand">
        <div class="zh">同路原野</div>
        <div class="en">TONGLU FIELD</div>
        <div class="sub">与同伴·在路上</div>
      </div>

      <section class="identity pixel" aria-label="身份信息">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 16 19">
            <rect width="16" height="19" fill="#dff2fb"/>
            <rect x="4" y="2" width="8" height="2" fill="#6b4937"/><rect x="3" y="4" width="10" height="3" fill="#80583d"/>
            <rect x="4" y="7" width="8" height="6" fill="#efc690"/>
            <rect x="5" y="9" width="2" height="1" fill="#3c332c"/><rect x="9" y="9" width="2" height="1" fill="#3c332c"/>
            <rect x="7" y="11" width="2" height="1" fill="#b96f5f"/>
            <rect x="3" y="13" width="10" height="5" fill="#77a95e"/><rect x="1" y="15" width="2" height="3" fill="#527b43"/><rect x="13" y="15" width="2" height="3" fill="#527b43"/>
          </svg>
        </div>
        <div class="idtext">
          <div class="name">Tony</div>
          <div class="bid">Budao ID 4827 1936</div>
          <div class="state"><span class="state-dot"></span>已归来</div>
          <div class="days">▣&nbsp;&nbsp;同行 1 天</div>
        </div>
      </section>

      <nav class="actions" aria-label="功能入口">
        <div class="pbtn pixel primary clickable" id="returnNow">
          <span class="icon"><svg viewBox="0 0 16 16"><rect x="3" y="5" width="8" height="6" fill="#f3eee0"/><rect x="5" y="3" width="5" height="9" fill="#f3eee0"/><rect x="10" y="6" width="4" height="4" fill="#776c61"/><rect x="12" y="7" width="2" height="1" fill="#37322e"/><rect x="4" y="11" width="2" height="3" fill="#655d55"/><rect x="8" y="11" width="2" height="3" fill="#655d55"/></svg></span>
          归回自己
        </div>
        <div class="pbtn pixel clickable" id="grassBookBtn"><span class="icon"><svg viewBox="0 0 16 16"><path d="M2 3h5c1 0 2 .6 2 1.5V14c0-1-.8-1.5-2-1.5H2z" fill="#fff1d5" stroke="#234e7a" stroke-width="1.2"/><path d="M14 3H9c-1 0-2 .6-2 1.5V14c0-1 .8-1.5 2-1.5h5z" fill="#fff6e3" stroke="#234e7a" stroke-width="1.2"/></svg></span>我的牧草</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" fill="#fff6df" stroke="#1f4f7d" stroke-width="1.5"/><rect x="5" y="5" width="6" height="1" fill="#7da4c6"/><rect x="5" y="8" width="6" height="1" fill="#7da4c6"/><rect x="5" y="11" width="4" height="1" fill="#7da4c6"/></svg></span>风闻有你</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="7" width="5" height="4" fill="#e9eee5"/><rect x="3" y="5" width="3" height="3" fill="#e9eee5"/><rect x="9" y="7" width="5" height="4" fill="#cbd9c7"/><rect x="10" y="5" width="3" height="3" fill="#cbd9c7"/><rect x="6" y="9" width="4" height="3" fill="#7a766c"/></svg></span>同路伙伴</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" fill="#dceafb" stroke="#214d7b" stroke-width="1.3"/><path d="M3 5l5 4 5-4" fill="none" stroke="#214d7b" stroke-width="1.3"/></svg></span>信箱<span class="badge">3</span></div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="#d9ebb4" stroke="#315a83" stroke-width="1.3"/><path d="M5 4v8M10 4v8" stroke="#6d9258" stroke-width="1.2"/><path d="M2 9l4-3 4 2 4-3" fill="none" stroke="#4879a6" stroke-width="1.2"/></svg></span>步道卡</div>
        <div class="pbtn pixel"><span class="icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="#a9bed0" stroke="#224f7a" stroke-width="1.2"/><circle cx="8" cy="8" r="1.5" fill="#fff8e8"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3M3 3l2 2M11 11l2 2M13 3l-2 2M5 11l-2 2" stroke="#224f7a" stroke-width="1.3"/></svg></span>小匣</div>
      </nav>

      <aside class="public-screen pixel" aria-label="公共信息">
        <div class="head"><strong>今日</strong><span class="kind">QUOTE</span></div>
        <div class="message">路不能让已经走过的路消失；<br>它只能让人继续往前。</div>
        <div class="foot">同路原野</div>
      </aside>
    </div>
  </div>
</div>

<section class="book-layer" id="bookLayer" aria-label="我的牧草">
  <div class="book-shell">
    <section class="parchment cover">
      <div class="cover-title">我的牧草</div>
      <div class="cover-mark">↟</div>
      <div class="sheep-medallion" aria-hidden="true">
        <span class="cloud"></span><span class="hill"></span><span class="sheep-pixel"></span>
      </div>
      <div class="cover-name">Tony</div>
      <div class="cover-sub">一卷属于自己的牧养书卷</div>
    </section>

    <section class="parchment today-page">
      <div class="page-date" id="pageDate">2026年9月18日</div>
      <div class="rule"></div>
      <div class="prompt">选择今天走到哪里</div>
      <div class="ref-display" id="refDisplay" role="button" tabindex="0">路 6:1–11</div>

      <div class="selector" id="selector">
        <h4>经文定位</h4>
        <div class="testament">
          <button type="button" data-testament="old">旧约</button>
          <button type="button" data-testament="new" class="active">新约</button>
        </div>
        <div class="selector-grid">
          <select id="bookSelect" aria-label="书卷"></select>
          <input id="chapterInput" type="number" min="1" value="6" aria-label="章" />
        </div>
        <div class="verse-row">
          <input id="verseStart" type="number" min="1" value="1" aria-label="起始节" />
          <span>—</span>
          <input id="verseEnd" type="number" min="1" value="11" aria-label="结束节" />
        </div>
        <button class="done" id="selectorDone" type="button">定下</button>
      </div>

      <div class="prompt">留下一句话</div>
      <div class="note-wrap">
        <textarea class="note-input" id="noteInput" maxlength="48" placeholder="纸很贵，只留下值得留下的。"></textarea>
        <div class="note-count"><span id="noteCount">0</span>/48</div>
      </div>
      <button class="leave-btn" id="leaveBtn" type="button">留下</button>

      <div class="grass-stage" id="grassStage" aria-label="新长出的牧草">
        <div class="grass-sprout">
          <i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i>
        </div>
      </div>
    </section>

    <section class="parchment archive-page">
      <div class="archive-title">牧草收藏</div>
      <div class="grass-cards">
        <div class="grass-card"><div class="card-grass"></div><b>诗 23</b></div>
        <div class="grass-card"><div class="card-grass"></div><b>约 15</b></div>
        <div class="grass-card"><div class="card-grass"></div><b>太 7:13–14</b></div>
      </div>

      <div class="reunion-title">曾几何时</div>
      <div class="reunion" id="reunion">
        <div class="reunion-meta">2025.04.03　路 6:6–10</div>
        <div class="reunion-note">“耶稣的怜悯，比规条更深。”</div>
      </div>

      <button class="close-book" id="closeBook" type="button">合上 ×</button>
    </section>
  </div>
</section>

<script>
(() => {
  const frame = document.querySelector('.scene');
  const skyZone = document.querySelector('.sky-zone');
  const returnNow = document.getElementById('returnNow');
  const grassBookBtn = document.getElementById('grassBookBtn');
  const closeBook = document.getElementById('closeBook');
  const refDisplay = document.getElementById('refDisplay');
  const selector = document.getElementById('selector');
  const selectorDone = document.getElementById('selectorDone');
  const bookSelect = document.getElementById('bookSelect');
  const chapterInput = document.getElementById('chapterInput');
  const verseStart = document.getElementById('verseStart');
  const verseEnd = document.getElementById('verseEnd');
  const noteInput = document.getElementById('noteInput');
  const noteCount = document.getElementById('noteCount');
  const leaveBtn = document.getElementById('leaveBtn');
  const grassStage = document.getElementById('grassStage');
  const reunion = document.getElementById('reunion');
  const testamentButtons = [...document.querySelectorAll('[data-testament]')];

  const books = {
    old: [
      ['创','创世记'],['出','出埃及记'],['利','利未记'],['民','民数记'],['申','申命记'],
      ['书','约书亚记'],['士','士师记'],['得','路得记'],['撒上','撒母耳记上'],['撒下','撒母耳记下'],
      ['王上','列王纪上'],['王下','列王纪下'],['代上','历代志上'],['代下','历代志下'],['拉','以斯拉记'],
      ['尼','尼希米记'],['斯','以斯帖记'],['伯','约伯记'],['诗','诗篇'],['箴','箴言'],
      ['传','传道书'],['歌','雅歌'],['赛','以赛亚书'],['耶','耶利米书'],['哀','耶利米哀歌'],
      ['结','以西结书'],['但','但以理书'],['何','何西阿书'],['珥','约珥书'],['摩','阿摩司书'],
      ['俄','俄巴底亚书'],['拿','约拿书'],['弥','弥迦书'],['鸿','那鸿书'],['哈','哈巴谷书'],
      ['番','西番雅书'],['该','哈该书'],['亚','撒迦利亚书'],['玛','玛拉基书']
    ],
    new: [
      ['太','马太福音'],['可','马可福音'],['路','路加福音'],['约','约翰福音'],['徒','使徒行传'],
      ['罗','罗马书'],['林前','哥林多前书'],['林后','哥林多后书'],['加','加拉太书'],['弗','以弗所书'],
      ['腓','腓立比书'],['西','歌罗西书'],['帖前','帖撒罗尼迦前书'],['帖后','帖撒罗尼迦后书'],['提前','提摩太前书'],
      ['提后','提摩太后书'],['多','提多书'],['门','腓利门书'],['来','希伯来书'],['雅','雅各书'],
      ['彼前','彼得前书'],['彼后','彼得后书'],['约壹','约翰一书'],['约贰','约翰二书'],['约叁','约翰三书'],
      ['犹','犹大书'],['启','启示录']
    ]
  };

  let testament = 'new';

  function fillBooks(preferred='路'){
    bookSelect.innerHTML = '';
    books[testament].forEach(([abbr,name]) => {
      const o=document.createElement('option');
      o.value=abbr;o.textContent=abbr+' · '+name;
      if(abbr===preferred)o.selected=true;
      bookSelect.appendChild(o);
    });
  }
  fillBooks();

  testamentButtons.forEach(btn => btn.addEventListener('click', () => {
    testament = btn.dataset.testament;
    testamentButtons.forEach(b=>b.classList.toggle('active',b===btn));
    fillBooks(testament==='new'?'路':'诗');
  }));

  function formatRef(){
    const b=bookSelect.value || '路';
    const c=Math.max(1,Number(chapterInput.value)||1);
    let s=Math.max(1,Number(verseStart.value)||1);
    let e=Math.max(1,Number(verseEnd.value)||s);
    if(e<s)[s,e]=[e,s];
    return s===e ? b+' '+c+':'+s : b+' '+c+':'+s+'–'+e;
  }

  function setReunionVisibility(){
    const b=bookSelect.value;
    const c=Number(chapterInput.value);
    let s=Math.min(Number(verseStart.value)||1,Number(verseEnd.value)||1);
    let e=Math.max(Number(verseStart.value)||1,Number(verseEnd.value)||1);
    const overlapsLuke = b==='路' && c===6 && e>=6 && s<=10;
    reunion.classList.toggle('hidden',!overlapsLuke);
  }

  refDisplay.addEventListener('click',()=>selector.classList.toggle('open'));
  refDisplay.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selector.classList.toggle('open')}});

  selectorDone.addEventListener('click',()=>{
    refDisplay.textContent=formatRef();
    setReunionVisibility();
    selector.classList.remove('open');
  });

  noteInput.addEventListener('input',()=>{noteCount.textContent=noteInput.value.length});

  function openBook(){
    document.body.classList.add('grassbook-open');
    skyZone.classList.add('book-open');
    grassBookBtn.classList.add('grass-active');
  }
  function closeGrassBook(){
    document.body.classList.remove('grassbook-open');
    skyZone.classList.remove('book-open');
    grassBookBtn.classList.remove('grass-active');
    selector.classList.remove('open');
  }

  grassBookBtn.addEventListener('click',openBook);
  closeBook.addEventListener('click',closeGrassBook);

  leaveBtn.addEventListener('click',()=>{
    if(!noteInput.value.trim()){
      noteInput.focus();
      return;
    }
    const saved={
      ref:refDisplay.textContent,
      note:noteInput.value.trim(),
      date:new Date().toISOString().slice(0,10)
    };
    localStorage.setItem('budao-grass-preview',JSON.stringify(saved));
    document.body.classList.add('saved-today');
    grassStage.classList.remove('grown');
    requestAnimationFrame(()=>requestAnimationFrame(()=>grassStage.classList.add('grown')));
  });

  try{
    const saved=JSON.parse(localStorage.getItem('budao-grass-preview')||'null');
    if(saved){
      refDisplay.textContent=saved.ref||'路 6:1–11';
      noteInput.value=saved.note||'';
      noteCount.textContent=noteInput.value.length;
      document.body.classList.add('saved-today');
      grassStage.classList.add('grown');
    }
  }catch(e){}

  function openSelfSheep() {
    closeGrassBook();
    try {
      const win = frame.contentWindow;
      const doc = win.document;
      const canvas = doc.querySelector('canvas');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const baseW = canvas.width || 480;
      const baseH = canvas.height || 300;
      const targetX = Math.min(baseW - 1, 247);
      const targetY = Math.min(baseH - 1, 247);
      const clientX = rect.left + (targetX / baseW) * rect.width;
      const clientY = rect.top + (targetY / baseH) * rect.height;
      skyZone.classList.add('returning');
      canvas.dispatchEvent(new win.MouseEvent('click',{bubbles:true,cancelable:true,clientX,clientY,view:win}));
    } catch (err) {
      console.warn('Unable to open self sheep focus state', err);
    }
  }

  returnNow.addEventListener('click',openSelfSheep);
  skyZone.addEventListener('pointerleave',()=>skyZone.classList.remove('returning'));

  const now = new Date();
  document.getElementById('pageDate').textContent =
    now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
})();
</script>
</body>
</html>
