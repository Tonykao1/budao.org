<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>同路 · 数字牧场 v5</title><meta name="theme-color" content="#a8e9ff"/><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8e9ff}body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.stage{position:fixed;inset:0;overflow:hidden;background:#a8e9ff}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}.hint{position:fixed;left:16px;bottom:max(14px,env(safe-area-inset-bottom));font-size:10px;letter-spacing:.08em;color:rgba(50,86,48,.55);pointer-events:none;opacity:0;animation:in 1s ease 1s forwards,out 1s ease 6s forwards}@keyframes in{to{opacity:1}}@keyframes out{to{opacity:0}}</style></head><body><div class="stage"><canvas id="pasture" width="480" height="300" aria-label="同路像素童话牧场 v5"></canvas></div><div class="hint">靠近牧场里的细节</div><script>(()=>{const c=document.getElementById('pasture'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const W=480,H=300;let tick=0,focus='';const C={sky:'#9fe8ff',sky2:'#dff9ff',sun:'#fff1a0',sunHalo:'#fff8c7',mountainFar:'#a7c1d5',mountain:'#789cbb',hill:'#9bd878',hill2:'#7dc85d',grass:'#83d75f',grass2:'#62b94a',grass3:'#4d9d3a',river:'#79dbff',riverLight:'#c9f5ff',riverDark:'#5fc1ea',trunk:'#77644f',tree1:'#6fbe56',tree2:'#95dc74',flower1:'#fff1a0',flower2:'#ffd2ee',flower3:'#d9f6ae',ink:'#564d47',wood:'#aa8059',woodDark:'#806044',chime:'#f4d993',need:'#92b9ff',feed:'#dff19a',give:'#fff6ce'};function fill(poly,color){x.fillStyle=color;x.beginPath();x.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)x.lineTo(poly[i][0],poly[i][1]);x.closePath();x.fill()}function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}function txt(t,a,b,color='#5d544b',size=6){x.fillStyle=color;x.font=`${ py-8*s,10*s,22*s,o.f);rect(px+19*s,py+2*s+g,10*s,10*s,o.h);rect(px+27*s,py+4*s+g,3*s,4*s,o.h);rect(px+17*s,py+3*s+g,3*s,3*s,o.h);rect(px+24*s,py+4*s+g,1.5*s,1.5*s,C.ink);rect(px+5*s,py+12*s,3*s,8*s,'#5d5851');rect(px+16*s,py+12*s,3*s,8*s,'#5d5851');if(o.need)needWave(px+31*s,py+7*s);if(o.give)giveTag(px-6,py+24)}function world(){x.clearRect(0,0,W,H);rect(0,0,W,92,C.sky);rect(0,92,W,46,C.sky2);rect(48,33,18,18,C.sun);rect(44,29,26,26,C.sunHalo);rect(48,33,18,18,C.sun);cloud(65+(tick%480)/15,48,1,.92);cloud(286+(tick%600)/24,66,.85,.72);cloud(400+(tick%720)/30,39,.7,.56);mountains();fill([[0,159],[60,159],[60,155],[126,155],[126,160],[192,160],[192,157],[260,157],[260,162],[330,162],[330,158],[398,158],[398,163],[480,163],[480,300],[0,300]],C.hill);fill([[0,185],[48,185],[48,181],[112,181],[112,186],[174,186],[174,183],[238,183],[238,188],[300,188],[300,183],[352,183],[352,189],[420,189],[420,185],[480,185],[480,300],[0,300]],C.hill2);river();fill([[0,214],[55,214],[55,210],[118,210],[118,215],[180,215],[180,211],[242,211],[242,216],[314,216],[314,223],[350,223],[350,232],[331,232],[331,244],[320,244],[320,300],[0,300]],C.grass);fill([[405,216],[480,216],[480,300],[389,300],[389,280],[396,280],[396,260],[401,260]],C.grass);fill([[0,265],[52,265],[52,261],[115,261],[115,266],[184,266],[184,262],[248,262],[248,268],[308,268],[308,263],[340,263],[340,300],[0,300]],C.grass2);tree(133,177,1,true);chimeText(143,177);tree(424,189,.85,false);sign(271,221);feed(258,250);const flowers=[[31,230,C.flower1],[73,242,C.flower2],[157,222,C.flower3],[201,249,C.flower1],[277,228,C.flower2],[316,244,C.flower3],[443,239,C.flower1]];flowers.forEach((f,j)=>rect(f[0],f[1]+((tick+j*17)%80===0?-1:0),2,2,f[2]));for(let i=0;i<46;i++){const gx=(i*71+23)%470,gy=218+((i*37+19)%76);rect(gx,gy,1+(i%3===0),2+(i%4===0),i%2?C.grass3:'#6fc355')}sheep.forEach(drawSheep)}const hot=[{id:'care',x:145,y:191,r:18},{id:'depart',x:271,y:225,r:20},{id:'feed',x:262,y:253,r:18},{id:'need',x:331,y:202,r:24},{id:'give',x:397,y:245,r:28}];function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}c.addEventListener('mousemove',e=>{const p=pos(e);c.style.cursor=hot.some(h=>Math.hypot(p.x-h.x,p.y-h.y)<h.r)?'pointer':'default'});c.addEventListener('click',e=>{const p=pos(e);let hit='';hot.forEach(h=>{if(Math.hypot(p.x-h.x,p.y-h.y)<h.r)hit=h.id});focus=hit;if(hit)setTimeout(()=>{if(focus===hit)focus=''},2200)});function loop(){tick++;world();setTimeout(()=>requestAnimationFrame(loop),100)}world();requestAnimationFrame(loop)})();</script></body></html>
