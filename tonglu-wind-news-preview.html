<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同路原野｜风闻有你预览</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92ddfa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.scene{position:fixed;inset:0;width:100%;height:100%;border:0;background:#92ddfa}
.layer{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:32px 32px 26px}
.board{position:relative;width:min(1220px,92vw);aspect-ratio:16/9;max-height:88vh}
.board canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.text{position:absolute;inset:0;color:#2d241c;pointer-events:none}
.title{position:absolute;left:35.8%;top:8.9%;width:30%;text-align:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:clamp(30px,3vw,52px);font-weight:900;letter-spacing:.08em}
.note{position:absolute;pointer-events:auto;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.note h3{margin:0 0 8px;font-size:clamp(18px,1.55vw,27px);line-height:1.3}
.note p{margin:0;font-size:clamp(14px,1.15vw,20px);line-height:1.55;color:#4c443d}
.meta{margin-top:12px;font-size:clamp(11px,.9vw,15px);color:#6b6259;display:flex;align-items:center;gap:8px}
.main{left:28.7%;top:33.4%;width:25.6%;height:28%}
.personal{left:57.6%;top:27.2%;width:22.6%;height:15.8%}
.group{left:57.7%;top:47.4%;width:22%;height:13.5%}
.world{left:29.2%;top:64.6%;width:23.8%;height:13.4%}
.workshop{left:57.3%;top:65%;width:23.2%;height:13.8%}
.tag{position:absolute;left:82.2%;top:20.8%;width:6.2%;height:20%;display:flex;align-items:center;justify-content:center;font-family:STKaiti,KaiTi,"Songti SC",serif;font-size:clamp(15px,1.25vw,21px);font-weight:800;writing-mode:vertical-rl;letter-spacing:.08em;color:#47301e}
.brand{position:absolute;left:7.3%;top:4.5%;display:flex;align-items:center;gap:10px;color:#4c80aa;opacity:.92}
.brand .sheep{width:34px;height:28px;image-rendering:pixelated}
.brand strong{font-size:clamp(17px,1.7vw,27px);letter-spacing:.05em}
@media(max-width:900px){.layer{align-items:flex-start;overflow:auto}.board{min-width:980px;width:980px}.layer{justify-content:flex-start}}
</style>
</head>
<body>
<iframe class="scene" src="./tonglu-pasture-v20.html" title="同路原野"></iframe>
<div class="layer">
  <div class="board">
    <canvas id="boardCanvas" width="640" height="360" aria-hidden="true"></canvas>
    <div class="text">
      <div class="brand"><canvas class="sheep" id="brandSheep" width="17" height="14"></canvas><strong>同路 · 数字牧场</strong></div>
      <div class="title">风闻有你</div>

      <article class="note main">
        <h3>百望山的路长了一点</h3>
        <p>本周日线路调整至约7km，<br>山上一起吃饭。</p>
        <div class="meta">↗︎　同路 · 今天</div>
      </article>

      <article class="note personal">
        <h3>有人回应了你的代祷</h3>
        <p>一位伙伴发来近况与感谢。</p>
        <div class="meta">有你 · 2小时前</div>
      </article>

      <article class="note group">
        <h3>周五傍晚温榆河同行</h3>
        <p>本周同道小组照常见面。</p>
        <div class="meta">↗︎　同路 · 今天</div>
      </article>

      <article class="note world">
        <h3>远方正在下雨</h3>
        <p>某地洪灾持续，许多人正在撤离。</p>
        <div class="meta">❉　远方 · 3小时前</div>
      </article>

      <article class="note workshop">
        <h3>第二期工作坊报名开放</h3>
        <p>《市场街的最后一站》欢迎参加。</p>
        <div class="meta">↗︎　同路 · 今天</div>
      </article>

      <div class="tag">风送来好消息</div>
    </div>
  </div>
</div>
<script>
(()=>{
  const c=document.getElementById('boardCanvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const C={woodD:'#7a4b2b',wood:'#9a6338',wood2:'#b97b43',woodHi:'#cd9254',edge:'#5f3d26',paper:'#efe0bd',paper2:'#f5e8ca',blue:'#d6edf2',green:'#dfead8',pink:'#efd1c7',pinR:'#c45d5d',pinG:'#719a48',pinB:'#4c78ae',leaf:'#438345',leaf2:'#5f9f4f',ink:'#2c2119',sky:'#8fdcf4',white:'#f6efd8',bird:'#315a72',orange:'#d58a43'};
  const rr=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  function rect(px,py,w,h,col){x.fillStyle=col;x.fillRect(px,py,w,h)}
  function plank(px,py,w,h){
    rect(px,py,w,h,C.wood);rect(px,py,w,3,C.woodHi);rect(px,py+h-3,w,3,C.woodD);
    for(let i=0;i<8;i++){const yy=py+7+i*4;rect(px+rr(5,w-35),yy,rr(12,34),1,C.wood2)}
  }
  function nail(px,py,col='#52606a'){rect(px,py,4,4,C.edge);rect(px+1,py+1,2,2,col)}
  function paper(px,py,w,h,col,pin){
    rect(px+3,py+3,w,h,'rgba(65,43,26,.24)');rect(px,py,w,h,col);
    rect(px+6,py+4,w-12,1,'rgba(255,255,255,.35)');
    for(let i=0;i<8;i++){const sx=px+rr(3,w-6),sy=py+rr(3,h-5);rect(sx,sy,rr(2,5),1,'rgba(160,120,75,.12)')}
    x.clearRect(px,py,2,2);x.clearRect(px+w-2,py+h-2,2,2);
    if(pin){rect(px+w/2-3,py-4,6,6,C.edge);rect(px+w/2-2,py-3,4,4,pin)}
  }

  x.clearRect(0,0,640,360);
  // legs
  plank(180,270,22,58);plank(438,270,22,58);
  // board planks
  for(let i=0;i<5;i++) plank(145,86+i*39,350,42);
  // edge chunks and nails
  [154,486].forEach(px=>{for(let py=100;py<265;py+=43)nail(px,py)});
  // top title plank
  plank(240,47,190,45);
  nail(247,78);nail(416,78);

  // foliage left
  const vines=[[153,89],[150,101],[147,114],[149,129],[146,145],[150,159],[146,178],[149,198],[145,217],[149,239]];
  vines.forEach(([px,py],i)=>{rect(px,py,5,5,i%2?C.leaf:C.leaf2);rect(px+4,py+2,5,4,C.leaf)});
  rect(155,86,2,158,C.leafD||C.leaf);

  // small bird
  rect(171,63,14,8,C.bird);rect(176,58,8,8,C.bird);rect(181,60,5,5,C.white);rect(184,63,5,3,C.orange);
  rect(169,67,7,4,'#456f88');rect(172,71,9,2,C.edge);

  // weather vane
  rect(470,44,4,43,C.edge);rect(461,42,20,5,C.edge);rect(468,36,18,9,C.white);rect(466,39,8,6,C.white);rect(484,39,4,3,C.orange);
  rect(478,48,14,4,C.edge);rect(490,47,4,7,C.edge);

  // red windsock
  rect(496,49,6,16,C.edge);rect(501,50,35,7,'#e56d64');rect(536,53,22,6,'#ef8479');rect(558,55,16,5,'#f0a08b');

  // hanging tag + string
  rect(498,66,2,24,C.edge);paper(491,88,20,72,'#d9ad68',null);

  // title leaf
  rect(263,62,6,5,C.leaf);rect(267,58,5,5,C.leaf2);

  // papers
  paper(180,101,165,112,C.paper2,C.pinR);
  paper(360,100,124,56,C.paper,C.pinG);
  paper(357,166,128,52,C.blue,C.pinB);
  paper(181,225,160,54,C.green,C.pinB);
  paper(357,226,128,54,C.pink,C.pinR);

  // main image
  rect(192,125,44,31,'#bfe6f4');rect(192,143,44,13,'#6fb85a');rect(196,139,13,17,'#4e8e4f');rect(208,133,15,23,'#46804b');rect(222,141,14,15,'#5f9b50');rect(194,128,15,4,C.white);rect(215,126,13,4,C.white);

  // personal sheep icon
  rect(374,117,15,10,C.white);rect(370,120,6,7,C.white);rect(388,120,6,7,C.face||C.edge);rect(375,127,3,7,C.edge);rect(385,127,3,7,C.edge);

  // group image
  rect(367,178,35,26,'#cbe9f3');rect(367,193,35,11,'#6bb664');rect(370,184,30,8,'#e79b64');rect(373,188,24,5,'#f1cd69');

  // world globe
  rect(195,238,20,20,'#4d85c4');rect(198,240,7,6,'#6fba64');rect(206,247,7,7,'#6fba64');rect(191,244,4,7,'#6fba64');

  // workshop sprout
  rect(372,244,4,14,C.leaf);rect(365,242,9,5,C.leaf2);rect(375,239,9,5,C.leaf);

  // pixel flowers around board
  [[166,92],[154,205],[489,91]].forEach(([px,py])=>{rect(px,py,4,4,C.white);rect(px+4,py+2,4,4,C.white);rect(px+2,py+4,4,4,'#e7c94b')});

  // tiny board splinters
  [[139,136],[493,118],[142,257],[496,239]].forEach(([px,py])=>nail(px,py));

  // title underline shadow pixel
  rect(253,89,164,3,C.woodD);

  const s=document.getElementById('brandSheep'),sx=s.getContext('2d');sx.imageSmoothingEnabled=false;
  sx.fillStyle='#f2efe1';sx.fillRect(3,4,9,6);sx.fillRect(5,2,6,3);sx.fillStyle='#5c554d';sx.fillRect(12,5,4,4);sx.fillRect(5,10,2,4);sx.fillRect(10,10,2,4);
})();
</script>
</body>
</html>
