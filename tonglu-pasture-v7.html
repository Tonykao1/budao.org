<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>同路 · 数字牧场 v7</title>
<meta name="theme-color" content="#a8e9ff"/>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8e9ff}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:#a8e9ff}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.label{position:absolute;z-index:5;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;color:#514a42;font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.02em;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8));white-space:nowrap}.label .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,251,226,.92);padding:5px 8px;border:1px solid rgba(92,78,60,.22);box-shadow:2px 2px 0 rgba(92,78,60,.16);transition:transform .16s ease,background .16s ease}.label:hover .tag,.label:focus-visible .tag{transform:translateY(-2px);background:#fffbe4;outline:none}.label .mark{width:8px;height:8px;display:inline-block;box-shadow:1px 1px 0 rgba(0,0,0,.13)}.label .detail{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);padding:6px 9px;background:rgba(255,255,247,.97);border:1px solid rgba(88,75,58,.2);box-shadow:2px 2px 0 rgba(88,75,58,.13);font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s ease;white-space:nowrap}.label.open .detail{opacity:1}.care{left:30%;top:59%}.depart{left:56.7%;top:70%}.feed{left:53.8%;top:82%}.need{left:69%;top:62%}.give{left:82%;top:78%}.care .mark{background:#f2d37d}.depart .mark{background:#ae835e}.feed .mark{background:#d8ef85}.need .mark{background:#8eb4ff}.give .mark{background:#fff0b7}.self-id{left:48.3%;top:81%;z-index:8}.self-id .tag{background:rgba(247,255,225,.96);border-color:rgba(83,108,64,.26);box-shadow:2px 2px 0 rgba(63,91,48,.14)}.self-id .mark{background:#b8d99e}.self-id.unclaimed .tag{animation:selfPulse 1.8s ease-in-out infinite}.self-id .detail{min-width:210px;text-align:center;line-height:1.55;white-space:normal}.self-id .detail strong{display:block;font-size:13px;margin-bottom:2px}.self-id .detail small{font-size:11px;color:#726b61}.hint{position:fixed;left:16px;bottom:max(14px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.06em;color:rgba(50,86,48,.58);pointer-events:none;opacity:0;animation:in 1s ease 1s forwards,out 1s ease 7s forwards}.arrival{position:fixed;left:50%;bottom:7.5%;z-index:7;transform:translateX(-50%);padding:7px 10px;background:rgba(255,255,244,.94);border:1px solid rgba(81,102,64,.2);box-shadow:2px 2px 0 rgba(81,102,64,.12);font-size:12px;color:#5c6252;opacity:0;pointer-events:none;transition:opacity .28s ease}.arrival.show{opacity:1}@keyframes in{to{opacity:1}}@keyframes out{to{opacity:0}}@keyframes selfPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(max-width:760px){.label{font-size:12px}.label .tag{padding:4px 6px;gap:5px}.label .detail{font-size:11px}.care{left:28%;top:60%}.depart{left:57%;top:70%}.feed{left:54%;top:82%}.need{left:69%;top:63%}.give{left:81%;top:79%}.self-id{left:48%;top:82%}.self-id .detail{min-width:185px}}
</style>
</head>
<body>
<div class="stage">
<canvas id="pasture" width="480" height="300" aria-label="同路像素童话牧场 v7"></canvas>
<button class="label care" data-id="care"><span class="tag"><span class="mark"></span>风铃</span><span class="detail">有人来关心你</span></button>
<button class="label depart" data-id="depart"><span class="tag"><span class="mark"></span>出发</span><span class="detail">一条只与你有关的出发信息</span></button>
<button class="label feed" data-id="feed"><span class="tag"><span class="mark"></span>今日的草</span><span class="detail">今天的灵粮在这里</span></button>
<button class="label need" data-id="need"><span class="tag"><span class="mark"></span>需要帮助</span><span class="detail">这只羊需要一根登山杖</span></button>
<button class="label give" data-id="give"><span class="tag"><span class="mark"></span>给出</span><span class="detail">这只羊愿意给出一本绘本</span></button>
<button id="selfId" class="label self-id" aria-label="我的羊"><span class="tag"><span class="mark"></span><span id="selfText">认领这只羊</span></span><span class="detail" id="selfDetail"></span></button>
</div>
<div class="arrival" id="arrival">它会记得你回来。</div>
<div class="hint" id="hint">先认领属于你的羊</div>
<script>
(()=>{
const c=document.getElementById('pasture'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const W=480,H=300;let tick=0;const KEY='tonglu.sheep.identity.v1';
let identity=null;try{identity=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const selfId=document.getElementById('selfId'),selfText=document.getElementById('selfText'),selfDetail=document.getElementById('selfDetail'),arrival=document.getElementById('arrival'),hint=document.getElementById('hint');
const C={sky:'#9fe8ff',sky2:'#dff9ff',sun:'#fff1a0',sunHalo:'#fff8c7',mountainFar:'#a7c1d5',mountain:'#789cbb',hill:'#9bd878',hill2:'#7dc85d',grass:'#83d75f',grass2:'#62b94a',grass3:'#4d9d3a',river:'#79dbff',riverLight:'#c9f5ff',riverDark:'#5fc1ea',trunk:'#77644f',tree1:'#6fbe56',tree2:'#95dc74',flower1:'#fff1a0',flower2:'#ffd2ee',flower3:'#d9f6ae',ink:'#564d47',wood:'#aa8059',woodDark:'#806044',chime:'#f4d993',need:'#8fb4ff',feed:'#dff19a'};
function fill(p,col){x.fillStyle=col;x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fill()}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}function cloud(cx,cy,s,a=1){x.globalAlpha=a;rect(cx,cy,18*s,5*s,'#fff');rect(cx+6*s,cy-4*s,11*s,9*s,'#fff');rect(cx+15*s,cy+1*s,16*s,4*s,'#fff');x.globalAlpha=1}
function mountains(){fill([[0,132],[20,132],[20,124],[42,124],[42,118],[59,118],[59,122],[72,122],[72,112],[90,112],[90,104],[108,104],[108,112],[124,112],[124,123],[145,123],[145,117],[162,117],[162,109],[182,109],[182,98],[200,98],[200,108],[216,108],[216,121],[236,121],[236,114],[252,114],[252,106],[270,106],[270,115],[288,115],[288,124],[307,124],[307,116],[325,116],[325,108],[342,108],[342,116],[360,116],[360,126],[380,126],[380,117],[399,117],[399,109],[418,109],[418,116],[439,116],[439,125],[460,125],[460,121],[480,121],[480,162],[0,162]],C.mountainFar);fill([[0,153],[28,153],[28,146],[53,146],[53,139],[80,139],[80,144],[107,144],[107,134],[132,134],[132,128],[156,128],[156,135],[182,135],[182,146],[210,146],[210,138],[237,138],[237,132],[263,132],[263,139],[290,139],[290,148],[318,148],[318,141],[346,141],[346,133],[369,133],[369,140],[396,140],[396,149],[421,149],[421,141],[448,141],[448,146],[480,146],[480,177],[0,177]],C.mountain)}
function river(){fill([[322,154],[340,156],[354,161],[360,168],[357,176],[348,183],[341,191],[340,199],[346,207],[359,214],[370,222],[376,232],[377,246],[371,260],[365,276],[361,300],[395,300],[398,282],[406,263],[411,246],[409,229],[401,216],[389,205],[375,195],[370,187],[372,178],[381,169],[386,161],[383,156],[365,151],[345,148]],C.riverDark);fill([[326,155],[341,157],[351,162],[354,168],[351,174],[343,181],[337,188],[336,197],[341,204],[353,211],[365,220],[370,230],[371,243],[365,258],[359,275],[355,300],[387,300],[390,282],[398,262],[403,246],[401,232],[393,219],[382,209],[368,199],[361,191],[362,181],[370,172],[376,164],[373,159],[360,154],[344,151]],C.river);fill([[347,163],[355,165],[357,168],[353,172],[347,176],[345,180],[352,178],[360,173],[364,168],[361,165]],C.riverLight);fill([[350,214],[359,219],[364,225],[365,231],[360,235],[355,229],[351,223]],C.riverLight);fill([[365,264],[370,271],[368,281],[364,288],[361,296],[368,296],[372,284],[376,274],[374,267]],C.riverLight)}
function tree(px,py,s=1,ch=false){rect(px+5*s,py+12*s,3*s,10*s,C.trunk);rect(px,py+5*s,13*s,5*s,C.tree1);rect(px+2*s,py,9*s,6*s,C.tree2);rect(px+3*s,py+9*s,7*s,5*s,'#79ca5f');if(ch){const sw=((tick>>3)%2);rect(px+13*s,py+7*s,2*s,10*s,C.woodDark);rect(px+(11+sw)*s,py+16*s,7*s,3*s,C.chime);rect(px+(13+sw)*s,py+19*s,3*s,5*s,'#fff0ae')}}
function sign(px,py){rect(px,py+6,4,17,C.woodDark);rect(px-12,py,27,10,C.wood);rect(px-9,py+2,17,3,'#d9b27d');rect(px+9,py+3,4,4,C.woodDark)}function feed(px,py){const p=(tick%36<18?0:1);rect(px,py+3,3,10,C.feed);rect(px+4,py-p,3,14,'#d2eb7f');rect(px+8,py+2,3,11,'#e6f5a6');rect(px+3,py-2,3,3,'#fff3a0');rect(px+8,py-1,2,2,'#fff9c4')}function needWave(px,py){const ph=(tick%32)>>3;x.strokeStyle=C.need;x.lineWidth=2;for(let i=0;i<3;i++){const r=5+i*4+ph;x.beginPath();x.arc(px,py,r,-.9,.9);x.stroke()}}function giveFlag(px,py){rect(px,py,3,13,'#8b6b4d');rect(px+3,py,18,8,'#fff1b8');rect(px+6,py+2,12,2,'#c38e61')}
const sheep=[{x:87,y:179,s:.62,f:'#f3ead7',h:'#8e846f'},{x:216,y:184,s:.58,f:'#f1d7bf',h:'#987b68'},{x:305,y:194,s:.78,f:'#bfd8da',h:'#806f67',need:true},{x:394,y:224,s:.82,f:'#f2e3b3',h:'#917d62',graze:true,give:true},{x:121,y:236,s:.96,f:'#d8d7ce',h:'#756d66'},{x:232,y:238,s:1.18,f:'#bfd7a4',h:'#776d60',graze:true,self:true}];
function drawSheep(o,i){const bob=(Math.sin((tick+i*13)/12)>0?0:1),px=Math.round(o.x),py=Math.round(o.y-bob),s=o.s,g=(o.graze&&Math.sin((tick+i*9)/35)>.45)?4:0;if(o.self){rect(px-4*s,py+22*s,22*s,3*s,identity?'rgba(255,248,195,.55)':'rgba(255,248,195,.28)');if(!identity&&((tick>>2)%2===0)){rect(px+2*s,py-13*s,2*s,2*s,'#fff4a6');rect(px+11*s,py-16*s,2*s,2*s,'#fff4a6');rect(px+19*s,py-12*s,2*s,2*s,'#fff4a6')}}rect(px,py,24*s,12*s,o.f);rect(px+4*s,py-5*s,17*s,19*s,o.f);rect(px+8*s,py-8*s,10*s,22*s,o.f);rect(px+19*s,py+2*s+g,10*s,10*s,o.h);rect(px+27*s,py+4*s+g,3*s,4*s,o.h);rect(px+17*s,py+3*s+g,3*s,3*s,o.h);rect(px+24*s,py+4*s+g,1.5*s,1.5*s,C.ink);rect(px+5*s,py+12*s,3*s,8*s,'#5d5851');rect(px+16*s,py+12*s,3*s,8*s,'#5d5851');if(o.need)needWave(px+32*s,py+6*s);if(o.give)giveFlag(px-5,py+21)}
function world(){x.clearRect(0,0,W,H);rect(0,0,W,92,C.sky);rect(0,92,W,46,C.sky2);rect(44,29,26,26,C.sunHalo);rect(48,33,18,18,C.sun);cloud(65+(tick%480)/15,48,1,.92);cloud(286+(tick%600)/24,66,.85,.72);cloud(400+(tick%720)/30,39,.7,.56);mountains();fill([[0,159],[60,159],[60,155],[126,155],[126,160],[192,160],[192,157],[260,157],[260,162],[330,162],[330,158],[398,158],[398,163],[480,163],[480,300],[0,300]],C.hill);fill([[0,185],[48,185],[48,181],[112,181],[112,186],[174,186],[174,183],[238,183],[238,188],[300,188],[300,183],[352,183],[352,189],[420,189],[420,185],[480,185],[480,300],[0,300]],C.hill2);river();fill([[0,214],[55,214],[55,210],[118,210],[118,215],[180,215],[180,211],[242,211],[242,216],[314,216],[314,223],[350,223],[350,232],[331,232],[331,244],[320,244],[320,300],[0,300]],C.grass);fill([[405,216],[480,216],[480,300],[389,300],[389,280],[396,280],[396,260],[401,260]],C.grass);fill([[0,265],[52,265],[52,261],[115,261],[115,266],[184,266],[184,262],[248,262],[248,268],[308,268],[308,263],[340,263],[340,300],[0,300]],C.grass2);tree(132,174,1.18,true);tree(424,189,.85,false);sign(271,217);feed(257,246);const flowers=[[31,230,C.flower1],[73,242,C.flower2],[157,222,C.flower3],[201,249,C.flower1],[277,228,C.flower2],[316,244,C.flower3],[443,239,C.flower1]];flowers.forEach((f,j)=>rect(f[0],f[1]+((tick+j*17)%80===0?-1:0),2,2,f[2]));for(let i=0;i<46;i++){const gx=(i*71+23)%470,gy=218+((i*37+19)%76);rect(gx,gy,1+(i%3===0),2+(i%4===0),i%2?C.grass3:'#6fc355')}sheep.forEach(drawSheep)}
function daysTogether(){if(!identity?.claimedAt)return 1;return Math.max(1,Math.floor((Date.now()-identity.claimedAt)/86400000)+1)}
function syncIdentity(){const claimed=!!identity;selfId.classList.toggle('unclaimed',!claimed);selfText.textContent=claimed?'我的羊':'认领这只羊';if(claimed){selfDetail.innerHTML='<strong>今天在牧场</strong><span>正在慢慢吃草。</span><small>你们已经同行 '+daysTogether()+' 天</small>';hint.textContent='点一下自己的羊，看看它今天怎样';}else{selfDetail.innerHTML='<strong>这只羊在等你</strong><span>认领以后，它就是你在同路里的样子。</span>';hint.textContent='先认领属于你的羊';}}
function claim(){if(!identity){identity={version:1,sheepId:'sage-001',dna:{body:'B2',fleece:'F7',horn:'H0',ear:'E1',eye:'Y3'},claimedAt:Date.now()};localStorage.setItem(KEY,JSON.stringify(identity));syncIdentity();arrival.classList.add('show');setTimeout(()=>arrival.classList.remove('show'),2600);}selfId.classList.toggle('open')}
selfId.addEventListener('click',claim);
document.querySelectorAll('.label:not(.self-id)').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.label').forEach(o=>{if(o!==b)o.classList.remove('open')});b.classList.toggle('open')}));
// 点击画布上的自己的羊，也等同于点“我的羊”。
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;if(Math.hypot(mx-244,my-240)<36)claim()});
syncIdentity();function loop(){tick++;world();setTimeout(()=>requestAnimationFrame(loop),100)}world();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
