<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>营火之地 | 步道</title>
<link rel="stylesheet" href="style.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#050505}
body{background:#050505;color:#f5f1e8;font-family:"PingFang SC","Helvetica Neue",sans-serif;overflow-x:hidden}
nav{position:relative;z-index:20}
.stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.28;animation:twinkle 4s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.45}}
.glow{position:fixed;width:min(920px,82vw);aspect-ratio:1;background:radial-gradient(circle,rgba(255,140,0,.11),transparent 70%);left:50%;top:180px;transform:translateX(-50%);z-index:0;pointer-events:none}

.memory-viewport{position:relative;z-index:2;width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;cursor:grab;touch-action:pan-x pan-y}
.memory-viewport::-webkit-scrollbar{display:none}
.memory-viewport.is-dragging{cursor:grabbing;user-select:none}
.memory-world{position:relative;width:max(168vw,1800px);height:1780px;margin:0 auto}

.top{position:absolute;left:50%;top:250px;width:min(620px,36vw);transform:translateX(-50%);text-align:center;z-index:6}
.top h1{font-size:clamp(58px,5vw,76px);font-weight:200;margin:30px 0 40px;line-height:1.2}
.top p{color:#aaa;line-height:2;font-size:20px}
.spark-link{display:block;text-align:center;color:#666;text-decoration:none;letter-spacing:5px;font-size:16px;font-weight:300;transition:.4s;animation:sparkBreath 3.5s ease-in-out infinite}
.top .spark-link{margin:0 auto}.spark-link:hover{color:#aaa;letter-spacing:7px}
@keyframes sparkBreath{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.bottom-spark{position:relative;z-index:3;margin:24px auto 90px}

.messages-layer,.images-layer{position:absolute;inset:0;pointer-events:none}
.images-layer{z-index:3}.messages-layer{z-index:5}
.message{position:absolute;max-width:460px;line-height:1.75;font-size:clamp(25px,1.7vw,33px);font-weight:200;opacity:0;transform:translateY(22px);word-break:keep-all;padding:0 10px;translate:0 0;transition:opacity .48s ease;animation:fadeUp 1.35s forwards}
.message small{display:block;margin-top:22px;font-size:12px;letter-spacing:4px;color:#555}
.message.is-renewing{opacity:0!important}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes driftA{0%{translate:-5px 2px}50%{translate:6px -4px}100%{translate:-2px 5px}}
@keyframes driftB{0%{translate:4px -3px}50%{translate:-5px 5px}100%{translate:3px 1px}}
.message-1{left:18%;top:120px;width:22%}.message-2{left:67%;top:160px;width:20%;text-align:left}.message-3{left:28%;top:700px;width:24%}.message-4{left:53%;top:900px;width:19%;text-align:center}.message-5{left:76%;top:800px;width:18%}.message-6{left:14%;top:1160px;width:20%}.message-7{left:61%;top:1270px;width:22%;text-align:right}.message-8{left:39%;top:1510px;width:22%;text-align:center}
.message-1,.message-3,.message-6,.message-8{animation-name:fadeUp,driftA;animation-duration:1.35s,32s;animation-delay:.02s,2s;animation-iteration-count:1,infinite;animation-direction:normal,alternate;animation-timing-function:ease,ease-in-out}
.message-2,.message-4,.message-5,.message-7{animation-name:fadeUp,driftB;animation-duration:1.35s,36s;animation-delay:.10s,3s;animation-iteration-count:1,infinite;animation-direction:normal,alternate;animation-timing-function:ease,ease-in-out}

.image-slot{position:absolute;translate:0 0}.image-slot:nth-child(odd){animation:driftA 34s ease-in-out infinite alternate}.image-slot:nth-child(even){animation:driftB 38s ease-in-out infinite alternate}
.image-slot img{display:block;width:100%;height:auto;border-radius:6px;opacity:0;transition:opacity .55s ease;box-shadow:0 0 28px rgba(180,100,20,.035)}
.image-slot img.is-loaded{opacity:1}.image-slot img.is-renewing{opacity:0}
.image-slot-1{left:14.5%;top:390px;width:min(17.5vw,420px)}.image-slot-2{left:39%;top:82px;width:min(10.5vw,185px)}.image-slot-3{left:70%;top:520px;width:min(14vw,320px)}.image-slot-4{left:58%;top:730px;width:min(10.5vw,195px)}.image-slot-5{left:22%;top:860px;width:min(9vw,160px)}.image-slot-6{left:72.5%;top:1090px;width:min(16.5vw,355px)}

@media(max-width:980px){.memory-viewport{overflow-x:hidden;cursor:default}.memory-world{width:90%;height:auto;margin:auto;padding:90px 0 130px}.top{position:relative;left:auto;top:auto;width:100%;transform:none;margin-bottom:150px}.top h1{font-size:48px}.messages-layer{position:relative;inset:auto}.message{position:relative;left:auto!important;right:auto!important;top:auto!important;width:auto!important;max-width:640px;font-size:24px;margin:100px 0;text-align:left!important;translate:0!important;animation:fadeUp 1.2s forwards!important}.message:nth-child(even){margin-left:auto;text-align:right!important}.images-layer{display:none}.bottom-spark{margin-top:0}}
@media(prefers-reduced-motion:reduce){.star,.spark-link,.message,.image-slot{animation:none!important}.message,.image-slot img{opacity:1!important;transform:none;translate:0;transition:none}}
</style>
</head>
<body>
<nav aria-label="主导航"><a href="/home.html">首页</a><a href="/test.html">步道</a><a href="/tongxing.html">童行</a><a href="/tongdao.html">同道</a><a href="/what.html">同工</a><a href="/contact.html">易彼益</a></nav>
<div class="stars" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
<div class="memory-viewport" id="memory-viewport" aria-label="营火之地，可左右轻轻漫游">
<main class="memory-world" id="memory-world">
<section class="top" aria-labelledby="campfire-title"><a class="spark-link" href="lsxh.html">✦ 路上星火</a><h1 id="campfire-title">营火之地</h1><p>有些话，<br>只有走过的人才会说出来。</p></section>
<div class="images-layer" aria-hidden="true"><div class="image-slot image-slot-1" data-prefer="landscape" data-sizes="420px"></div><div class="image-slot image-slot-2" data-prefer="portrait" data-sizes="185px"></div><div class="image-slot image-slot-3" data-prefer="landscape" data-sizes="320px"></div><div class="image-slot image-slot-4" data-prefer="portrait" data-sizes="195px"></div><div class="image-slot image-slot-5" data-prefer="landscape" data-sizes="160px"></div><div class="image-slot image-slot-6" data-prefer="landscape" data-sizes="355px"></div></div>
<div class="messages-layer" id="messages-container" aria-live="off"></div>
</main></div>
<a class="spark-link bottom-spark" href="lsxh.html">✦ 路上星火</a>
<script>
(function(){
const RECENT_IMAGE_KEY='budao:yhzd:imageHistory:v1',RECENT_MESSAGE_KEY='budao:yhzd:messageHistory:v1',IMAGE_HISTORY_LIMIT=24,MESSAGE_HISTORY_LIMIT=24;
function readHistory(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(_){return[]}}
function writeHistory(key,previous,current,limit){try{const merged=previous.concat(current).filter((id,index,list)=>list.lastIndexOf(id)===index);localStorage.setItem(key,JSON.stringify(merged.slice(-limit)))}catch(_){}}
function shuffle(items){const copy=items.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function pickFresh(items,count,history,idOf,exclude){const blocked=new Set((history||[]).concat(exclude||[]));const fresh=shuffle(items.filter(item=>!blocked.has(idOf(item))));const old=shuffle(items.filter(item=>!(exclude||[]).includes(idOf(item))&&blocked.has(idOf(item))));return fresh.concat(old).slice(0,count)}

const stars=document.querySelector('.stars');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=(2+Math.random()*5)+'s';stars.appendChild(s)}

const allMessages=["一路上都悬念不断......","如此用心，细致又丰富的预备和带领，我们度过了一个美好又丰盛的徒步之旅！","还有整体节奏，何时走动何时休息都计划得很精准啊。","恩典多多，收获满满","今天和弟兄姊妹们一起，感觉特别美好，感受到有祂的同在。感恩！","7—88岁的徒步团太壮观了！","今天无论是身体还是灵里，都收获满满，感恩弟兄姐妹们的陪伴和分享。","很巧妙的设计","一个老少咸宜，充满喜乐的身心灵快乐之旅！","有幸参加了这次活动，都是意外的惊喜。","感谢弟兄们搭建的信心之道。","经过这一天，傍晚回来走在城市的水泥路上感觉特别轻盈和踏实。","可以看漫山的花，还能直接退回小学生作息九点睡觉，真的太好了！","认识和不认识人的都在认真听故事。","感恩遇见","用心带领，详尽的总结复盘，感恩。","感恩祂。","很棒的经历","今天的安排，很舒适又得着。","感恩弟兄姐妹们彼此敞开的分享和陪伴！","很棒的体验，很有趣的经历","当天去时候怕迟到，超速百分之十被罚。","强度一点都不大，感觉还没缓过来。","113层，2034个台阶，300米......","活动太有意义了，身心被滋养，还结识了更多同路人。","非常被安慰","大家建立了信任而且让这份关系延续。","我期待未来步道同赏京城。","顺利找到包了","我居然是第一个到的","我都期待好久了，哎！祷告我明天生龙活虎！","我相信人与人的每一次相遇都是奇迹。","感恩这段相遇与安排，拆掉心墙，看见光。","Grateful for this."];
let messageHistory=readHistory(RECENT_MESSAGE_KEY);let currentMessages=pickFresh(allMessages,8,messageHistory,m=>m);writeHistory(RECENT_MESSAGE_KEY,messageHistory,currentMessages,MESSAGE_HISTORY_LIMIT);messageHistory=readHistory(RECENT_MESSAGE_KEY);
const messagesContainer=document.getElementById('messages-container');
function setMessage(node,text){node.replaceChildren(document.createTextNode('“'+text+'”'));const small=document.createElement('small');small.textContent='一次同行之后';node.appendChild(small)}
currentMessages.forEach((msg,index)=>{const div=document.createElement('div');div.className='message message-'+(index+1);div.dataset.message=msg;setMessage(div,msg);messagesContainer.appendChild(div)});
function renewMessages(indices){const occupied=Array.from(messagesContainer.children).map(n=>n.dataset.message);const picks=pickFresh(allMessages,indices.length,messageHistory,m=>m,occupied);if(!picks.length)return;indices.forEach((idx,i)=>{const node=messagesContainer.children[idx];const next=picks[i];if(!node||!next)return;node.classList.add('is-renewing');setTimeout(()=>{node.dataset.message=next;setMessage(node,next);node.classList.remove('is-renewing')},500)});writeHistory(RECENT_MESSAGE_KEY,messageHistory,picks,MESSAGE_HISTORY_LIMIT);messageHistory=readHistory(RECENT_MESSAGE_KEY)}

const viewport=document.getElementById('memory-viewport'),world=document.getElementById('memory-world');
function centerWorld(){if(window.innerWidth<=980)return;const max=world.scrollWidth-viewport.clientWidth;const jitter=Math.min(36,max*.04)*(Math.random()-.5);viewport.scrollLeft=Math.max(0,max/2+jitter)}requestAnimationFrame(centerWorld);
let dragging=false,startX=0,startScroll=0;viewport.addEventListener('pointerdown',e=>{if(window.innerWidth<=980||e.target.closest('a'))return;dragging=true;startX=e.clientX;startScroll=viewport.scrollLeft;viewport.setPointerCapture(e.pointerId);viewport.classList.add('is-dragging')});viewport.addEventListener('pointermove',e=>{if(dragging)viewport.scrollLeft=startScroll-(e.clientX-startX)});function endDrag(){dragging=false;viewport.classList.remove('is-dragging')}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);viewport.addEventListener('dragstart',e=>e.preventDefault());

if(window.matchMedia('(max-width:980px)').matches)return;
let imageHistory=readHistory(RECENT_IMAGE_KEY),imagePool=[],edgeArmed=true,edgeTimer=0;
function chooseImage(prefer,exclude){const blocked=new Set(exclude);return imagePool.filter(item=>!blocked.has(item.id)).sort((a,b)=>{function score(x){let s=Math.random()*10;if(!imageHistory.includes(x.id))s+=100;if(x.orientation===prefer)s+=20;return s}return score(b)-score(a)})[0]}
function renderImage(slot,item,index){if(!slot||!item)return;const small=item['480'],large=item['960'];if(!small||!small.src)return;const img=document.createElement('img');img.alt='';img.decoding='async';img.loading=index<2?'eager':'lazy';if(index===0)img.fetchPriority='high';if(Number.isFinite(item.width)&&Number.isFinite(item.height)){img.width=item.width;img.height=item.height}img.src=small.src;if(large&&large.src){img.srcset=small.src+' 480w, '+large.src+' 960w';img.sizes=slot.dataset.sizes||'320px'}img.addEventListener('load',()=>img.classList.add('is-loaded'),{once:true});slot.replaceChildren(img);return img}
function initialImages(){const slots=Array.from(document.querySelectorAll('.image-slot')),used=[];slots.forEach((slot,index)=>{const item=chooseImage(slot.dataset.prefer,used);if(!item)return;used.push(item.id);slot.dataset.imageId=item.id;renderImage(slot,item,index)});writeHistory(RECENT_IMAGE_KEY,imageHistory,used,IMAGE_HISTORY_LIMIT);imageHistory=readHistory(RECENT_IMAGE_KEY)}
function renewImages(indices){const slots=Array.from(document.querySelectorAll('.image-slot')),occupied=slots.map(s=>s.dataset.imageId).filter(Boolean),newIds=[];indices.forEach(index=>{const slot=slots[index],item=chooseImage(slot.dataset.prefer,occupied.concat(newIds));if(!item)return;const old=slot.querySelector('img');if(old)old.classList.add('is-renewing');setTimeout(()=>{slot.dataset.imageId=item.id;renderImage(slot,item,index)},520);newIds.push(item.id)});writeHistory(RECENT_IMAGE_KEY,imageHistory,newIds,IMAGE_HISTORY_LIMIT);imageHistory=readHistory(RECENT_IMAGE_KEY)}
function renewEdge(side){if(side==='left'){renewImages([0,4]);renewMessages([0,5])}else{renewImages([2,5]);renewMessages([1,4])}}
function watchEdge(){clearTimeout(edgeTimer);edgeTimer=setTimeout(()=>{const max=viewport.scrollWidth-viewport.clientWidth;if(max<=0)return;const ratio=viewport.scrollLeft/max;if(ratio>.27&&ratio<.73){edgeArmed=true;return}if(!edgeArmed)return;if(ratio<.08){edgeArmed=false;renewEdge('left')}else if(ratio>.92){edgeArmed=false;renewEdge('right')}},260)}viewport.addEventListener('scroll',watchEdge,{passive:true});

fetch('/images/yhzd/manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('manifest unavailable');return r.json()}).then(manifest=>{imagePool=Array.isArray(manifest.images)?manifest.images:[];if(imagePool.length)initialImages()}).catch(()=>{});
}());
</script>
</body>
</html>
