<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>同路 · 数字牧场 v9</title>
<meta name="theme-color" content="#a8e9ff"/>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8e9ff}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#4e5047}
.stage{position:fixed;inset:0;overflow:hidden;background:#a8e9ff}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
.world-note{position:absolute;z-index:5;transform:translate(-50%,-50%);border:0;background:rgba(255,252,232,.94);padding:5px 8px;box-shadow:2px 2px 0 rgba(78,71,57,.14);font-size:12px;font-weight:650;color:#57534c;white-space:nowrap;cursor:pointer;transition:opacity .22s ease,transform .16s ease}.world-note:hover{transform:translate(-50%,calc(-50% - 2px))}.world-note.need{left:70%;top:62%;border:1px solid rgba(99,130,190,.22)}.world-note.give{left:83%;top:79%;border:1px solid rgba(164,126,72,.22)}
.world-note .dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:-1px}.world-note.need .dot{background:#8fb4ff}.world-note.give .dot{background:#ffe9a8}
.stage.focus .world-note{opacity:0;pointer-events:none}
.focus-ui{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .28s ease}.stage.focus .focus-ui{opacity:1}
.back{position:absolute;left:22px;top:22px;pointer-events:auto;border:1px solid rgba(73,80,61,.18);background:rgba(255,253,236,.94);box-shadow:2px 2px 0 rgba(73,80,61,.13);padding:8px 11px;color:#555348;font:650 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
.username{position:absolute;left:50%;top:8.5%;transform:translateX(-50%);font-size:18px;font-weight:700;letter-spacing:.02em;color:#41483d;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.life{position:absolute;pointer-events:auto;border:0;background:transparent;padding:0;cursor:pointer;color:#514a42;font:650 13px/1.15 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap}.life .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,252,232,.94);padding:6px 9px;border:1px solid rgba(87,76,59,.18);box-shadow:2px 2px 0 rgba(87,76,59,.13)}.life .mark{width:8px;height:8px;box-shadow:1px 1px 0 rgba(0,0,0,.10)}.life .detail{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:rgba(255,255,247,.98);padding:7px 10px;border:1px solid rgba(87,76,59,.16);box-shadow:2px 2px 0 rgba(87,76,59,.11);font-size:12px;font-weight:500;opacity:0;pointer-events:none;white-space:nowrap}.life.open .detail{opacity:1}
.life.care{left:21%;top:58%}.life.feed{left:37%;top:77%}.life.depart{right:19%;top:57%}.life.ask{left:25%;bottom:9%}.life.offer{right:24%;bottom:9%}.life.care .mark{background:#f1d17b}.life.feed .mark{background:#d5ed82}.life.depart .mark{background:#ad815b}.life.ask .mark{background:#8fb4ff}.life.offer .mark{background:#ffe8aa}
.days{position:absolute;left:50%;bottom:5.8%;transform:translateX(-50%);font-size:12px;color:#68705f;text-shadow:0 1px 0 rgba(255,255,255,.8);white-space:nowrap}
.hint{position:fixed;left:16px;bottom:max(14px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.05em;color:rgba(50,86,48,.55);pointer-events:none;opacity:0;animation:hintin 1s ease 1s forwards,hintout 1s ease 7s forwards}@keyframes hintin{to{opacity:1}}@keyframes hintout{to{opacity:0}}
@media(max-width:760px){.username{top:7%;font-size:16px}.back{left:14px;top:14px}.world-note{font-size:11px;padding:4px 6px}.life{font-size:11px}.life .tag{padding:5px 7px}.life .detail{font-size:11px}.life.care{left:16%;top:58%}.life.feed{left:33%;top:78%}.life.depart{right:12%;top:58%}.life.ask{left:12%;bottom:9%}.life.offer{right:12%;bottom:9%}}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="pasture" width="480" height="300" aria-label="同路数字牧场"></canvas>
<button class="world-note need" data-world="need"><span class="dot"></span>需要帮助</button>
<button class="world-note give" data-world="give"><span class="dot"></span>愿意给出</button>
<div class="focus-ui">
  <button class="back" id="back">← 返回牧场</button>
  <div class="username" id="username">Tony</div>
  <button class="life care"><span class="tag"><span class="mark"></span>风铃</span><span class="detail">有人来关心你</span></button>
  <button class="life feed"><span class="tag"><span class="mark"></span>今日的草</span><span class="detail">今天的灵粮在这里</span></button>
  <button class="life depart"><span class="tag"><span class="mark"></span>出发</span><span class="detail">今天有一条与你有关的路</span></button>
  <button class="life ask"><span class="tag"><span class="mark"></span>发出需要</span><span class="detail">让别的羊看见你需要帮助</span></button>
  <button class="life offer"><span class="tag"><span class="mark"></span>给出</span><span class="detail">把愿意给予的东西带到牧场</span></button>
  <div class="days" id="days">同行 1 天</div>
</div>
</div>
<div class="hint" id="hint">点一下前景那只羊</div>
<script>
(()=>{
const c=document.getElementById('pasture'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),back=document.getElementById('back');ctx.imageSmoothingEnabled=false;
const W=480,H=300;let tick=0,mode='world';
const KEY='tonglu.identity.v2';let identity;try{identity=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!identity){identity={since:Date.now(),dna:{body:'B2',fleece:'F7',horn:'H0',ear:'E1',eye:'Y3'}};localStorage.setItem(KEY,JSON.stringify(identity))}
const username=identity.username||localStorage.getItem('tonglu.username')||'Tony';document.getElementById('username').textContent=username;
const days=Math.max(1,Math.floor((Date.now()-identity.since)/86400000)+1);document.getElementById('days').textContent=`同行 ${days} 天`;
const C={sky:'#9fe8ff',sky2:'#dff9ff',sun:'#fff1a0',sunHalo:'#fff8c7',mountainFar:'#a7c1d5',mountain:'#789cbb',hill:'#9bd878',hill2:'#7dc85d',grass:'#83d75f',grass2:'#62b94a',grass3:'#4d9d3a',river:'#79dbff',riverLight:'#c9f5ff',riverDark:'#5fc1ea',trunk:'#77644f',tree1:'#6fbe56',tree2:'#95dc74',flower1:'#fff1a0',flower2:'#ffd2ee',flower3:'#d9f6ae',ink:'#564d47',wood:'#aa8059',woodDark:'#806044',chime:'#f4d993',need:'#8fb4ff',feed:'#dff19a',self:'#bfd7a4',selfHead:'#776d60'};
function rect(a,b,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function fill(p,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function cloud(cx,cy,s,a=1){ctx.globalAlpha=a;rect(cx,cy,18*s,5*s,'#fff');rect(cx+6*s,cy-4*s,11*s,9*s,'#fff');rect(cx+15*s,cy+1*s,16*s,4*s,'#fff');ctx.globalAlpha=1}
function mountains(){fill([[0,132],[20,132],[20,124],[42,124],[42,118],[59,118],[59,122],[72,122],[72,112],[90,112],[90,104],[108,104],[108,112],[124,112],[124,123],[145,123],[145,117],[162,117],[162,109],[182,109],[182,98],[200,98],[200,108],[216,108],[216,121],[236,121],[236,114],[252,114],[252,106],[270,106],[270,115],[288,115],[288,124],[307,124],[307,116],[325,116],[325,108],[342,108],[342,116],[360,116],[360,126],[380,126],[380,117],[399,117],[399,109],[418,109],[418,116],[439,116],[439,125],[460,125],[460,121],[480,121],[480,162],[0,162]],C.mountainFar);fill([[0,153],[28,153],[28,146],[53,146],[53,139],[80,139],[80,144],[107,144],[107,134],[132,134],[132,128],[156,128],[156,135],[182,135],[182,146],[210,146],[210,138],[237,138],[237,132],[263,132],[263,139],[290,139],[290,148],[318,148],[318,141],[346,141],[346,133],[369,133],[369,140],[396,140],[396,149],[421,149],[421,141],[448,141],[448,146],[480,146],[480,177],[0,177]],C.mountain)}
function river(){fill([[322,154],[340,156],[354,161],[360,168],[357,176],[348,183],[341,191],[340,199],[346,207],[359,214],[370,222],[376,232],[377,246],[371,260],[365,276],[361,300],[395,300],[398,282],[406,263],[411,246],[409,229],[401,216],[389,205],[375,195],[370,187],[372,178],[381,169],[386,161],[383,156],[365,151],[345,148]],C.riverDark);fill([[326,155],[341,157],[351,162],[354,168],[351,174],[343,181],[337,188],[336,197],[341,204],[353,211],[365,220],[370,230],[371,243],[365,258],[359,275],[355,300],[387,300],[390,282],[398,262],[403,246],[401,232],[393,219],[382,209],[368,199],[361,191],[362,181],[370,172],[376,164],[373,159],[360,154],[344,151]],C.river);fill([[350,214],[359,219],[364,225],[365,231],[360,235],[355,229],[351,223]],C.riverLight);fill([[365,264],[370,271],[368,281],[364,288],[361,296],[368,296],[372,284],[376,274],[374,267]],C.riverLight)}
function tree(px,py,s=1,ch=false){rect(px+5*s,py+12*s,3*s,10*s,C.trunk);rect(px,py+5*s,13*s,5*s,C.tree1);rect(px+2*s,py,9*s,6*s,C.tree2);rect(px+3*s,py+9*s,7*s,5*s,'#79ca5f');if(ch){const sw=((tick>>3)%2);rect(px+13*s,py+7*s,2*s,10*s,C.woodDark);rect(px+(11+sw)*s,py+16*s,7*s,3*s,C.chime);rect(px+(13+sw)*s,py+19*s,3*s,5*s,'#fff0ae')}}
function sign(px,py,s=1){rect(px,py+6*s,4*s,17*s,C.woodDark);rect(px-12*s,py,27*s,10*s,C.wood);rect(px-9*s,py+2*s,17*s,3*s,'#d9b27d');rect(px+9*s,py+3*s,4*s,4*s,C.woodDark)}
function feed(px,py,s=1){const p=(tick%36<18?0:1);rect(px,py+3*s,3*s,10*s,C.feed);rect(px+4*s,py-p*s,3*s,14*s,'#d2eb7f');rect(px+8*s,py+2*s,3*s,11*s,'#e6f5a6');rect(px+3*s,py-2*s,3*s,3*s,'#fff3a0')}
function needWave(px,py){const ph=(tick%32)>>3;ctx.strokeStyle=C.need;ctx.lineWidth=2;for(let i=0;i<3;i++){const r=5+i*4+ph;ctx.beginPath();ctx.arc(px,py,r,-.9,.9);ctx.stroke()}}
function giveFlag(px,py){rect(px,py,3,13,'#8b6b4d');rect(px+3,py,18,8,'#fff1b8');rect(px+6,py+2,12,2,'#c38e61')}
const sheep=[{x:87,y:179,s:.62,f:'#f3ead7',h:'#8e846f'},{x:216,y:184,s:.58,f:'#f1d7bf',h:'#987b68'},{x:305,y:194,s:.78,f:'#bfd8da',h:'#806f67',need:true},{x:397,y:224,s:.82,f:'#f2e3b3',h:'#917d62',graze:true,give:true},{x:121,y:236,s:.96,f:'#d8d7ce',h:'#756d66'},{x:232,y:243,s:1.10,f:C.self,h:C.selfHead,self:true}];
function drawSheep(o,i){const bob=(Math.sin((tick+i*13)/12)>0?0:1),px=Math.round(o.x),py=Math.round(o.y-bob),s=o.s,g=(o.graze&&Math.sin((tick+i*9)/35)>.45)?4:0;if(o.self)rect(px-4*s,py+22*s,23*s,3*s,'rgba(255,248,195,.30)');rect(px,py,24*s,12*s,o.f);rect(px+4*s,py-5*s,17*s,19*s,o.f);rect(px+8*s,py-8*s,10*s,22*s,o.f);rect(px+19*s,py+2*s+g,10*s,10*s,o.h);rect(px+27*s,py+4*s+g,3*s,4*s,o.h);rect(px+17*s,py+3*s+g,3*s,3*s,o.h);rect(px+24*s,py+4*s+g,1.5*s,1.5*s,C.ink);rect(px+5*s,py+12*s,3*s,8*s,'#5d5851');rect(px+16*s,py+12*s,3*s,8*s,'#5d5851');if(o.need)needWave(px+32*s,py+6*s);if(o.give)giveFlag(px-5,py+21)}
function drawWorld(){rect(0,0,W,92,C.sky);rect(0,92,W,46,C.sky2);rect(44,29,26,26,C.sunHalo);rect(48,33,18,18,C.sun);cloud(65+(tick%480)/15,48,1,.92);cloud(286+(tick%600)/24,66,.85,.72);cloud(400+(tick%720)/30,39,.7,.56);mountains();fill([[0,159],[60,159],[60,155],[126,155],[126,160],[192,160],[192,157],[260,157],[260,162],[330,162],[330,158],[398,158],[398,163],[480,163],[480,300],[0,300]],C.hill);fill([[0,185],[48,185],[48,181],[112,181],[112,186],[174,186],[174,183],[238,183],[238,188],[300,188],[300,183],[352,183],[352,189],[420,189],[420,185],[480,185],[480,300],[0,300]],C.hill2);river();fill([[0,214],[55,214],[55,210],[118,210],[118,215],[180,215],[180,211],[242,211],[242,216],[314,216],[314,223],[350,223],[350,232],[331,232],[331,244],[320,244],[320,300],[0,300]],C.grass);fill([[405,216],[480,216],[480,300],[389,300],[389,280],[396,280],[396,260],[401,260]],C.grass);fill([[0,265],[52,265],[52,261],[115,261],[115,266],[184,266],[184,262],[248,262],[248,268],[308,268],[308,263],[340,263],[340,300],[0,300]],C.grass2);tree(132,174,1.05,false);tree(424,189,.85,false);const flowers=[[31,230,C.flower1],[73,242,C.flower2],[157,222,C.flower3],[201,249,C.flower1],[277,228,C.flower2],[316,244,C.flower3],[443,239,C.flower1]];flowers.forEach((f,j)=>rect(f[0],f[1]+((tick+j*17)%80===0?-1:0),2,2,f[2]));for(let i=0;i<42;i++){const gx=(i*71+23)%470,gy=218+((i*37+19)%76);if(Math.abs(gx-242)>48||Math.abs(gy-246)>28)rect(gx,gy,1+(i%3===0),2+(i%4===0),i%2?C.grass3:'#6fc355')}sheep.forEach(drawSheep)}
function detailSheep(){rect(0,0,W,106,C.sky2);fill([[0,126],[55,126],[55,118],[122,118],[122,124],[196,124],[196,116],[270,116],[270,123],[345,123],[345,117],[410,117],[410,123],[480,123],[480,300],[0,300]],'#a6dc83');fill([[0,169],[80,169],[80,163],[170,163],[170,171],[258,171],[258,164],[345,164],[345,172],[430,172],[430,166],[480,166],[480,300],[0,300]],'#83cc64');rect(0,224,W,76,C.grass);
 tree(64,150,1.55,true);feed(118,232,1.25);sign(373,165,1.15);
 for(let i=0;i<14;i++){const px=82+i*16;rect(px,243+(i%3)*3,2,7+(i%4),i%2?'#d7ee82':'#b7df69')}
 for(let i=0;i<8;i++){rect(120+i*13,207+i*3,5,2,'#d8c590')}
 const bob=(Math.sin(tick/14)>0?0:1),px=178,py=151-bob;
 rect(px-10,py+92,120,10,'rgba(255,248,195,.38)');
 rect(px,py+18,96,48,C.self);rect(px+12,py,64,82,C.self);rect(px+30,py-14,34,100,C.self);rect(px-6,py+30,18,26,'#c9dfb0');rect(px+78,py+24,20,32,'#abc892');rect(px+19,py+9,18,12,'#d4e7c2');rect(px+54,py+4,17,13,'#aac690');rect(px+5,py+52,18,14,'#aac690');rect(px+62,py+61,21,14,'#d2e5be');
 rect(px+80,py+24,45,40,C.selfHead);rect(px+118,py+30,14,15,C.selfHead);rect(px+72,py+27,13,12,C.selfHead);rect(px+87,py+20,12,7,'#8c7f6e');
 rect(px+103,py+34,5,5,C.ink);rect(px+111,py+36,4,4,C.ink);rect(px+119,py+45,6,2,'#645c52');
 rect(px+22,py+76,12,33,'#5d5851');rect(px+67,py+76,12,33,'#5d5851');rect(px+20,py+105,16,6,'#4f4b46');rect(px+65,py+105,16,6,'#4f4b46');
 if((tick%28)<14){rect(px+17,py+27,7,4,'#dceccc');rect(px+48,py+18,6,4,'#dceccc')}else{rect(px+20,py+30,7,4,'#dceccc');rect(px+51,py+21,6,4,'#dceccc')}
}
function render(){ctx.clearRect(0,0,W,H);mode==='world'?drawWorld():detailSheep()}
function worldPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
c.addEventListener('mousemove',e=>{if(mode!=='world'){c.style.cursor='default';return}const p=worldPoint(e);c.style.cursor=Math.hypot(p.x-247,p.y-247)<32?'pointer':'default'});
c.addEventListener('click',e=>{if(mode!=='world')return;const p=worldPoint(e);if(Math.hypot(p.x-247,p.y-247)<32){mode='focus';stage.classList.add('focus');document.getElementById('hint').style.display='none'}});
back.addEventListener('click',()=>{mode='world';stage.classList.remove('focus')});
document.querySelectorAll('.life').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.life').forEach(o=>{if(o!==b)o.classList.remove('open')});b.classList.toggle('open')}));
document.querySelectorAll('.world-note').forEach(b=>b.addEventListener('click',()=>b.textContent=b.classList.contains('need')?'这只羊需要一根登山杖':'这只羊愿意给出一本绘本'));
function loop(){tick++;render();setTimeout(()=>requestAnimationFrame(loop),100)}render();requestAnimationFrame(loop);
})();
</script>
</body></html>
