<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的步道卡 · 同路</title><meta name="robots" content="noindex">
<style>
:root{--ink:#4d5145;--cream:#fff9df;--wood:#7e674f;--line:#8a9972}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#a9e6ed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #345d68;outline-offset:3px}.world{position:relative;width:100%;height:100svh;min-height:650px;overflow:hidden;background:#a9e6ed}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.top{position:absolute;top:25px;left:clamp(20px,5vw,80px);right:clamp(20px,5vw,80px);display:flex;justify-content:space-between;align-items:flex-start;gap:20px;pointer-events:none}.identity{background:rgba(255,250,222,.92);padding:12px 17px;border:2px solid #78856b;box-shadow:5px 5px 0 rgba(69,95,65,.3)}.identity small{display:block;letter-spacing:.18em;font-weight:800;color:#71806c;font-size:10px}.identity strong{display:block;font-size:24px;margin:3px 0}.identity span{font-size:12px}.demo{background:#f5eccd;border:1px solid #a09a76;padding:7px 10px;font-size:11px;max-width:230px;line-height:1.5}.path{position:absolute;inset:0;pointer-events:none}.point{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:0;background:transparent;color:#403c32;padding:4px;min-width:60px;min-height:62px;text-align:center;filter:drop-shadow(2px 3px 0 #5c7451)}.point .icon{display:block;font-size:32px;line-height:1;text-shadow:2px 2px #fff2b8}.point .label{display:block;font-size:11px;font-weight:800;background:#fff3c5;border:1px solid #796a4d;padding:2px 4px;white-space:nowrap}.point:hover,.point:focus-visible,.point.active{transform:translate(-50%,-55%) scale(1.1)}.point.future{opacity:.74;filter:grayscale(.35)}.bottom{position:absolute;bottom:24px;left:clamp(20px,5vw,80px);right:clamp(20px,5vw,80px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}.bottom button,.dock button,.sheet button{pointer-events:auto;border:2px solid #70654f;background:#fbf1ca;color:#544b3d;box-shadow:3px 3px 0 #786b53;padding:9px 13px;font-weight:750}.bottom button:hover,.dock button:hover,.sheet button:hover{background:#fff9de}.dock{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}.dock button[aria-pressed=true]{background:#c7e8ad}.caption{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(255,251,225,.8);border:1px solid #a2a982;padding:7px 12px;font-size:12px;text-align:center;white-space:nowrap}.sheet{position:absolute;z-index:5;right:clamp(20px,5vw,80px);top:50%;transform:translateY(-50%);width:min(365px,calc(100vw - 40px));max-height:calc(100% - 180px);overflow:auto;background:#fff8de;border:3px solid #756e52;box-shadow:8px 8px 0 rgba(61,80,58,.35);padding:22px 22px 24px}.sheet[hidden]{display:none}.sheet small{font-weight:800;letter-spacing:.12em;color:#778765}.sheet h2{font-size:25px;margin:9px 0 12px}.sheet p{font-size:14px;line-height:1.8;margin:8px 0}.sheet .meta{border-top:1px dashed #a7a487;padding-top:12px;margin-top:14px;font-size:12px}.sheet .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.sheet .close{position:absolute;right:12px;top:10px;background:transparent;border:0;box-shadow:none;padding:4px;font-size:23px}.sheet .notice{background:#ecf2d9;padding:9px 11px;font-size:12px}.timeline{display:flex;gap:8px;overflow:auto;margin:13px 0 4px;padding:5px 3px 8px}.timeline button{white-space:nowrap;font-size:12px;padding:7px 8px}.timeline button.selected{background:#c8e9b7}.entry{opacity:0;animation:open .85s ease forwards}.world::after{content:"";position:absolute;inset:0;background:#fff3c8;pointer-events:none;animation:veil 1.4s ease forwards}@keyframes veil{0%{opacity:.88}100%{opacity:0}}@keyframes open{to{opacity:1}}@media(max-width:700px){.world{height:100svh;min-height:650px}.top{top:15px;left:15px;right:15px}.identity{padding:9px}.identity strong{font-size:19px}.demo{max-width:125px;font-size:10px}.caption{top:20%;max-width:80%;white-space:normal}.bottom{left:15px;right:15px;bottom:15px;align-items:flex-start;flex-direction:column}.dock{justify-content:flex-start}.bottom button,.dock button{font-size:12px;padding:8px}.sheet{right:15px;top:auto;bottom:95px;transform:none;max-height:55%;padding:16px}.point .label{font-size:10px}.point .icon{font-size:27px}}@media(prefers-reduced-motion:reduce){.entry{opacity:1;animation:none}.world::after{display:none}}
</style>
</head>
<body>
<main class="world" id="world" aria-label="Tony 的步道地形，第一版交互演示">
<canvas id="terrain" width="960" height="600" aria-hidden="true"></canvas>
<div class="top entry"><div class="identity"><small>我的行走之地 · 演示</small><strong>Tony 的步道卡</strong><span>卡可以换，路不会消失</span></div><div class="demo">第一版交互演示<br>路线、人物与卡片信息均为示意，尚未连接真实记录。</div></div>
<div class="caption entry" id="caption">沿着路，看看那些真实发生的日子</div>
<div class="path entry" id="path"></div>
<div class="bottom entry"><button id="return" type="button">↖ 回到牧场</button><div class="dock"><button id="today" type="button" aria-pressed="true">此刻的地形</button><button id="memory" type="button" aria-pressed="false">◷ 回到那一天</button><button id="people" type="button">同行的人</button><button id="physical" type="button">▣ 手中的卡</button></div></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden><button class="close" id="close" aria-label="关闭详情">×</button><small id="sheetEyebrow"></small><h2 id="sheetTitle"></h2><div id="sheetBody"></div></section>
</main>
<script>
(()=>{
'use strict';
const entries=[
 {id:'start',x:19,y:68,icon:'▣',label:'初次启程',title:'一条路，从这里开始',date:'2026.03.21',place:'北京 · 顺义',kind:'路印',story:'这一天留下第一枚路印。后来走过的路，会从这里继续展开。',people:'同行的人：暂未展示',note:'留在路上的问题：是什么使我愿意出发？'},
 {id:'woods',x:39,y:56,icon:'♧',label:'山间同行',title:'一起走过的山路',date:'2026.04.16',place:'北京 · 山野',kind:'路印',story:'路开始向前延伸，也开始遇见同行的人。每一段共同经历都属于那一天。',people:'同行的人：Chen',note:'留在路上的问题：什么时候，我愿意让别人陪我走？'},
 {id:'marker',x:59,y:65,icon:'✦',label:'留下地标',title:'值得记住的一次相遇',date:'2026.08.12',place:'北京 · 步道',kind:'永久地标',story:'有些经历不需要奖章，却值得在路旁留下一个地标。再次经过时，可以回到当时的问题。',people:'同行的人：Chen',note:'那天留下的话：山上有爱，超过所想。'},
 {id:'recent',x:76,y:48,icon:'♧',label:'再次同路',title:'再一次同行',date:'2026.09.18',place:'北京 · 步道',kind:'路印',story:'这段路属于它真正发生的日子。选中它，后来的地形会暂时隐去。',people:'同行的人：Chen',note:'留在路上的问题：如今，我如何理解起初的那段路？'}
];
const path=document.getElementById('path'),sheet=document.getElementById('sheet'),canvas=document.getElementById('terrain'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
let selected=null,mode='now';
const $=id=>document.getElementById(id);const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function hill(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,600);for(const [x,y] of points)ctx.lineTo(x,y);ctx.lineTo(960,600);ctx.fill()}
function tree(x,y,s){rect(x-4*s,y,8*s,30*s,'#866c50');rect(x-16*s,y-12*s,32*s,17*s,'#518f5a');rect(x-12*s,y-24*s,24*s,15*s,'#64aa62');rect(x-8*s,y-30*s,16*s,10*s,'#78bd68')}
function draw(){const past=mode==='past',autumn=past&&selected>=2;const sky=past?(autumn?'#b7d4d0':'#bde9ee'):'#a9e6ed';rect(0,0,960,600,sky);rect(0,155,960,150,past?'#cde9d2':'#d8f6e9');rect(738,72,43,43,past?'#ffe2a0':'#fff1a7');rect(730,82,61,23,past?'#ffe4ab':'#fff3bb');for(let i=0;i<5;i++){let x=70+i*197,y=89+i%2*31;rect(x,y,95,12,'#f8ffff');rect(x+18,y-9,48,15,'#f8ffff')}
 hill([[0,317],[115,213],[206,281],[368,180],[510,299],[661,202],[811,267],[960,202]],'#a3bdc4');hill([[0,385],[170,279],[320,350],[536,252],[705,355],[890,254],[960,290]],'#81b2a3');hill([[0,443],[167,336],[333,397],[533,330],[725,401],[960,319]],autumn?'#88af72':'#85cb89');rect(0,420,960,180,autumn?'#85ad6e':'#8bd079');for(let i=0;i<95;i++){const x=(i*137+31)%960,y=430+(i*71)%170;rect(x,y,3,2,i%4===0?'#f9e5a7':'#69b963')}
 for(const [x,y,s] of [[85,373,1.5],[257,341,1],[339,417,1.6],[486,361,1],[673,370,1.4],[844,348,1.4],[930,411,1]])tree(x,y,s);
 ctx.beginPath();ctx.moveTo(180,410);const coords=[[374,338],[565,390],[720,289],[790,318]];for(let i=0;i<coords.length;i++){if(past&&i>selected)break;ctx.lineTo(...coords[i])}ctx.lineWidth=24;ctx.strokeStyle='#a98d65';ctx.lineJoin='round';ctx.stroke();ctx.lineWidth=15;ctx.strokeStyle='#e7cf9c';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff0c1';ctx.setLineDash([5,12]);ctx.stroke();ctx.setLineDash([]);
 if(!past){ctx.globalAlpha=.43;ctx.beginPath();ctx.moveTo(790,318);ctx.lineTo(960,260);ctx.lineWidth=14;ctx.strokeStyle='#f8eac2';ctx.setLineDash([6,12]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
 rect(16,476,8,85,'#795f4a');rect(24,479,89,28,'#f2dcaa');rect(29,483,78,18,'#d5b986');ctx.fillStyle='#514d3d';ctx.font='bold 13px sans-serif';ctx.fillText('牧场 ←',36,498);
}
function setSheet(eyebrow,title,html){$('sheetEyebrow').textContent=eyebrow;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;sheet.hidden=false;$('close').focus()}
function renderPoints(){path.replaceChildren();entries.forEach((item,i)=>{if(mode==='past'&&i>selected)return;const b=document.createElement('button');b.type='button';b.className='point'+(selected===i&&mode==='past'?' active':'');b.style.left=item.x+'%';b.style.top=item.y+'%';b.setAttribute('aria-label',item.label+'，'+item.date);b.innerHTML='<span class="icon" aria-hidden="true">'+item.icon+'</span><span class="label">'+item.label+'</span>';b.addEventListener('click',()=>openEntry(i));path.append(b)});if(mode==='now'){const b=document.createElement('button');b.type='button';b.className='point future';b.style.left='91%';b.style.top='42%';b.innerHTML='<span class="icon" aria-hidden="true">⋯</span><span class="label">未完之路</span>';b.setAttribute('aria-label','未完之路');b.addEventListener('click',()=>setSheet('尚未发生','路还会继续','<p>这里留着尚未走过的方向。它不是任务，也不要求你按时完成。</p><p>等一段经历真实发生，路才会从已走过的地方继续延伸。</p>'));path.append(b)}}
function activate(which){mode=which;$('today').setAttribute('aria-pressed',String(which==='now'));$('memory').setAttribute('aria-pressed',String(which==='past'));$('caption').textContent=which==='past'?'那一天之后的路，暂时藏起来了':'沿着路，看看那些真实发生的日子';draw();renderPoints()}
function openEntry(i){selected=i;activate('past');const e=entries[i];setSheet(e.kind+' · '+e.date,e.title,'<p><b>'+e.place+'</b></p><p>'+e.story+'</p><p>'+e.people+'</p><p>'+e.note+'</p><div class="meta">你正在看 '+e.date+' 的地形。页面内容为第一版交互示意。</div><div class="actions"><button type="button" id="nextDay">继续沿路走 →</button></div>');$('nextDay').addEventListener('click',()=>openEntry(Math.min(i+1,entries.length-1)))}
function showTimeline(){let html='<p>选一个日子，看看当时的路走到了哪里。</p><div class="timeline">';entries.forEach((e,i)=>{html+='<button type="button" data-day="'+i+'" class="'+(selected===i?'selected':'')+'">'+e.date.slice(5)+'</button>'});html+='</div><p class="notice">回看时只呈现当时已经发生的经历。</p>';setSheet('沿时间回望','回到那一天',html);sheet.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>openEntry(Number(b.dataset.day))))}
$('memory').addEventListener('click',showTimeline);$('today').addEventListener('click',()=>{selected=null;activate('now');sheet.hidden=true});$('people').addEventListener('click',()=>{
 setSheet('共同走过的路','同行的人','<p><b>Chen</b> · 演示关系</p><p>共同经历的路印：3 次<br>第一次同行：2026.04.16<br>最近一次同行：2026.08.12</p><p>关系从共同发生的经历中生长。这里不按亲密程度给人排序。</p><p class="notice">“探访步道卡”与“写信”需在真实身份、双方意愿和可见范围确定后接通；此处展示交互位置。</p><div class="actions"><button type="button" id="visit">探访他的步道卡</button><button type="button" id="letter">写信给他</button></div>');
 for(const id of ['visit','letter'])$(id).addEventListener('click',()=>setSheet('尚未开放','这条路等待彼此同意','<p>真实的同行关系与联系入口，需要在双方知情并同意后才会出现。</p>'));
});
$('physical').addEventListener('click',()=>setSheet('现实中的入口','手中的卡','<p>一张可以挂在钥匙上的实体卡，轻轻一触，便回到你的这片地。</p><p><b>示例卡号</b>：BD-NFC-2026-0318<br><b>状态</b>：已激活（示意）<br><b>首次激活</b>：2026.03.21<br><b>最近触碰</b>：2026.09.18<br><b>持有人</b>：Tony（示意）</p><p class="notice">更换、补领或停用实体卡，不会抹去人的身份与已经走过的路。此版仅演示说明，不执行卡片操作。</p>'));
$('close').addEventListener('click',()=>{sheet.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});$('return').addEventListener('click',()=>location.assign('/tonglu.html'));
activate('now');window.addEventListener('resize',draw);
})();
</script>
</body>
</html>
