<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同路 · 步道</title>
<meta name="theme-color" content="#a8dcff">
<style>
:root{
  --ink:#26352f;
  --paper:#fff9e9;
  --paper2:#f6e7c3;
  --wood:#6c4b2e;
  --green:#4f9e49;
  --green2:#79c958;
  --accent:#67ae55;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fd6fb;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Cascadia Mono","Roboto Mono","Noto Sans Mono CJK SC",monospace}
button,input,textarea,select{font:inherit}
button{color:inherit}
body{touch-action:none;user-select:none}
#world{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;background:#9fd6fb}
#landscape{position:absolute;inset:-2%;width:104%;height:104%;z-index:1;display:block;transform:translateZ(0);will-change:transform}
#landscape *{vector-effect:non-scaling-stroke}
.parallax{transform-box:fill-box;transform-origin:center;will-change:transform}
#atmosphere{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 34%,rgba(255,247,196,.08) 65%,rgba(36,87,55,.07));mix-blend-mode:screen}
#grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.08;background-image:radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 75% 38%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 32% 78%,#173c22 0 1px,transparent 1.5px);background-size:17px 19px,23px 29px,31px 27px;image-rendering:pixelated}

#brand{position:absolute;left:26px;top:22px;z-index:60;display:flex;align-items:center;gap:13px;text-shadow:0 2px 0 rgba(255,255,255,.72)}
.brand-sheep{width:38px;height:31px;filter:drop-shadow(0 3px 0 rgba(50,78,48,.12))}
#brand strong{font-size:30px;letter-spacing:.12em;line-height:1}
#brand span{display:block;margin-top:4px;font-size:10px;letter-spacing:.20em;opacity:.56}
#topnav{position:absolute;right:22px;top:18px;z-index:60;display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid rgba(38,69,50,.09);border-radius:18px;background:rgba(255,255,255,.32);backdrop-filter:blur(12px)}
.navchip{border:0;background:transparent;padding:8px 10px;border-radius:12px;font-size:11px;letter-spacing:.08em;cursor:pointer;opacity:.72}
.navchip:hover{background:rgba(255,255,255,.46);opacity:1}
#sound{width:37px;height:37px;border:0;border-radius:12px;background:rgba(255,255,255,.46);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(38,69,50,.09)}
#sound:active,.navchip:active{transform:translateY(1px)}
#slogan{position:absolute;left:29px;top:103px;z-index:54;font-family:"STKaiti","KaiTi",serif;color:#416b75;text-shadow:0 1px 0 rgba(255,255,255,.7)}
#slogan .hand{font-size:28px;letter-spacing:.12em;transform:rotate(-4deg);display:inline-block}
#slogan small{display:block;margin-top:7px;font-size:11px;letter-spacing:.17em;opacity:.72;line-height:1.8}
#stage-note{position:absolute;z-index:55;left:50%;top:72px;transform:translateX(-50%);padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.54);backdrop-filter:blur(8px);font-size:10px;letter-spacing:.12em;color:#3e5c50;opacity:.85;transition:opacity .7s}
#stage-note.hidden{opacity:0}

#sheep-layer{position:absolute;inset:0;z-index:22}
.sheep{position:absolute;width:78px;height:64px;cursor:grab;transform-origin:50% 84%;will-change:left,top,transform,filter;filter:drop-shadow(0 6px 0 rgba(38,84,43,.13));touch-action:none}
.sheep.grabbed{cursor:grabbing;z-index:999!important;filter:drop-shadow(0 13px 0 rgba(38,84,43,.10))}
.sheep svg{display:block;width:100%;height:100%;overflow:visible;image-rendering:pixelated}
.sheep .wool{fill:var(--wool,#fff0d4);stroke:rgba(81,68,48,.16);stroke-width:1.2}
.sheep .patch{fill:var(--patch,#d9b06b);opacity:.76}
.sheep .face,.sheep .ear{fill:var(--face,#5d4738)}
.sheep .leg{fill:#45392e}
.sheep .eye{fill:#151612}
.sheep .cheek{fill:#eeb3a1;opacity:.78}
.sheep .scarf{fill:var(--scarf,#8bbbdc)}
.sheep .flower{fill:#fff8dc}.sheep .flowerCore{fill:#f2b44b}
.sheep .tail{transform-origin:58px 31px;animation:tail .85s ease-in-out infinite alternate}
@keyframes tail{to{transform:rotate(14deg)}}
.sheep.walking .leg1{animation:walkleg .32s steps(2,end) infinite alternate}.sheep.walking .leg2{animation:walkleg .32s steps(2,end) infinite alternate-reverse}
@keyframes walkleg{to{transform:translateY(-3px)}}
.sheep.idle .head{transform-origin:23px 33px;animation:nod 3.1s ease-in-out infinite}
@keyframes nod{0%,72%,100%{transform:rotate(0) translateY(0)}84%{transform:rotate(6deg) translateY(2px)}}
.sheep.parading{animation:paradeBob .42s steps(2,end) infinite alternate}
@keyframes paradeBob{to{margin-top:-4px}}
.sheep-tag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:9px;white-space:nowrap;padding:3px 6px;border-radius:7px;background:rgba(255,255,255,.78);box-shadow:0 2px 0 rgba(40,76,45,.08);opacity:0;transition:opacity .15s;pointer-events:none}
.sheep:hover .sheep-tag{opacity:1}

#board{position:absolute;z-index:1200;width:min(330px,calc(100vw - 26px));padding:15px 15px 14px;border:3px solid #65482f;border-radius:9px;background:linear-gradient(#fff8dd,#f7e8bd);box-shadow:8px 8px 0 rgba(46,69,43,.16),inset 0 0 0 2px rgba(255,255,255,.54);display:none;transform:translate(-50%,-100%);user-select:text}
#board.open{display:block}
#board:after{content:"";position:absolute;left:50%;bottom:-11px;width:17px;height:17px;background:#f7e8bd;border-right:3px solid #65482f;border-bottom:3px solid #65482f;transform:translateX(-50%) rotate(45deg)}
.board-head{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:9px;border-bottom:2px dashed rgba(101,72,47,.23)}
.board-head strong{font-size:14px}.state{font-size:10px;padding:3px 7px;border-radius:999px;background:#d9efbe;color:#315b2e}.city{margin-left:auto;font-size:10px;opacity:.6}
.verse{font-size:11px;color:#665a47;margin:6px 0 10px}.messages{display:grid;gap:7px;max-height:175px;overflow:auto}.msg{font-size:11px;line-height:1.55;padding:7px 8px;background:rgba(255,255,255,.55);border-left:3px solid #8ac075}.msg.item{border-left-color:#d99447}.board-actions{display:flex;gap:7px;margin-top:10px}.board-actions button{border:2px solid rgba(101,72,47,.25);background:#fff8e6;border-radius:7px;padding:7px 10px;font-size:10px;cursor:pointer}.board-actions .primary{background:#6bb25a;color:white;border-color:#4f9344}

#bottomhint{position:absolute;left:50%;bottom:18px;z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.53);backdrop-filter:blur(9px);box-shadow:0 4px 0 rgba(54,91,50,.08);font-size:10px;letter-spacing:.07em;white-space:nowrap}
#bottomhint b{font-size:12px}
#world.fade-board #board{display:none!important}

@media(max-width:700px){
  #brand{left:13px;top:13px}#brand strong{font-size:23px}.brand-sheep{width:31px;height:26px}#brand span{display:none}
  #slogan{left:15px;top:70px}#slogan .hand{font-size:19px}#slogan small{font-size:9px}
  #topnav{right:9px;top:9px;gap:2px}.navchip{display:none}#sound{width:38px;height:38px}
  #stage-note{top:56px;font-size:9px}.sheep{width:68px;height:56px}#bottomhint{font-size:9px;bottom:10px}
}
@media(prefers-reduced-motion:reduce){.sheep .tail,.sheep.walking .leg1,.sheep.walking .leg2,.sheep.idle .head,.sheep.parading{animation:none!important}}
</style>
</head>

</g>

</g>

<div id="brand">
<svg class="brand-sheep" viewBox="0 0 72 58" aria-hidden="true"><g><circle cx="36" cy="28" r="17" fill="#fff2d8"/><circle cx="24" cy="26" r="12" fill="#fff2d8"/><circle cx="47" cy="24" r="12" fill="#fff2d8"/><ellipse cx="17" cy="32" rx="11" ry="10" fill="#5b4638"/><circle cx="13" cy="30" r="1.5"/><circle cx="20" cy="30" r="1.5"/><rect x="28" y="42" width="4" height="10" rx="2" fill="#44382f"/><rect x="45" y="42" width="4" height="10" rx="2" fill="#44382f"/></g></svg>
<div><strong>同路</strong><span>一群羊，在更好的路上</span></div>
</div>
<div id="slogan"><span class="hand">同路</span><small>温柔的相遇<br>也会走成远方</small></div>
<div id="topnav"><button class="navchip" type="button">留言</button><button class="navchip" type="button">同路</button><button class="navchip" type="button">物品</button><button id="sound" type="button" aria-label="播放音乐" aria-pressed="false">♪</button></div>
<div id="stage-note">开场 · 一起出发</div>

<div id="board" role="dialog" aria-live="polite"></div>
<div id="bottomhint"><b>∞</b><span>没有边界，只有远近 · 点羊留言 · 抓住也可以扔出去</span></div>
</div>
<script>
(()=>{
const world=document.getElementById('world');
const layer=document.getElementById('sheep-layer');
const board=document.getElementById('board');
const soundBtn=document.getElementById('sound');
const note=document.getElementById('stage-note');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const groups={sky:document.getElementById('skyLayer'),far:document.getElementById('farLayer'),mid:document.getElementById('midLayer'),near:document.getElementById('nearLayer'),frame:document.getElementById('frameLayer')};
const palettes=[
 ['#fff1d8','#544238','#d7ad72','#7bb7d8'],['#f7f0e8','#3d3a37','#90c7e3','#87bb70'],['#f7e3bf','#704839','#d88e78','#d7a84d'],
 ['#eee7ff','#4f4362','#9f8cdd','#9ebd6d'],['#e6f1da','#4d5a43','#80b56b','#8bbddf'],['#f8e5ea','#6f4654','#df8fa7','#7fb8d8'],
 ['#deedf9','#415266','#8bb8d8','#d49751'],['#f5ecd1','#51493c','#b8a57e','#7cae6e'],['#e8efe3','#39483b','#91ba8d','#c79a5d']
];
const names=['小云','阿禾','小石','小满','小北','一川','若木','山雀','阿岚','小鹿','阿朔','青禾','阿林','小川','星河','小麦','南风','木木'];
const sheepData=Array.from({length:18},(_,i)=>({id:i+1,name:names[i],city:'北京',status:['可跟','求带','随意'][i%3],verse:['诗 23:1','太 7:14','诗 121:1','约 14:6','腓 4:6'][i%5],colors:palettes[i%palettes.length],flower:i%5===1||i%7===0,messages:i%4===0?[{type:'item',text:'有一本书想送给需要的人。'}]:i%5===0?[{type:'road',text:'周末想走一小段，有人同路吗？'}]:[]}));
const actors=[];let parade=true;let audioCtx=null,musicOn=false,musicTimer=null;
function sprite(d){const flower=d.flower?'<g transform="translate(28 9)"><circle class="flower" cx="0" cy="0" r="4"/><circle class="flower" cx="7" cy="2" r="4"/><circle class="flowerCore" cx="3.5" cy="1" r="2"/></g>':'';return `<svg viewBox="0 0 78 64" aria-hidden="true"><g class="body"><circle class="wool" cx="40" cy="31" r="18"/><circle class="wool" cx="29" cy="29" r="15"/><circle class="wool" cx="51" cy="28" r="14"/><circle class="wool" cx="45" cy="39" r="14"/><circle class="patch" cx="44" cy="29" r="8"/><g class="head"><ellipse class="face" cx="18" cy="34" rx="12" ry="11"/><ellipse class="ear" cx="10" cy="27" rx="5" ry="3" transform="rotate(20 10 27)"/><ellipse class="ear" cx="25" cy="27" rx="5" ry="3" transform="rotate(-20 25 27)"/><circle class="eye" cx="14" cy="33" r="1.6"/><circle class="eye" cx="21" cy="33" r="1.6"/><circle class="cheek" cx="23" cy="38" r="2.2"/></g><path class="scarf" d="M23 41 Q30 45 36 42 L34 48 Q28 47 23 44Z"/><rect class="leg leg1" x="31" y="45" width="6" height="13" rx="2"/><rect class="leg leg2" x="50" y="44" width="6" height="14" rx="2"/><ellipse class="wool tail" cx="62" cy="31" rx="7" ry="5"/>${flower}</g></svg><div class="sheep-tag">${d.name}</div>`}
function create(d,i){const el=document.createElement('div');el.className='sheep idle parading';el.innerHTML=sprite(d);el.style.setProperty('--wool',d.colors[0]);el.style.setProperty('--face',d.colors[1]);el.style.setProperty('--patch',d.colors[2]);el.style.setProperty('--scarf',d.colors[3]);layer.appendChild(el);const a={d,el,x:0,y:0,vx:0,vy:0,z:.86+(i%5)*.045,target:null,drag:null,phase:Math.random()*6.28};actors.push(a);bind(a);return a}
function formation(){const w=innerWidth,h=innerHeight,cols=Math.min(6,Math.max(3,Math.floor(w/128))),gap=Math.min(100,w/(cols+1)),rows=Math.ceil(actors.length/cols);actors.forEach((a,i)=>{const row=Math.floor(i/cols),col=i%cols;a.x=w/2-(cols-1)*gap/2+col*gap;a.y=h*.48+(row-(rows-1)/2)*59;a.z=.88+row*.06;render(a)})}
function paradeStep(n){const w=innerWidth,h=innerHeight;actors.forEach((a,i)=>{const ang=i/actors.length*Math.PI*2;if(n===1)a.target={x:w/2+Math.cos(ang)*Math.min(w*.26,230),y:h*.53+Math.sin(ang)*76};if(n===2){const row=Math.floor(i/6),col=i%6;a.target={x:w/2+(col-2.5)*70,y:h*.43+row*62}}if(n===3)a.target={x:w*.13+Math.random()*w*.74,y:h*.48+Math.random()*h*.36}})}
function finishParade(){parade=false;note.classList.add('hidden');actors.forEach(a=>{a.target=null;a.el.classList.remove('parading');a.vx=(Math.random()-.5)*.35;a.vy=(Math.random()-.5)*.18})}
function startParade(){formation();if(reduced){setTimeout(finishParade,700);return}setTimeout(()=>paradeStep(1),1100);setTimeout(()=>paradeStep(2),2800);setTimeout(()=>paradeStep(3),4600);setTimeout(finishParade,6500)}
function bind(a){let start=null,moved=false;a.el.addEventListener('pointerdown',e=>{e.preventDefault();moved=false;start={x:e.clientX,y:e.clientY,t:performance.now()};a.drag={ox:e.clientX-a.x,oy:e.clientY-a.y,lastX:e.clientX,lastY:e.clientY,lastT:performance.now(),vx:0,vy:0};a.el.setPointerCapture(e.pointerId);a.el.classList.add('grabbed');board.classList.remove('open')});a.el.addEventListener('pointermove',e=>{if(!a.drag)return;const now=performance.now(),dt=Math.max(8,now-a.drag.lastT),dx=e.clientX-a.drag.lastX,dy=e.clientY-a.drag.lastY;a.drag.vx=dx/dt*16;a.drag.vy=dy/dt*16;a.drag.lastX=e.clientX;a.drag.lastY=e.clientY;a.drag.lastT=now;a.x=e.clientX-a.drag.ox;a.y=e.clientY-a.drag.oy;if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>6)moved=true;render(a)});a.el.addEventListener('pointerup',()=>{if(!a.drag)return;const speed=Math.hypot(a.drag.vx,a.drag.vy);a.vx=a.drag.vx*1.75;a.vy=a.drag.vy*1.75;a.drag=null;a.el.classList.remove('grabbed');if(!moved&&performance.now()-start.t<300)openBoard(a);else if(speed<.5){a.vx=(Math.random()-.5)*.35;a.vy=(Math.random()-.5)*.18}})}
function openBoard(a){board.innerHTML=`<div class="board-head"><strong>${a.d.name}</strong><span class="state">${a.d.status}</span><span class="city">${a.d.city}</span></div><div class="verse">经文编号 · ${a.d.verse}</div><div class="messages">${a.d.messages.length?a.d.messages.map(m=>`<div class="msg ${m.type==='item'?'item':''}">${m.type==='item'?'物品 · ':''}${m.text}</div>`).join(''):'<div class="msg">今天还没有留言。</div>'}</div><div class="board-actions"><button type="button">回应</button><button type="button" class="primary">同路</button></div>`;board.style.left=Math.max(170,Math.min(innerWidth-170,a.x))+'px';board.style.top=Math.max(180,a.y-34)+'px';board.classList.add('open')}
world.addEventListener('pointerdown',e=>{if(!e.target.closest('.sheep')&&!e.target.closest('#board')&&!e.target.closest('#topnav'))board.classList.remove('open')});
function choose(a){a.target={x:50+Math.random()*(innerWidth-100),y:innerHeight*.45+Math.random()*innerHeight*.40}}
function render(a){const depth=Math.max(.61,Math.min(1.31,a.z));a.el.style.left=(a.x-39)+'px';a.el.style.top=(a.y-32)+'px';const flip=a.vx<-.08?' scaleX(-1)':'';a.el.style.transform=`scale(${depth})${flip}`;a.el.style.zIndex=String(100+Math.floor(a.y))}
let last=performance.now();function tick(now){const dt=Math.min(2.2,(now-last)/16.67);last=now;actors.forEach((a,i)=>{if(a.drag){a.el.classList.remove('walking');return}if(parade&&a.target){a.x+=(a.target.x-a.x)*.05*dt;a.y+=(a.target.y-a.y)*.05*dt;a.el.classList.add('walking')}else if(!parade){if(Math.abs(a.vx)+Math.abs(a.vy)>1.15){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.963;a.vy*=.963;a.el.classList.add('walking')}else{if(!a.target||Math.hypot(a.target.x-a.x,a.target.y-a.y)<18||Math.random()<.0015)choose(a);const dx=a.target.x-a.x,dy=a.target.y-a.y,dist=Math.hypot(dx,dy)||1,s=.17+(i%4)*.02;a.vx=a.vx*.92+(dx/dist)*s*.08;a.vy=a.vy*.92+(dy/dist)*s*.08;a.x+=a.vx*dt;a.y+=a.vy*dt;a.el.classList.toggle('walking',dist>25)}
// 无边界：离开一侧后从远处重新进入，并交换景深。
if(a.x<-100){a.x=innerWidth+80;a.z=.67}if(a.x>innerWidth+100){a.x=-80;a.z=1.18}if(a.y<innerHeight*.37){a.y=innerHeight*.86;a.z=1.23}if(a.y>innerHeight*.94){a.y=innerHeight*.44;a.z=.66}a.z+=Math.sin(now/4300+a.phase)*.00042*dt}render(a)});requestAnimationFrame(tick)}
world.addEventListener('pointermove',e=>{const px=e.clientX/innerWidth-.5,py=e.clientY/innerHeight-.5;groups.sky.style.transform=`translate(${px*-7}px,${py*-3}px)`;groups.far.style.transform=`translate(${px*-13}px,${py*-5}px)`;groups.mid.style.transform=`translate(${px*-22}px,${py*-8}px)`;groups.near.style.transform=`translate(${px*-34}px,${py*-11}px)`;groups.frame.style.transform=`translate(${px*-44}px,${py*-14}px)`});
function tone(freq,dur,when=0,vol=.028){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(0,audioCtx.currentTime+when);g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+when+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.05)}
function musicLoop(){if(!musicOn)return;[392,494,587,494,440,523,659,523].forEach((f,i)=>tone(f,.22,i*.23,.022));musicTimer=setTimeout(musicLoop,1900)}
soundBtn.addEventListener('click',()=>{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();musicOn=!musicOn;soundBtn.setAttribute('aria-pressed',String(musicOn));soundBtn.textContent=musicOn?'♫':'♪';if(musicOn){audioCtx.resume();musicLoop()}else clearTimeout(musicTimer)});
sheepData.forEach(create);startParade();requestAnimationFrame(tick);addEventListener('resize',()=>{if(parade)formation()});
})();
</script>
