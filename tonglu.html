<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>同路 · 场景</title>
<meta name="theme-color" content="#8ed8ff" />
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8ff}
body{touch-action:none}
#scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:linear-gradient(#8ed8ff 0 34%,#9fdc62 72%,#73bd47 100%)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 56%;z-index:0;opacity:0;transition:opacity .45s ease;filter:saturate(1.03) brightness(1.025);transform:translateZ(0)}
#bg.ready{opacity:1}

/* sunlight: clearly alive, never flashy */
#sunwash{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 8% 2%,rgba(255,252,196,.42) 0%,rgba(255,244,166,.19) 15%,rgba(255,255,255,.07) 30%,transparent 53%);mix-blend-mode:screen;animation:sunBreath 7.5s ease-in-out infinite alternate!important}
#sunbeam{position:absolute;z-index:2;pointer-events:none;left:-6%;top:-3%;width:50%;height:49%;background:linear-gradient(112deg,rgba(255,252,210,.22),rgba(255,255,255,.05) 38%,transparent 65%);clip-path:polygon(0 0,100% 0,68% 100%,12% 100%);mix-blend-mode:screen;transform-origin:0 0;animation:sunSweep 16s ease-in-out infinite alternate!important}
@keyframes sunBreath{0%{opacity:.62}100%{opacity:1}}
@keyframes sunSweep{0%{opacity:.28;transform:rotate(-1deg) scaleX(.98)}100%{opacity:.58;transform:rotate(1deg) scaleX(1.04)}}

/* moving cloud overlays; static painted clouds remain part of the mother image */
.cloud{position:absolute;z-index:3;pointer-events:none;width:170px;height:46px;border-radius:999px;background:rgba(255,255,255,.54);filter:blur(7px);box-shadow:48px -12px 0 5px rgba(255,255,255,.45),92px 2px 0 -2px rgba(255,255,255,.38),26px 9px 0 1px rgba(255,255,255,.32);mix-blend-mode:screen;will-change:transform;opacity:.72}
.cloud.c1{top:9%;left:-320px;animation:cloudDrift1 42s linear infinite!important}
.cloud.c2{top:18%;left:-420px;transform:scale(.72);opacity:.48;animation:cloudDrift2 57s linear infinite 8s!important}
.cloud.c3{top:25%;left:-280px;transform:scale(.52);opacity:.34;animation:cloudDrift3 49s linear infinite 21s!important}
@keyframes cloudDrift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(calc(100vw + 650px),8px,0) scale(1)}}
@keyframes cloudDrift2{from{transform:translate3d(0,0,0) scale(.72)}to{transform:translate3d(calc(100vw + 760px),-5px,0) scale(.72)}}
@keyframes cloudDrift3{from{transform:translate3d(0,0,0) scale(.52)}to{transform:translate3d(calc(100vw + 620px),5px,0) scale(.52)}}

/* right-side waterfall: independent animated water over the painted waterfall */
#waterfall{position:absolute;z-index:5;pointer-events:none;overflow:hidden;border-radius:28% 28% 45% 45%;mix-blend-mode:screen;opacity:.88;filter:drop-shadow(0 2px 5px rgba(210,247,255,.42));will-change:left,top,width,height}
#waterfall .stream{position:absolute;inset:-55% -25%;background:repeating-linear-gradient(94deg,rgba(255,255,255,.06) 0 7%,rgba(255,255,255,.78) 8% 14%,rgba(173,231,255,.28) 15% 24%,rgba(255,255,255,.48) 25% 30%,rgba(159,221,249,.12) 31% 43%);background-size:100% 54px;animation:waterfallFlow .86s linear infinite!important}
#waterfall .stream.s2{opacity:.6;filter:blur(1.2px);animation-duration:1.24s!important;transform:translateX(7%)}
#waterfall .mist{position:absolute;left:-65%;right:-65%;height:42%;bottom:-16%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.84),rgba(215,246,255,.34) 38%,transparent 72%);filter:blur(7px);animation:mistBreath 2.8s ease-in-out infinite alternate!important}
@keyframes waterfallFlow{from{background-position:0 -54px;transform:translateY(-18px)}to{background-position:0 54px;transform:translateY(18px)}}
@keyframes mistBreath{from{opacity:.32;transform:scale(.82)}to{opacity:.82;transform:scale(1.18)}}

/* lake: traveling light band + individual glints */
#shimmer{position:absolute;z-index:4;pointer-events:none;overflow:hidden;mix-blend-mode:screen;will-change:left,top,width,height;border-radius:46%}
#shimmer::before{content:"";position:absolute;inset:-25% -35%;background:repeating-linear-gradient(172deg,transparent 0 18px,rgba(255,255,255,.13) 20px 22px,transparent 25px 44px);transform:translateX(-14%);animation:rippleTravel 5.8s linear infinite!important;opacity:.72}
#shimmer::after{content:"";position:absolute;top:-20%;bottom:-20%;width:32%;left:-38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),rgba(255,246,188,.24),transparent);filter:blur(5px);animation:lightSweep 7.2s ease-in-out infinite!important}
@keyframes rippleTravel{to{transform:translateX(14%) translateY(8px)}}
@keyframes lightSweep{0%,12%{left:-40%;opacity:0}30%{opacity:.78}68%{opacity:.42}88%,100%{left:116%;opacity:0}}
.glint{position:absolute;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),rgba(255,244,182,.68),transparent);filter:blur(.15px);animation:glint 3.9s ease-in-out infinite!important;opacity:0}
.glint:nth-child(1){width:21%;left:7%;top:22%;animation-delay:-.5s}.glint:nth-child(2){width:13%;left:31%;top:43%;animation-delay:-2.1s}.glint:nth-child(3){width:24%;left:55%;top:66%;animation-delay:-1.25s}.glint:nth-child(4){width:16%;left:74%;top:30%;animation-delay:-3.0s}.glint:nth-child(5){width:10%;left:23%;top:77%;animation-delay:-2.65s}.glint:nth-child(6){width:18%;left:51%;top:18%;animation-delay:-3.4s}
@keyframes glint{0%,62%,100%{opacity:0;transform:translateX(-16px) scaleX(.65)}72%{opacity:.96}84%{opacity:.25;transform:translateX(28px) scaleX(1.28)}}

/* scattered flower twinkles */
#flowers{position:absolute;inset:0;z-index:6;pointer-events:none}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fffde7;box-shadow:0 0 8px 2px rgba(255,249,190,.8);opacity:0;animation:flowerBlink var(--dur) ease-in-out infinite var(--delay)!important}
.spark::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.8}
.spark.warm{background:#ffe49b;box-shadow:0 0 8px 2px rgba(255,214,118,.72)}
@keyframes flowerBlink{0%,70%,100%{opacity:0;transform:scale(.55) rotate(0)}77%{opacity:1;transform:scale(1.22) rotate(12deg)}84%{opacity:.28;transform:scale(.82) rotate(0)}}
#veil{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.018),transparent 48%,rgba(46,111,38,.022))}

@media(max-width:760px){#bg{object-position:50% 54%}.cloud{filter:blur(5px)}}
/* Intentionally do not freeze ambient nature when prefers-reduced-motion is set:
   motion is slow, non-interactive, and is an explicit part of this scene's content. */
</style>
</head>
<body>
<main id="scene" aria-label="同路草原场景">
  <img id="bg" alt="阳光下的山谷、草原、湖泊与瀑布" />
  <div id="sunwash"></div><div id="sunbeam"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div id="shimmer"><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i></div>
  <div id="waterfall"><i class="stream"></i><i class="stream s2"></i><i class="mist"></i></div>
  <div id="flowers"></div>
  <div id="veil"></div>
</main>
<script>
(()=>{
  const bg=document.getElementById('bg');
  const waterfall=document.getElementById('waterfall');
  const shimmer=document.getElementById('shimmer');
  const flowers=document.getElementById('flowers');
  const source={w:1448,h:1086};
  const desktopPosY=.56, mobilePosY=.54;
  const waterfallRect={x:.885,y:.275,w:.052,h:.155};
  const lakeRect={x:.505,y:.292,w:.455,h:.205};

  function objectPositionY(){return innerWidth<=760?mobilePosY:desktopPosY}
  function mapRect(r,el){
    const vw=innerWidth,vh=innerHeight;
    const scale=Math.max(vw/source.w,vh/source.h);
    const dw=source.w*scale,dh=source.h*scale;
    const ox=(vw-dw)*.5;
    const oy=(vh-dh)*objectPositionY();
    el.style.left=(ox+r.x*dw)+'px';
    el.style.top=(oy+r.y*dh)+'px';
    el.style.width=(r.w*dw)+'px';
    el.style.height=(r.h*dh)+'px';
  }
  function placeSceneEffects(){mapRect(waterfallRect,waterfall);mapRect(lakeRect,shimmer)}

  const points=[
    [7,73],[10,82],[14,67],[18,89],[22,77],[26,63],[29,85],[33,71],[36,93],[40,80],[44,66],[47,88],
    [51,75],[54,94],[58,69],[61,84],[65,78],[68,91],[72,72],[75,86],[79,65],[82,80],[86,92],[90,73],[94,85],
    [18,59],[31,57],[43,61],[56,58],[69,60],[82,57]
  ];
  points.forEach((p,i)=>{
    const s=document.createElement('i');
    s.className='spark'+(i%4===0?' warm':'');
    s.style.left=p[0]+'%';s.style.top=p[1]+'%';
    s.style.setProperty('--dur',(3.8+(i%7)*.43)+'s');
    s.style.setProperty('--delay',(-((i*1.19)%6.7))+'s');
    flowers.appendChild(s);
  });

  Promise.all([1,2,3,4,5,6].map(i=>fetch(`/assets/tonglu-bg/${i}.txt?v=4`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('bg '+i);return r.text()})))
    .then(parts=>{
      bg.onload=()=>{bg.classList.add('ready');placeSceneEffects()};
      bg.src='data:image/webp;base64,'+parts.join('').trim();
    })
    .catch(()=>{document.getElementById('scene').style.background='linear-gradient(#8ed8ff 0 34%,#a7df67 68%,#75bd4a 100%)'});

  addEventListener('resize',placeSceneEffects,{passive:true});
  placeSceneEffects();
})();
</script>
</body>
</html>
