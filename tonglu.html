<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>同路 · 场景</title>
<meta name="theme-color" content="#8ed8ff" />
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8ff}
body{touch-action:none}
#scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:linear-gradient(#8ed8ff 0 34%,#9fdc62 72%,#73bd47 100%)}
#bg{position:absolute;inset:-1%;width:102%;height:102%;object-fit:cover;object-position:50% 56%;z-index:0;opacity:0;transition:opacity .65s ease;filter:saturate(1.025) brightness(1.02);transform:translateZ(0)}
#bg.ready{opacity:1}
#sunwash{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 9% 4%,rgba(255,250,187,.32) 0%,rgba(255,244,166,.15) 16%,rgba(255,255,255,.045) 34%,transparent 55%);mix-blend-mode:screen;animation:sunBreath 11s ease-in-out infinite alternate}
@keyframes sunBreath{0%{opacity:.67}100%{opacity:1}}
.cloud{position:absolute;z-index:3;pointer-events:none;border-radius:50%;filter:blur(16px);background:rgba(255,255,255,.26);mix-blend-mode:screen;opacity:.38;will-change:transform}
.cloud.c1{width:17vw;height:4.2vw;left:-22vw;top:7%;animation:cloudDrift1 88s linear infinite}
.cloud.c2{width:13vw;height:3.4vw;left:-18vw;top:15%;opacity:.24;animation:cloudDrift2 112s linear infinite 18s}
.cloud.c3{width:10vw;height:2.8vw;left:-15vw;top:22%;opacity:.18;animation:cloudDrift3 96s linear infinite 43s}
@keyframes cloudDrift1{to{transform:translateX(140vw)}}
@keyframes cloudDrift2{to{transform:translateX(146vw)}}
@keyframes cloudDrift3{to{transform:translateX(150vw)}}
#waterfall{position:absolute;z-index:4;pointer-events:none;overflow:hidden;border-radius:46% 34% 56% 44%;mix-blend-mode:screen;opacity:.46;filter:blur(.25px);will-change:left,top,width,height}
#waterfall::before{content:"";position:absolute;inset:-34% -18%;background:repeating-linear-gradient(90deg,rgba(239,252,255,.03) 0 10%,rgba(255,255,255,.64) 11% 18%,rgba(175,233,255,.24) 19% 31%,rgba(255,255,255,.4) 32% 38%,rgba(170,229,255,.09) 39% 51%);background-size:100% 42px;animation:waterfallFlow 1.18s linear infinite}
#waterfall::after{content:"";position:absolute;left:-40%;right:-40%;height:34%;bottom:-13%;border-radius:50%;background:radial-gradient(ellipse,rgba(245,253,255,.62),rgba(213,246,255,.26) 38%,transparent 70%);filter:blur(8px);animation:mistBreath 4.8s ease-in-out infinite alternate}
@keyframes waterfallFlow{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
@keyframes mistBreath{from{opacity:.36;transform:scale(.88)}to{opacity:.72;transform:scale(1.12)}}
#shimmer{position:absolute;z-index:5;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.46;will-change:left,top,width,height}
.glint{position:absolute;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);filter:blur(.15px);animation:glint 7.5s ease-in-out infinite;opacity:0}
.glint:nth-child(1){width:18%;left:9%;top:24%;animation-delay:-1.1s}.glint:nth-child(2){width:11%;left:38%;top:43%;animation-delay:-4.2s}.glint:nth-child(3){width:22%;left:58%;top:66%;animation-delay:-2.7s}.glint:nth-child(4){width:13%;left:73%;top:31%;animation-delay:-6.1s}.glint:nth-child(5){width:9%;left:27%;top:76%;animation-delay:-5.1s}
@keyframes glint{0%,72%,100%{opacity:0;transform:translateX(-10px) scaleX(.72)}78%{opacity:.58}87%{opacity:.22;transform:translateX(22px) scaleX(1.18)}}
#flowers{position:absolute;inset:0;z-index:6;pointer-events:none}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fffde7;box-shadow:0 0 5px rgba(255,250,194,.85);opacity:0;animation:flowerBlink var(--dur) ease-in-out infinite var(--delay)}
.spark.warm{background:#ffe9a5;box-shadow:0 0 5px rgba(255,220,133,.75)}
@keyframes flowerBlink{0%,76%,100%{opacity:0;transform:scale(.62)}81%{opacity:.88;transform:scale(1.18)}87%{opacity:.18;transform:scale(.8)}}
#veil{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.018),transparent 48%,rgba(46,111,38,.025));}
@media(max-width:760px){#bg{object-position:50% 53%}.cloud{filter:blur(10px)}}
@media(prefers-reduced-motion:reduce){#sunwash,.cloud,#waterfall::before,#waterfall::after,.glint,.spark{animation:none!important}.spark{display:none}.cloud{display:none}}
</style>
</head>
<body>
<main id="scene" aria-label="同路草原场景">
  <img id="bg" alt="阳光下的山谷、草原、湖泊与瀑布" />
  <div id="sunwash"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div id="waterfall"></div>
  <div id="shimmer"><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i></div>
  <div id="flowers"></div>
  <div id="veil"></div>
</main>
<script>
(()=>{
  const bg=document.getElementById('bg');
  const waterfall=document.getElementById('waterfall');
  const shimmer=document.getElementById('shimmer');
  const flowers=document.getElementById('flowers');
  const POS_Y=.56;
  const source={w:1024,h:768};
  const waterfallRect={x:.895,y:.246,w:.040,h:.145};
  const lakeRect={x:.605,y:.303,w:.355,h:.205};

  function mapRect(r,el){
    const vw=innerWidth,vh=innerHeight;
    const scale=Math.max(vw/source.w,vh/source.h);
    const dw=source.w*scale,dh=source.h*scale;
    const ox=(vw-dw)*.5;
    const oy=(vh-dh)*POS_Y;
    el.style.left=(ox+r.x*dw)+'px';
    el.style.top=(oy+r.y*dh)+'px';
    el.style.width=(r.w*dw)+'px';
    el.style.height=(r.h*dh)+'px';
  }
  function placeSceneEffects(){mapRect(waterfallRect,waterfall);mapRect(lakeRect,shimmer)}

  const points=[
    [8,70],[13,76],[18,64],[22,82],[27,72],[31,88],[35,62],[39,79],[43,69],[47,91],[51,74],[55,84],
    [59,66],[63,89],[67,77],[71,61],[75,83],[79,72],[83,92],[87,68],[91,81],[95,75],[25,59],[48,57],[70,55],[89,59]
  ];
  points.forEach((p,i)=>{
    const s=document.createElement('i');s.className='spark'+(i%4===0?' warm':'');
    s.style.left=p[0]+'%';s.style.top=p[1]+'%';
    s.style.setProperty('--dur',(6.6+(i%7)*.61)+'s');
    s.style.setProperty('--delay',(-((i*1.37)%8.8))+'s');
    flowers.appendChild(s);
  });

  Promise.all([1,2,3,4,5,6].map(i=>fetch(`/assets/tonglu-bg/${i}.txt?v=2`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('bg '+i);return r.text()})))
    .then(parts=>{bg.onload=()=>{bg.classList.add('ready');placeSceneEffects()};bg.src='data:image/webp;base64,'+parts.join('').trim()})
    .catch(()=>{document.getElementById('scene').style.background='linear-gradient(#8ed8ff 0 34%,#a7df67 68%,#75bd4a 100%)'});

  addEventListener('resize',placeSceneEffects,{passive:true});
  placeSceneEffects();
})();
</script>
</body>
</html>
