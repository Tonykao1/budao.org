<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>同路 · 步道</title>
<meta name="theme-color" content="#bfe8ff">
<style>
:root{
  --ink:#26312c;
  --paper:#fffdf1;
  --sky1:#8fd6ff;
  --sky2:#dff7ff;
  --grass1:#9cdb67;
  --grass2:#72c85c;
  --grass3:#4fa84f;
  --pixel:4px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#a7ddff;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Cascadia Mono","Roboto Mono",monospace;overflow:hidden}
button,input,textarea,select{font:inherit}
body{touch-action:none;user-select:none}
#world{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 52%,#d5efbb 53%,#84ce61 72%,#5eb24e 100%)}
#world::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,0));mix-blend-mode:screen}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.82;filter:drop-shadow(0 4px 0 rgba(255,255,255,.25));animation:cloud 55s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:42%;height:150%;left:18%;top:-58%}.cloud:after{width:34%;height:120%;right:12%;top:-38%}
.c1{width:130px;height:30px;left:8%;top:12%;animation-duration:62s}.c2{width:92px;height:22px;left:58%;top:19%;animation-duration:79s;animation-delay:-24s}.c3{width:150px;height:32px;left:82%;top:9%;animation-duration:70s;animation-delay:-37s}@keyframes cloud{from{transform:translateX(-180px)}to{transform:translateX(calc(100vw + 220px))}}
.depth{position:absolute;left:-15vw;width:130vw;pointer-events:none;transform-origin:center bottom;will-change:transform}
.hills-back{bottom:35%;height:36%;opacity:.72;background:radial-gradient(ellipse at 12% 100%,#79ba76 0 24%,transparent 25%),radial-gradient(ellipse at 31% 100%,#6dac70 0 28%,transparent 29%),radial-gradient(ellipse at 52% 100%,#78b97a 0 25%,transparent 26%),radial-gradient(ellipse at 74% 100%,#629f68 0 29%,transparent 30%),radial-gradient(ellipse at 95% 100%,#78b979 0 26%,transparent 27%)}
.hills-mid{bottom:25%;height:31%;opacity:.92;background:radial-gradient(ellipse at 6% 100%,#64b45b 0 27%,transparent 28%),radial-gradient(ellipse at 28% 100%,#68b95d 0 29%,transparent 30%),radial-gradient(ellipse at 51% 100%,#5baa55 0 32%,transparent 33%),radial-gradient(ellipse at 75% 100%,#64b95b 0 28%,transparent 29%),radial-gradient(ellipse at 96% 100%,#56aa50 0 30%,transparent 31%)}
.meadow{position:absolute;left:-10vw;bottom:-9vh;width:120vw;height:56vh;background:linear-gradient(#83d15f,#6cc354 48%,#57ae4a);border-radius:50% 50% 0 0/12% 12% 0 0;transform:perspective(900px) rotateX(3deg);box-shadow:inset 0 16px 0 rgba(255,255,255,.08)}
.flowers{position:absolute;left:0;right:0;bottom:0;height:48vh;pointer-events:none;opacity:.7;background-image:radial-gradient(circle,#fff8d6 0 2px,transparent 3px),radial-gradient(circle,#ffd45d 0 2px,transparent 3px),radial-gradient(circle,#f8a4b8 0 2px,transparent 3px);background-size:67px 71px,83px 79px,97px 89px;background-position:10px 8px,41px 34px,17px 51px}
#title{position:absolute;z-index:50;left:24px;top:22px;display:flex;align-items:baseline;gap:14px;color:#203126;text-shadow:0 2px 0 rgba(255,255,255,.7)}
#title strong{font-size:26px;letter-spacing:.12em}#title span{font-size:11px;opacity:.62;letter-spacing:.18em}
#sound{position:absolute;z-index:51;right:20px;top:18px;width:44px;height:44px;border:2px solid rgba(37,70,48,.25);background:rgba(255,255,255,.52);backdrop-filter:blur(8px);border-radius:14px;color:#203126;cursor:pointer;box-shadow:0 5px 0 rgba(41,90,50,.12)}
#sound:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(41,90,50,.12)}
#stage-note{position:absolute;z-index:45;left:50%;top:72px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.58);font-size:11px;letter-spacing:.12em;opacity:.78;transition:opacity .6s}
#stage-note.hidden{opacity:0}
#sheep-layer{position:absolute;inset:0;z-index:20}
.sheep{position:absolute;width:58px;height:45px;cursor:grab;transform-origin:50% 82%;will-change:left,top,transform,filter;filter:drop-shadow(0 5px 0 rgba(40,83,41,.16));touch-action:none}
.sheep.grabbed{cursor:grabbing;z-index:90!important;filter:drop-shadow(0 10px 0 rgba(40,83,41,.12))}
.sheep-body{position:absolute;left:11px;top:11px;width:38px;height:27px;border-radius:46% 52% 48% 48%;background:var(--wool,#f7f0d9);box-shadow:inset 0 -4px 0 rgba(0,0,0,.07),-4px 1px 0 var(--wool),4px 0 0 var(--wool)}
.sheep-body::before,.sheep-body::after{content:"";position:absolute;width:16px;height:15px;border-radius:50%;background:var(--patch,transparent);opacity:.88}.sheep-body::before{left:4px;top:3px}.sheep-body::after{right:2px;bottom:2px}
.face{position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:44% 48% 46% 46%;background:var(--face,#574536);box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}
.face::before,.face::after{content:"";position:absolute;top:7px;width:3px;height:4px;background:#111;border-radius:2px}.face::before{left:5px}.face::after{right:5px}
.ear{position:absolute;top:6px;width:9px;height:5px;background:var(--face,#574536);border-radius:70% 20%}.ear.l{left:-4px;transform:rotate(20deg)}.ear.r{right:-4px;transform:scaleX(-1) rotate(20deg)}
.leg{position:absolute;top:34px;width:5px;height:10px;background:#3f382f;border-radius:0 0 2px 2px}.leg.a{left:16px}.leg.b{left:39px}
.tail{position:absolute;right:3px;top:14px;width:9px;height:8px;background:var(--wool,#f7f0d9);border-radius:70% 45% 55% 70%;transform-origin:left center;animation:tail .9s ease-in-out infinite alternate}@keyframes tail{to{transform:rotate(18deg)}}
.sheep.walking .leg.a{animation:step .35s infinite alternate}.sheep.walking .leg.b{animation:step .35s infinite alternate-reverse}@keyframes step{to{transform:translateY(-3px)}}
.sheep.idle .face{animation:nod 2.8s ease-in-out infinite}@keyframes nod{0%,72%,100%{transform:translateY(0) rotate(0)}84%{transform:translateY(3px) rotate(7deg)}}
.sheep-tag{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:9px;white-space:nowrap;padding:2px 5px;border-radius:6px;background:rgba(255,255,255,.72);opacity:0;transition:opacity .18s;pointer-events:none}.sheep:hover .sheep-tag{opacity:1}
#board{position:absolute;z-index:120;min-width:250px;max-width:min(360px,calc(100vw - 28px));padding:15px;border:3px solid #473a2a;border-radius:8px;background:#fff4cf;box-shadow:7px 7px 0 rgba(61,73,46,.19);display:none;transform:translate(-50%,-100%);user-select:text}
#board.open{display:block}.board-head{display:flex;gap:10px;align-items:center;border-bottom:2px dashed rgba(71,58,42,.24);padding-bottom:9px;margin-bottom:9px}.board-head strong{font-size:14px}.status{font-size:10px;padding:3px 7px;border-radius:999px;background:#c9efaf;color:#285126}.meta{font-size:10px;opacity:.62;margin-left:auto}.verse{font-size:11px;margin:7px 0 9px;color:#5b5142}.messages{display:grid;gap:7px;max-height:160px;overflow:auto}.msg{font-size:11px;line-height:1.55;padding:7px 8px;background:rgba(255,255,255,.55);border-left:3px solid #95c875}.msg.item{border-left-color:#e3a04b}.board-actions{display:flex;gap:7px;margin-top:10px}.board-actions button{border:2px solid rgba(71,58,42,.3);background:#fff9e6;border-radius:7px;padding:7px 10px;font-size:10px;cursor:pointer}.board-actions button.primary{background:#6dba58;color:white;border-color:#4d9840}
#hint{position:absolute;z-index:60;left:50%;bottom:18px;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(6px);white-space:nowrap;box-shadow:0 4px 0 rgba(50,95,51,.1)}
#parade-curtain{position:absolute;inset:0;z-index:35;pointer-events:none;background:radial-gradient(circle at 50% 72%,rgba(255,255,255,.06),rgba(80,158,83,.03) 60%,rgba(30,102,61,.08));opacity:1;transition:opacity 1.1s}#parade-curtain.done{opacity:0}
@media(max-width:640px){#title{left:14px;top:14px}#title strong{font-size:20px}#title span{display:none}#sound{right:12px;top:10px}.sheep{width:54px;height:42px}#hint{bottom:10px;font-size:9px}#stage-note{top:62px}}
@media(prefers-reduced-motion:reduce){.cloud,.tail,.sheep.walking .leg,.sheep.idle .face{animation:none!important}}
</style>
</head>
<body>
<div id="world" aria-label="同路羊群广场">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="depth hills-back" id="back"></div>
  <div class="depth hills-mid" id="mid"></div>
  <div class="meadow"></div><div class="flowers"></div>
  <div id="title"><strong>同路</strong><span>没有边界，只有远近</span></div>
  <button id="sound" type="button" aria-pressed="false" aria-label="播放同路音乐">♪</button>
  <div id="stage-note">羊群演出中 · 每次进入都会重新开始</div>
  <div id="parade-curtain"></div>
  <div id="sheep-layer"></div>
  <div id="board" role="dialog" aria-live="polite"></div>
  <div id="hint">点羊看留言 · 按住拖动 · 快速甩出去</div>
</div>
<script>
(() => {
  const world = document.getElementById('world');
  const layer = document.getElementById('sheep-layer');
  const board = document.getElementById('board');
  const soundBtn = document.getElementById('sound');
  const note = document.getElementById('stage-note');
  const curtain = document.getElementById('parade-curtain');
  const back = document.getElementById('back');
  const mid = document.getElementById('mid');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const palette = [
    ['#fff1cf','#6b4b38','#d9b37a'],['#f7f0e6','#423b36','#94c9df'],['#f5e6b8','#6b4939','#dd8f78'],
    ['#e8e3ff','#4c4161','#9f91e8'],['#e5f2db','#4a5742','#86b66d'],['#f9e7ee','#6c4352','#df8ea6'],
    ['#dcebf8','#3f4f62','#8bb8d8'],['#f5ecd0','#4b4438','#b8a77e'],['#e7efe3','#36483a','#93bd8f']
  ];
  const sheepData = Array.from({length:18}, (_,i) => ({
    id:i+1,
    name:`羊 ${String(i+1).padStart(2,'0')}`,
    city:'北京',
    status:['可跟','求带','随意'][i%3],
    verse:['诗 23:1','太 7:14','诗 121:1','约 14:6','腓 4:6'][i%5],
    colors:palette[i%palette.length],
    messages:i%4===0?[{type:'item',text:'有一本书想送给需要的人。'}]:i%5===0?[{type:'road',text:'周末想走一小段，有人同路吗？'}]:[]
  }));

  const actors=[];
  let parade=true;
  let audioCtx=null, musicOn=false, musicTimer=null;
  let pointer={x:innerWidth/2,y:innerHeight/2};

  function sheepMarkup(d){
    return `<div class="sheep-body"><span class="face"><i class="ear l"></i><i class="ear r"></i></span><i class="leg a"></i><i class="leg b"></i><i class="tail"></i></div><div class="sheep-tag">${d.name}</div>`;
  }

  function createActor(d,i){
    const el=document.createElement('div');
    el.className='sheep idle';
    el.dataset.id=d.id;
    el.innerHTML=sheepMarkup(d);
    el.style.setProperty('--wool',d.colors[0]);
    el.style.setProperty('--face',d.colors[1]);
    el.style.setProperty('--patch',d.colors[2]);
    layer.appendChild(el);
    const actor={d,el,x:0,y:0,vx:0,vy:0,z:.8+(i%6)*.08,target:null,drag:null,lastMove:performance.now(),phase:Math.random()*6.28};
    actors.push(actor);bindActor(actor);return actor;
  }

  function formation(){
    const w=innerWidth,h=innerHeight;
    const cols=Math.min(6,Math.max(3,Math.floor(w/120)));
    const gap=Math.min(92,w/(cols+1));
    actors.forEach((a,i)=>{
      const row=Math.floor(i/cols), col=i%cols;
      const rows=Math.ceil(actors.length/cols);
      a.x=w/2-(cols-1)*gap/2+col*gap;
      a.y=h*.48+(row-(rows-1)/2)*60;
      a.z=.92+row*.04;
      render(a);
    });
  }

  function paradeStep(step){
    const w=innerWidth,h=innerHeight;
    actors.forEach((a,i)=>{
      const ang=(i/actors.length)*Math.PI*2;
      if(step===1){a.target={x:w/2+Math.cos(ang)*Math.min(w*.26,220),y:h*.55+Math.sin(ang)*70};}
      else if(step===2){const side=i%2?-1:1;const row=Math.floor(i/6);a.target={x:w/2+side*(45+(i%6)*30),y:h*.47+row*55};}
      else if(step===3){a.target={x:w*.18+Math.random()*w*.64,y:h*.46+Math.random()*h*.36};}
    });
  }

  function finishParade(){
    parade=false; note.classList.add('hidden'); curtain.classList.add('done');
    actors.forEach(a=>{a.target=null;a.vx=(Math.random()-.5)*.35;a.vy=(Math.random()-.5)*.18;});
  }

  function startParade(){
    formation();
    if(reduced){setTimeout(finishParade,800);return;}
    setTimeout(()=>paradeStep(1),1200);
    setTimeout(()=>paradeStep(2),3000);
    setTimeout(()=>paradeStep(3),4800);
    setTimeout(finishParade,6500);
  }

  function bindActor(a){
    let start=null,moved=false;
    a.el.addEventListener('pointerdown',e=>{
      e.preventDefault(); moved=false; start={x:e.clientX,y:e.clientY,t:performance.now()};
      a.drag={ox:e.clientX-a.x,oy:e.clientY-a.y,lastX:e.clientX,lastY:e.clientY,lastT:performance.now(),vx:0,vy:0};
      a.el.setPointerCapture(e.pointerId);a.el.classList.add('grabbed');board.classList.remove('open');
    });
    a.el.addEventListener('pointermove',e=>{
      if(!a.drag)return;const now=performance.now(),dt=Math.max(8,now-a.drag.lastT);
      const dx=e.clientX-a.drag.lastX,dy=e.clientY-a.drag.lastY;
      a.drag.vx=dx/dt*16;a.drag.vy=dy/dt*16;a.drag.lastX=e.clientX;a.drag.lastY=e.clientY;a.drag.lastT=now;
      a.x=e.clientX-a.drag.ox;a.y=e.clientY-a.drag.oy;if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>6)moved=true;render(a);
    });
    a.el.addEventListener('pointerup',e=>{
      if(!a.drag)return;const speed=Math.hypot(a.drag.vx,a.drag.vy);a.vx=a.drag.vx*1.8;a.vy=a.drag.vy*1.8;a.drag=null;a.el.classList.remove('grabbed');
      if(!moved&&performance.now()-start.t<300)openBoard(a); else if(speed<.5){a.vx=(Math.random()-.5)*.4;a.vy=(Math.random()-.5)*.2;}
    });
  }

  function openBoard(a){
    board.innerHTML=`<div class="board-head"><strong>${a.d.name}</strong><span class="status">${a.d.status}</span><span class="meta">${a.d.city}</span></div><div class="verse">经文编号 · ${a.d.verse}</div><div class="messages">${a.d.messages.length?a.d.messages.map(m=>`<div class="msg ${m.type==='item'?'item':''}">${m.type==='item'?'物品 · ':''}${m.text}</div>`).join(''):'<div class="msg">今天还没有留言。</div>'}</div><div class="board-actions"><button type="button">回应</button><button type="button" class="primary">同路</button></div>`;
    board.style.left=Math.max(150,Math.min(innerWidth-150,a.x))+'px';board.style.top=Math.max(160,a.y-24)+'px';board.classList.add('open');
  }
  world.addEventListener('pointerdown',e=>{if(!e.target.closest('.sheep')&&!e.target.closest('#board')&&!e.target.closest('#sound'))board.classList.remove('open');});

  function chooseTarget(a){
    const margin=50;
    a.target={x:margin+Math.random()*(innerWidth-margin*2),y:innerHeight*.43+Math.random()*innerHeight*.42};
  }

  function render(a){
    const scale=Math.max(.62,Math.min(1.35,a.z));
    a.el.style.left=(a.x-29)+'px';a.el.style.top=(a.y-23)+'px';a.el.style.transform=`scale(${scale}) ${a.vx<-.08?'scaleX(-1)':''}`;a.el.style.zIndex=String(Math.floor(a.y));
  }

  let last=performance.now();
  function tick(now){
    const dt=Math.min(2.2,(now-last)/16.67);last=now;
    actors.forEach((a,i)=>{
      if(a.drag){a.el.classList.remove('walking');return;}
      if(parade&&a.target){
        a.x+=(a.target.x-a.x)*.045*dt;a.y+=(a.target.y-a.y)*.045*dt;a.el.classList.add('walking');
      }else if(!parade){
        if(Math.abs(a.vx)+Math.abs(a.vy)>1.2){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.965;a.vy*=.965;a.el.classList.add('walking');}
        else{
          if(!a.target||Math.hypot(a.target.x-a.x,a.target.y-a.y)<18||Math.random()<.0015)chooseTarget(a);
          const dx=a.target.x-a.x,dy=a.target.y-a.y,dist=Math.hypot(dx,dy)||1;
          const speed=.16+(i%4)*.025;a.vx=a.vx*.92+(dx/dist)*speed*.08;a.vy=a.vy*.92+(dy/dist)*speed*.08;
          a.x+=a.vx*dt;a.y+=a.vy*dt;a.el.classList.toggle('walking',dist>25);
        }
        // 无可见边界：越过世界边缘会从远处重新进入，并改变景深。
        if(a.x<-90){a.x=innerWidth+70;a.z=.68;} if(a.x>innerWidth+90){a.x=-70;a.z=1.18;}
        if(a.y<innerHeight*.36){a.y=innerHeight*.82;a.z=1.22;} if(a.y>innerHeight*.93){a.y=innerHeight*.42;a.z=.7;}
        a.z+=Math.sin(now/4200+a.phase)*.00045*dt;
      }
      render(a);
    });
    requestAnimationFrame(tick);
  }

  world.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};const px=(e.clientX/innerWidth-.5),py=(e.clientY/innerHeight-.5);back.style.transform=`translate(${px*-16}px,${py*-5}px) scale(1.02)`;mid.style.transform=`translate(${px*-28}px,${py*-9}px) scale(1.03)`;});

  function tone(freq,dur,when=.0,vol=.035){
    if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(0,audioCtx.currentTime+when);g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+when+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.05);
  }
  function musicLoop(){if(!musicOn)return;[392,494,587,494,440,523,659,523].forEach((f,i)=>tone(f,.22,i*.23,.025));musicTimer=setTimeout(musicLoop,1900);}
  soundBtn.addEventListener('click',()=>{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();musicOn=!musicOn;soundBtn.setAttribute('aria-pressed',String(musicOn));soundBtn.textContent=musicOn?'♫':'♪';if(musicOn){audioCtx.resume();musicLoop();}else{clearTimeout(musicTimer);}
  });

  sheepData.forEach(createActor);startParade();requestAnimationFrame(tick);
  addEventListener('resize',()=>{if(parade)formation();});
})();
</script>
</body>
</html>
