<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8edff1">
<title>数字牧场｜步道</title>
<link rel="stylesheet" href="/pasture-live.css">
</head>
<body>
<iframe id="pastureCore" class="pasture-core" src="/tonglu-core.html" title="数字牧场"></iframe>
<canvas id="residentCanvas" class="resident-canvas" aria-hidden="true"></canvas>

<div id="residentToolbar" class="resident-toolbar" hidden aria-label="牧场功能">
  <button disabled>归回自己</button><button disabled>我的牧草</button><button disabled>风闻有你</button><button disabled>同路伙伴</button>
  <button disabled>信箱</button><button disabled>步道卡</button><button disabled>小匣</button>
</div>

<div id="residentLayer" class="resident-layer" hidden>
  <section class="resident-card" role="dialog" aria-modal="true" aria-labelledby="residentTitle">
    <div class="resident-mark" aria-hidden="true">♢</div>
    <h1 id="residentTitle">进入牧场</h1>
    <p id="residentCopy">留下一个可以找到你的邮箱。确认以后，你会进入羊群，并在牧场里认出自己。</p>
    <div id="residentBody"></div>
    <p id="residentError" class="resident-error" aria-live="polite"></p>
  </section>
</div>
<div id="residentToast" class="resident-toast" hidden></div>
<script src="/pasture-live.js"></script>
</body>
</html>
