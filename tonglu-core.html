<html lang="zh-CN">
<head>

<title>牧场 · 步道</title>

#pastureFrame{display:block;pointer-events:none;opacity:0}

<body>
<iframe id="pastureFrame" src="/tonglu-pasture-v20.html?v=20261005freeflock" title="牧场" tabindex="-1" aria-hidden="true"></iframe>
<iframe id="portraitFrame" title="牧场竖屏" tabindex="-1" aria-hidden="true"></iframe>
<canvas id="environmentLayer" width="480" height="300" aria-hidden="true"></canvas>
<script src="/pasture-stars.js"></script>
<script src="/pasture-sky-engine.js"></script>
<script>
(()=>{
const frame=document.getElementById('pastureFrame');
const portraitFrame=document.getElementById('portraitFrame');
const environmentLayer=document.getElementById('environmentLayer');
let pastureReady=false;
let portraitMode=false;

function sendPortraitEnvironment(){
  if(state&&portraitFrame.contentWindow){
    portraitFrame.contentWindow.postMessage({type:'tonglu-environment-v1',state:{...state,skyState}},location.origin);
  }
}
function flockDateKeyFromState(s){
  const tz=s?.location?.timezone||'Asia/Shanghai';
  try{
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const o=Object.fromEntries(p.map(x=>[x.type,x.value]));
    return o.year+'-'+o.month+'-'+o.day;
  }catch(e){return new Date().toISOString().slice(0,10)}
}
function sendLandscapeEnvironment(){
  if(!state||!frame.contentWindow)return;
  try{
    const dateKey=flockDateKeyFromState(state);
    frame.contentWindow.__tongluWeather={
      cloudCover:Number(state.current?.cloudCover)||0,
      weatherCode:Number(state.current?.weatherCode)||0
    };
    frame.contentWindow.__tongluFlockDateRequested=dateKey;
    if(typeof frame.contentWindow.setTongluFlockDate==='function'){
      frame.contentWindow.setTongluFlockDate(dateKey);
    }
    desktopLambCacheKey='';
  }catch(e){}
}
portraitFrame.addEventListener('load',sendPortraitEnvironment);

function syncComposition(){
  const nextPortrait=window.innerHeight>window.innerWidth*1.08;
  if(nextPortrait===portraitMode&&portraitFrame.dataset.initialized)return;
  portraitMode=nextPortrait;
  if(portraitMode){
    if(!portraitFrame.dataset.initialized){
      portraitFrame.src='/tonglu-pasture-portrait.html?v=20260924flock1';
      portraitFrame.dataset.initialized='1';
    }
    portraitFrame.style.display='block';
    frame.style.display='none';
    environmentLayer.style.display='none';
    sendPortraitEnvironment();
  }else{
    portraitFrame.style.display='none';
    frame.style.display='block';
    environmentLayer.style.display='block';
    draw();
  }
}
window.addEventListener('resize',syncComposition,{passive:true});
let pastureWatchTimer=null;
function revealPastureWhenReady(){
  clearInterval(pastureWatchTimer);
  let tries=0;
  pastureWatchTimer=setInterval(()=>{
    tries++;
    try{
      const d=frame.contentDocument;
      const pasture=d&&d.getElementById('pasture');
      if(pasture){
        let style=d.getElementById('prodPastureOnlyStyle');
        if(!style){
          style=d.createElement('style');
          style.id='prodPastureOnlyStyle';
          style.textContent='.stage>*:not(canvas),body>.hint,.focus-ui,.world-hit,.toast,.life-slip,button{display:none!important;pointer-events:none!important}';
          d.head.appendChild(style);
        }
        pasture.style.pointerEvents='none';
        frame.style.opacity='1';
        pastureReady=true;
        sendLandscapeEnvironment();
        draw();
        clearInterval(pastureWatchTimer);
        return;
      }
    }catch(e){}
    if(tries>=100){
      clearInterval(pastureWatchTimer);
      frame.style.opacity='0';
      setTimeout(()=>{
        frame.src='/tonglu-pasture-v20.html?v=20261005freeflock-'+Date.now();
      },800);
    }
  },100);
}
frame.addEventListener('load',revealPastureWhenReady);
revealPastureWhenReady();

const canvas=document.getElementById('environmentLayer');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
let state=null,skyState=null,tick=0;
let meteorNextAt=0,meteorEvent=null;
const LANDSCAPE_SKY_BOTTOM=96;

function rect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
}
function flockHash(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function flockRand(seed){
  return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
}
function lambScaleAtY(y){
  const t=Math.max(0,Math.min(1,(y-160)/126));
  return(.32+t*.84)*.56;
}
function drawDesktopLamb(x,y,s,flip=false,style='normal'){
  const bw=style==='blackwhite';
  const f=bw?'#eeeae2':'#f6ead7',h=bw?'#302d2a':'#b98f79';
  ctx.save();
  if(flip){ctx.translate(x+21*s,0);ctx.scale(-1,1);x=0}
  rect(x,y,16*s,8*s,f);rect(x+3*s,y-4*s,11*s,13*s,f);rect(x+6*s,y-6*s,7*s,15*s,f);
  if(bw){rect(x+3*s,y-2*s,5*s,5*s,'#4a4642');rect(x+9*s,y+2*s,5*s,4*s,'#4a4642')}
  rect(x+13*s,y+2*s,7*s,7*s,h);rect(x+19*s,y+4*s,2*s,3*s,h);
  rect(x+12*s,y+3*s,2*s,2*s,h);rect(x+17*s,y+4*s,1,1,'#564d47');
  rect(x+4*s,y+8*s,2*s,6*s,'#5d5851');rect(x+11*s,y+8*s,2*s,6*s,'#5d5851');
  ctx.restore();
}
function drawDesktopRestingLamb(x,y,s,flip=false,style='normal',phase=0){
  const bw=style==='blackwhite';
  const f=bw?'#eeeae2':'#f6ead7',h=bw?'#302d2a':'#b98f79';
  const breathe=Math.sin((tick+phase)/120)>.78?1*s:0;
  ctx.save();
  if(flip){ctx.translate(x+22*s,0);ctx.scale(-1,1);x=0}
  rect(x,y+3*s-breathe,17*s,7*s,f);rect(x+3*s,y-breathe,12*s,10*s,f);rect(x+7*s,y-2*s-breathe,8*s,12*s,f);
  if(bw){rect(x+3*s,y+2*s-breathe,5*s,4*s,'#4a4642');rect(x+10*s,y+5*s-breathe,4*s,3*s,'#4a4642')}
  rect(x+14*s,y+3*s-breathe,7*s,7*s,h);rect(x+20*s,y+5*s-breathe,2*s,3*s,h);
  rect(x+13*s,y+4*s-breathe,2*s,2*s,h);rect(x+18*s,y+5*s-breathe,1,1,'#564d47');
  rect(x+3*s,y+9*s,6*s,2*s,'#5d5851');rect(x+10*s,y+9*s,5*s,2*s,'#5d5851');
  ctx.restore();
}
function desktopCreatureBox(o,isLamb){
  const w=(isLamb?21:33)*o.s,h=(isLamb?20:27)*o.s;
  return{l:o.x-3*o.s,r:o.x+w,t:o.y-9*o.s,b:o.y+h};
}
function desktopBoxesOverlap(a,b,p=4){
  return !(a.r+p<b.l||a.l-p>b.r||a.b+p<b.t||a.t-p>b.b);
}
function desktopRiverConflict(o){
  const b=desktopCreatureBox(o,true),y=o.y;
  if(y<145)return false;
  let l=340,r=390;
  if(y>=190&&y<232){l=336;r=410}
  else if(y>=232){l=344;r=416}
  return b.r>l&&b.l<r;
}
function desktopForbidden(o){
  const b=desktopCreatureBox(o,true);
  if(desktopRiverConflict(o))return true;
  if(b.r>414&&b.l<448&&b.b>184&&b.t<220)return true;
  return false;
}
let desktopLambCacheKey='',desktopLambLayout=[];
function buildDesktopLambLayout(){
  const key=flockDateKeyFromState(state);
  const adultLayout=(()=>{
    try{return Array.isArray(frame.contentWindow.__tongluAdultLayout)?frame.contentWindow.__tongluAdultLayout:[]}catch(e){return[]}
  })();
  const adultSig=adultLayout.map(o=>Math.round(o.x)+','+Math.round(o.y)+','+Math.round(o.s*100)).join('|');
  const cacheKey=key+'|'+adultSig;
  if(cacheKey===desktopLambCacheKey&&desktopLambLayout.length===18)return desktopLambLayout;

  const rand=flockRand(flockHash('budao-free-lamb-'+key));
  const occupied=adultLayout.map(o=>desktopCreatureBox(o,false));
  const placed=[];
  const styles=Array(17).fill('normal').concat('blackwhite');

  for(let i=0;i<18;i++){
    let chosen=null;
    for(let t=0;t<180;t++){
      const y=160+rand()*126;
      const o={x:8+rand()*447,y,s:lambScaleAtY(y),flip:rand()<.5,style:styles[i]};
      if(desktopForbidden(o))continue;
      const box=desktopCreatureBox(o,true);
      if(occupied.some(b=>desktopBoxesOverlap(box,b,3)))continue;
      occupied.push(box);chosen=o;break;
    }
    if(!chosen){
      outer:for(let y=162;y<=284;y+=5){for(let x=10;x<=455;x+=9){
        const o={x,y,s:lambScaleAtY(y),flip:rand()<.5,style:styles[i]};
        const box=desktopCreatureBox(o,true);
        if(!desktopForbidden(o)&&!occupied.some(b=>desktopBoxesOverlap(box,b,2))){
          occupied.push(box);chosen=o;break outer;
        }
      }}
    }
    if(chosen)placed.push(chosen);
  }

  const restRand=flockRand(flockHash('budao-lamb-rest-'+key));
  const restTarget=1+(restRand()<.5?0:1);
  const restIds=[...Array(placed.length).keys()];
  for(let i=restIds.length-1;i>0;i--){
    const j=Math.floor(restRand()*(i+1));
    [restIds[i],restIds[j]]=[restIds[j],restIds[i]];
  }
  restIds.slice(0,restTarget).forEach(i=>{if(placed[i])placed[i].rest=true});

  desktopLambLayout=placed;
  desktopLambCacheKey=cacheKey;
  return placed;
}
function drawDesktopLambs(){
  const lambs=buildDesktopLambLayout();
  lambs.forEach((o,i)=>{
    const dx=!o.rest&&o.style==='blackwhite'?Math.sin((tick+i*41+173)/180)*1.25:0;
    const bob=!o.rest&&Math.sin((tick+i*41)/110)>.82?1:0;
    const x=o.x+dx,y=o.y-bob;
    rect(x-1.5*o.s,y+(o.rest?10:13)*o.s,21*o.s,2*o.s,'rgba(56,93,54,.15)');
    o.rest?drawDesktopRestingLamb(x,y,o.s,o.flip,o.style,i*41):drawDesktopLamb(x,y,o.s,o.flip,o.style);
  });
}
let returnTwigHover=false;
function drawReturnTwig(){
  const main=returnTwigHover?'#8b694b':'#795a40';
  const dark=returnTwigHover?'#7a5b42':'#6f543d';
  const light=returnTwigHover?'#b88b61':'#a67a55';
  rect(27,269,3,19,dark);
  rect(29,266,3,22,main);
  rect(30,263,2,7,main);
  rect(24,268,6,3,main);
  rect(20,266,6,3,main);
  rect(16,264,6,3,main);
  rect(13,262,5,3,dark);
  rect(12,261,3,2,dark);
  rect(12,265,3,2,dark);
  rect(18,264,8,1,light);
  rect(29,270,1,10,light);
  rect(26,288,3,1,'#4d9d3a');
  rect(30,289,4,1,'#4d9d3a');
}
function returnTwigHit(clientX,clientY){
  if(!pastureReady)return false;
  const r=canvas.getBoundingClientRect();
  const x=(clientX-r.left)/r.width*480;
  const y=(clientY-r.top)/r.height*300;
  return x>=8&&x<=39&&y>=254&&y<=297;
}
canvas.addEventListener('pointermove',e=>{
  const hover=returnTwigHit(e.clientX,e.clientY);
  if(hover!==returnTwigHover){
    returnTwigHover=hover;
    canvas.style.cursor=hover?'pointer':'default';
    draw();
  }
});
canvas.addEventListener('pointerleave',()=>{
  if(returnTwigHover){
    returnTwigHover=false;
    canvas.style.cursor='default';
    draw();
  }
});
canvas.addEventListener('click',e=>{
  if(returnTwigHit(e.clientX,e.clientY)) location.assign('/home.html');
});
function kind(code){
  code=Number(code)||0;
  if(code===45||code===48)return'fog';
  if((code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95&&code<=99))return'rain';
  if((code>=71&&code<=77)||(code>=85&&code<=86))return'snow';
  return'clear';
}
function effectiveCloudCover(){
  const c=state?.current||{},code=Number(c.weatherCode)||0;
  let cloud=Math.max(0,Math.min(100,Number(c.cloudCover)||0));
  const type=kind(code);
  if(type==='fog')cloud=Math.max(cloud,92);
  else if(type==='rain'||type==='snow')cloud=Math.max(cloud,88);
  else if(code===3)cloud=Math.max(cloud,85);
  else if(code===2)cloud=Math.max(cloud,55);
  else if(code===1)cloud=Math.max(cloud,25);
  return cloud;
}
function sunAlpha(code,cloud){
  code=Number(code)||0;cloud=Number(cloud)||0;
  const type=kind(code);
  if(type==='rain'||type==='snow'||type==='fog')return 0;
  if(code===3||cloud>=85)return 0;
  if(code===2||cloud>=65)return .28;
  if(code===1||cloud>=40)return .58;
  return 1;
}
function moon(cx,cy,phase,p,visual){
  const r=8,a=phase*Math.PI*2,side=Math.abs(Math.sin(a)),lz=-Math.cos(a);
  const lx=side*(p?.lightX||0),ly=side*(p?.lightY||0);
  const brightAlpha=Math.max(0,Math.min(1,Number.isFinite(Number(visual?.brightAlpha))?Number(visual.brightAlpha):1));
  const darkAlpha=Math.max(0,Math.min(1,Number.isFinite(Number(visual?.darkAlpha))?Number(visual.darkAlpha):1));
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    const nx=x/(r+.2),ny=y/(r+.2),rr=nx*nx+ny*ny;
    if(rr>1)continue;
    const nz=Math.sqrt(Math.max(0,1-rr));
    const lit=(nx*lx+ny*ly+nz*lz)>0,alpha=lit?brightAlpha:darkAlpha;
    if(alpha<=0)continue;
    rect(cx+x,cy+y,1,1,lit?'rgba(255,241,184,'+alpha+')':'rgba(82,97,123,'+alpha+')');
  }
}
function drawCelestial(now,cloud,c){
  const sky=window.BudaoPastureSky;
  if(!skyState||!sky)return;
  const project=o=>sky.projectHorizontal({
    altitudeDeg:o.altitudeDeg,azimuthDeg:o.azimuthDeg,centerAzimuthDeg:skyState.centerAzimuthDeg,
    width:480,skyTop:0,skyBottom:LANDSCAPE_SKY_BOTTOM
  });
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,480,LANDSCAPE_SKY_BOTTOM);ctx.clip();

  const sunXY=project(skyState.sun),sa=sunAlpha(c.weatherCode,cloud);
  if(sunXY&&sa>0){
    ctx.save();ctx.globalAlpha=sa;
    rect(sunXY.x-13,sunXY.y-13,26,26,'rgba(255,248,199,.72)');
    rect(sunXY.x-9,sunXY.y-9,18,18,'#fff1a0');
    ctx.restore();
  }

  for(const star of skyState.stars){
    if(!(star.visibility>0.015))continue;
    const p=project(star);if(!p)continue;
    const twinkle=sky.starTwinkle({visibility:star.visibility,altitudeDeg:star.altitudeDeg,visualMagnitude:star.visualMagnitude,timeMs:now,seed:star.twinkleSeed});
    const alpha=Math.max(0,Math.min(1,star.visibility*twinkle));
    if(alpha<=0.015)continue;
    const ci=Number(star.colorIndex),warm=Number.isFinite(ci)&&ci>0.65,cool=Number.isFinite(ci)&&ci<-.05;
    const col=warm?'#fff1c8':cool?'#e7f4ff':'#f5f7f2';
    ctx.save();ctx.globalAlpha=alpha;
    const size=star.magnitudeClass===0?2:1;
    rect(Math.round(p.x)-(size>1?1:0),Math.round(p.y),size,size,col);
    if(star.magnitudeClass===0&&alpha>.55){ctx.globalAlpha=alpha*.18;rect(Math.round(p.x)-2,Math.round(p.y),5,1,col)}
    ctx.restore();
  }

  const mf=sky.meteorFrame(meteorEvent,now);
  if(mf){
    const cloudOpacity=sky.cloudOpacityAt({xNorm:mf.x,yNorm:mf.y,cloudCover:cloud,weatherCode:c.weatherCode,timeMs:now});
    const visibility=sky.meteorVisibility({sunAltitudeDeg:skyState.sun.altitudeDeg,cloudOpacity,moon:skyState.moon});
    const alpha=mf.alpha*visibility;
    if(alpha>.02){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#f7fbff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mf.tailX*480,mf.tailY*LANDSCAPE_SKY_BOTTOM);ctx.lineTo(mf.x*480,mf.y*LANDSCAPE_SKY_BOTTOM);ctx.stroke();rect(mf.x*480,mf.y*LANDSCAPE_SKY_BOTTOM,1,1,'#ffffff');ctx.restore()}
  }

  const moonXY=sky.projectDiscHorizontal({altitudeDeg:skyState.moon.altitudeDeg,azimuthDeg:skyState.moon.azimuthDeg,centerAzimuthDeg:skyState.centerAzimuthDeg,width:480,skyTop:0,skyBottom:LANDSCAPE_SKY_BOTTOM,radiusPx:8});
  if(moonXY){const mv=sky.moonVisualProfile(skyState.sun.altitudeDeg);moon(Math.round(moonXY.x),Math.round(moonXY.y),Number(skyState.moon.phase)||0,skyState.moon,mv)}
  ctx.restore();
}
function updateMeteor(now){
  const sky=window.BudaoPastureSky;
  if(!sky||!skyState)return;
  if(!meteorNextAt)meteorNextAt=now+sky.meteorDelayMs(Math.random());
  if(!meteorEvent&&now>=meteorNextAt){
    if(Number(skyState.sun?.altitudeDeg)<=-9){
      meteorEvent=sky.createMeteorEvent({triggerMs:now,random:Math.random});
      if(state){state.meteorEvent=meteorEvent;sendPortraitEnvironment()}
    }
    meteorNextAt=now+sky.meteorDelayMs(Math.random());
  }
  if(meteorEvent&&now>meteorEvent.triggerMs+meteorEvent.durationMs){
    meteorEvent=null;
    if(state&&state.meteorEvent){delete state.meteorEvent;sendPortraitEnvironment()}
  }
}
function refreshSkyState(){
  const sky=window.BudaoPastureSky,stars=window.BudaoPastureStars;
  if(!state||!sky||!Array.isArray(stars)||!state.location)return;
  skyState=sky.computeSkyState({
    timeMs:Date.now(),latitude:Number(state.location.latitude),longitude:Number(state.location.longitude),
    cloudCover:Number(state.current?.cloudCover)||0,weatherCode:Number(state.current?.weatherCode)||0,stars
  });
  sendPortraitEnvironment();
  draw();
}
function weatherFx(type,cloud){
  if(type==='fog'){
    ctx.save();ctx.globalAlpha=.18;
    for(let i=0;i<5;i++){const x=((i*117+tick*2)%600)-100;rect(x,93+i*16,150,5,'#fff')}
    ctx.restore();
  }
  if(type==='rain'){
    const n=Math.round(32+Math.min(42,cloud/2));
    ctx.save();ctx.globalAlpha=.48;
    for(let i=0;i<n;i++){const x=(i*71+tick*7)%480,y=(i*43+tick*11)%300;rect(x,y,1,3,i%4===0?'#dff7ff':'#b9def1')}
    ctx.restore();
  }
  if(type==='snow'){
    const n=Math.round(36+Math.min(30,cloud/3));
    ctx.save();ctx.globalAlpha=.8;
    for(let i=0;i<n;i++){const x=(i*83+tick*(i%3+1))%480,y=(i*37+tick*3)%300;rect(x,y,i%7===0?2:1,i%7===0?2:1,'#f5fbff')}
    ctx.restore();
  }
}
function draw(){
  tick++;
  ctx.clearRect(0,0,480,300);
  if(pastureReady){drawDesktopLambs();drawReturnTwig();}
  if(!state)return;
  const now=Date.now(),a=state.astronomy,c=state.current;
  const sunrise=+a.sunriseToday||0,sunset=+a.sunsetToday||0,prev=+a.sunsetYesterday||0,next=+a.sunriseTomorrow||0;
  const day=sunrise&&sunset&&now>=sunrise&&now<=sunset;
  let darkness=0,progress=.5;
  if(day){
    progress=Math.max(0,Math.min(1,(now-sunrise)/(sunset-sunrise)));
    const edge=Math.min(progress,1-progress);
    if(edge<.12){ctx.fillStyle='rgba(244,177,112,'+((.12-edge)*.75)+')';ctx.fillRect(0,0,480,300)}
  }else{
    let ns,ne;
    if(now<sunrise){ns=prev;ne=sunrise}else{ns=sunset;ne=next}
    if(ns&&ne&&ne>ns){
      progress=Math.max(0,Math.min(1,(now-ns)/(ne-ns)));
      const edge=Math.min(progress,1-progress);
      darkness=Math.max(.20,Math.min(.62,.62*(edge/.22)));
    }else darkness=.52;
    ctx.fillStyle='rgba(18,34,70,'+darkness+')';ctx.fillRect(0,0,480,300);
  }
  const cloud=effectiveCloudCover();
  updateMeteor(now);
  drawCelestial(now,cloud,c);
  weatherFx(kind(c.weatherCode),cloud);
}
function build(raw,lat,lon,source){
  const offset=Number(raw.utc_offset_seconds||0);
  const epoch=v=>{if(!v)return null;const t=Date.parse(v+'Z');return Number.isFinite(t)?t-offset*1000:null};
  const rise=raw.daily?.sunrise||[],set=raw.daily?.sunset||[];
  const now=Date.now(),syn=29.53058867,known=Date.UTC(2000,0,6,18,14,0);
  const phase=((((now-known)/86400000)/syn)%1+1)%1;
  return{location:{latitude:lat,longitude:lon,timezone:raw.timezone||'UTC'},current:{
    weatherCode:raw.current?.weather_code??0,cloudCover:raw.current?.cloud_cover??0,
    windKmh:raw.current?.wind_speed_10m??0
  },astronomy:{
    sunsetYesterday:epoch(set[0]),sunriseToday:epoch(rise[1]),sunsetToday:epoch(set[1]),
    sunriseTomorrow:epoch(rise[2]),moonPhase:phase
  },source};
}
async function weatherAt(lat,lon,source){
  const u=new URL('https://api.open-meteo.com/v1/forecast');
  u.searchParams.set('latitude',String(lat));u.searchParams.set('longitude',String(lon));
  u.searchParams.set('current','weather_code,cloud_cover,wind_speed_10m,is_day');
  u.searchParams.set('daily','sunrise,sunset');u.searchParams.set('timezone','auto');
  u.searchParams.set('past_days','1');u.searchParams.set('forecast_days','2');
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('weather');
  state=build(await r.json(),lat,lon,source);
  sendLandscapeEnvironment();
  refreshSkyState();
}
const LOCATION_KEY='budao:pasture-location:v1';
const LOCATION_MAX_AGE=24*60*60*1000;
function validLocation(v){
  return v&&Number.isFinite(+v.latitude)&&Number.isFinite(+v.longitude)&&Math.abs(+v.latitude)<=90&&Math.abs(+v.longitude)<=180;
}
function readSavedLocation(){
  try{
    const v=JSON.parse(localStorage.getItem(LOCATION_KEY)||'null');
    if(!validLocation(v)||!Number.isFinite(+v.savedAt)||Date.now()-Number(v.savedAt)>LOCATION_MAX_AGE)return null;
    return{latitude:+v.latitude,longitude:+v.longitude,accuracy:Number(v.accuracy)||null};
  }catch(e){return null}
}
function saveLocation(pos){
  try{
    localStorage.setItem(LOCATION_KEY,JSON.stringify({latitude:+pos.latitude,longitude:+pos.longitude,accuracy:Number(pos.accuracy)||null,savedAt:Date.now()}));
  }catch(e){}
}
async function getDeviceLocation(){
  if(!navigator.geolocation)return null;
  if(navigator.permissions){
    try{
      const p=await navigator.permissions.query({name:'geolocation'});
      if(p.state==='denied')return null;
    }catch(e){}
  }
  return await new Promise(resolve=>{
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy}),
      ()=>resolve(null),
      {maximumAge:300000,timeout:6000,enableHighAccuracy:true}
    );
  });
}
async function refresh(){
  const device=await getDeviceLocation();
  if(validLocation(device)){
    saveLocation(device);
    try{await weatherAt(device.latitude,device.longitude,'device');return}catch(e){}
  }
  const saved=readSavedLocation();
  if(validLocation(saved)){
    try{await weatherAt(saved.latitude,saved.longitude,'saved');return}catch(e){}
  }
  try{await weatherAt(39.9042,116.4074,'fallback')}catch(_){}
}
syncComposition();
refresh();
setInterval(refresh,600000);
setInterval(refreshSkyState,45000);
setInterval(()=>{if(!portraitMode)draw()},120);
})();
</script>
