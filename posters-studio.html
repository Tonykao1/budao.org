<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>步道 · 四套海报</title><meta name="description" content="步道活动海报系统：逐梦动势、希望之径、色彩引爆、光学预告。每条路线绑定自己的原图、报名二维码和活动资料。">
<style>
:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#e9edf0;color:#16212d}
*{box-sizing:border-box}body{margin:0}header{background:#111923;color:#f8fbfc;padding:29px max(22px,calc((100% - 1480px)/2)) 33px}header small{display:block;color:#92aabd;letter-spacing:.22em;font-size:11px}
header h1{font-size:clamp(27px,3.5vw,45px);font-weight:460;margin:10px 0 7px;letter-spacing:.015em}header p{color:#b8c5d0;margin:0;font-size:13px;line-height:1.75}
main{max-width:1530px;padding:23px 22px 55px;margin:auto}.toolbar{display:flex;align-items:end;gap:15px;flex-wrap:wrap;background:white;border:1px solid #d6dce3;padding:19px;border-radius:11px}
.route-picker{flex:1;min-width:250px}.route-picker label{display:block;font-size:12px;color:#637387;margin-bottom:8px}select{width:100%;padding:12px;border:1px solid #bcc7d0;border-radius:6px;font-size:14px;background:#fafcfe;color:#1a2632}
button,.action{font-size:13px;font-weight:600;border:1px solid #c8d1dd;border-radius:6px;background:#f7f9fc;color:#233244;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}
button:hover,.action:hover{background:#eaf0f6}button:focus-visible,select:focus-visible,.action:focus-visible{outline:2px solid #637e9e;outline-offset:3px}
button.primary{color:#fff;background:#1a2e45;border-color:#1a2e45}button.primary:hover{background:#29415b}
button:disabled{opacity:.5;cursor:not-allowed}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:18px 0}
.tile{display:block;text-align:left;padding:17px 17px 16px;background:white;border:1px solid #d4dce4;border-radius:9px;min-height:102px}
.tile[aria-pressed=true]{border:2px solid #284966;background:#e7edf4;padding:16px 16px 15px}
.tile b{display:block;font-size:17px;font-weight:580;margin-bottom:5px;color:#192b3c}
.tile small{font-size:11px;font-weight:400;line-height:1.6;color:#617082}
.preview-box{background:#fff;padding:12px;border-radius:9px;box-shadow:0 8px 32px #263b5013}
.preview-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px 15px;flex-wrap:wrap}
.preview-title b{font-size:13px}.preview-title span{font-size:12px;color:#6d7a8a}
iframe{display:block;width:100%;min-height:1100px;height:calc(100vh + 200px);max-height:1720px;border:1px solid #e0e7ef;border-radius:4px;background:#f0f2f5}
#status{color:#516275;font-size:12px;line-height:1.8;min-height:24px;margin:13px 3px}
aside{margin-top:17px;font-size:12px;line-height:1.9;color:#667588}
footer{margin-top:26px;text-align:center;color:#8794a3;font-size:11px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}iframe{min-height:850px}}@media(max-width:540px){main{padding:13px 10px}.tiles{gap:7px}.tile{padding:12px;min-height:104px}.tile b{font-size:15px}iframe{height:1100px}.toolbar{padding:13px}}
</style></head>
<body>
<header><small>BUDAO · FOUR POSTERS / TENT INVITATION</small><h1>四种表达，同一程同行。</h1>
<p>选择已发布的步道活动，再选择海报风格。标题、时间、地点、照片及二维码全部来自所选路线；图片在你的浏览器中完成绘制，不调用 AI 图像服务。</p></header>
<main>
<section class="toolbar">
<div class="route-picker"><label for="route">要制作哪一程的海报？</label>
<select id="route" aria-label="选择已发布活动"><option value="">正在读取步道活动…</option></select></div>
<button class="primary" id="download" disabled>导出当前海报 PNG</button>
<a class="action" id="external" href="#" target="_blank" rel="noopener">单独打开</a>
</section>
<nav class="tiles" role="group" aria-label="四套已审定的海报视觉风格">
<button class="tile" type="button" data-style="1" aria-pressed="true"><b>01 · 逐梦·动势</b><small>V9 动势构图 · 八套自适应配色</small></button>
<button class="tile" type="button" data-style="2" aria-pressed="false"><b>02 · 希望之径</b><small>禧年足迹 · 四种配色 · 三种字体</small></button>
<button class="tile" type="button" data-style="3" aria-pressed="false"><b>03 · 色彩引爆</b><small>Apple 式轻文字 · 原图取色与圆润滴溅</small></button>
<button class="tile" type="button" data-style="4" aria-pressed="false"><b>04 · 光学预告</b><small>SONY 式纵深光场 · 光束聚合处报名</small></button>
</nav>
<section class="preview-box"><div class="preview-title"><b id="selectedStyle">01 · 逐梦·动势</b><span>保留各套原有字体、配色与取景控制</span></div>
<iframe id="poster" title="活动海报可调预览" loading="eager" referrerpolicy="same-origin"></iframe></section>
<p id="status" role="status" aria-live="polite"></p>
<aside>报名二维码直接使用当前活动的原始文件，不生成替代二维码。如果活动未提供照片、二维码或必需的时间地点，系统会阻止导出并明确提示。已结束的活动可以作为历史设计参考，不代表仍开放报名；发布前请在手机上核实扫码可用性。</aside>
<footer>BUDAO · 余生行走，不偏左右 · budao.org</footer>
</main>
<script src="/posters-runtime.js"></script>
<script>
(function(){
"use strict";
const runtime=window.BudaoPosterRuntime;
const names={1:"逐梦·动势",2:"希望之径",3:"色彩引爆",4:"光学预告"};
const filenames={1:"template-01.html",2:"template-02.html",3:"template-03.html",4:"template-04.html"};
const $=id=>document.getElementById(id);
let selected="1",routeId="",loadIndex=0,available=[];
const params=new URLSearchParams(location.search);
if(/^[1-4]$/.test(params.get("style")||""))selected=params.get("style");
function explain(s){$("status").textContent=s}
function update(){
const buttons=document.querySelectorAll("[data-style]");
buttons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.style===selected)));
$("selectedStyle").textContent="0"+selected+" · "+names[selected];
if(!routeId){$("poster").removeAttribute("src");$("download").disabled=true;return;}
const src="/posters/"+filenames[selected]+"?route="+encodeURIComponent(routeId);
$("poster").src=src;
$("external").href=src;
$("download").disabled=true;
const u=new URL(location.href);u.searchParams.set("route",routeId);u.searchParams.set("style",selected);
history.replaceState(null,"",u.pathname+u.search);
explain("正在准备 "+names[selected]+" 海报。请在下方预览中调整字体、色彩或光场，再导出。");
loadIndex++;
}
function findCurrent(){
try{
const doc=$("poster").contentDocument;
const button=doc?.getElementById("download")||doc?.getElementById("export");
return button&&!button.disabled?button:null;
}catch(error){return null;}
}
for(const button of document.querySelectorAll("[data-style]"))button.addEventListener("click",()=>{
selected=button.dataset.style;update();
});
$("route").addEventListener("change",()=>{routeId=$("route").value;update();});
$("poster").addEventListener("load",()=>{
if(!routeId)return;
const own=++loadIndex;
const poll=()=>{
 if(own!==loadIndex)return;
 const btn=findCurrent();
 if(btn){$("download").disabled=false;explain("海报绘制完成。可点击“导出当前海报 PNG”，或在模板内直接导出。");return;}
 const info=$("poster").contentDocument?.getElementById("status")?.textContent||"";
 if(/✕|失败|禁止导出/.test(info)){explain(info);return;}
 window.setTimeout(poll,650);
};
poll();
});
$("download").addEventListener("click",()=>{
const btn=findCurrent();
if(!btn){explain("海报还没有完成，或当前活动资料不足以生成海报。");return;}
btn.click();
});
(async function(){
try{
const data=await runtime.routes();
available=data.filter(r=>r&&r.title&&(r.routeId||r.id));
available.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
const picker=$("route");
picker.replaceChildren();
const hint=document.createElement("option");hint.value="";hint.textContent="请选择一条已发布路线";picker.append(hint);
for(const route of available.slice(0,130)){
const option=document.createElement("option");
option.value=String(route.routeId||route.id);
option.textContent=String(route.date||"") +" · "+String(route.title||"未命名")+" · "+String(route.city||"");
picker.append(option);
}
const requested=params.get("route")||"";
if(available.some(r=>String(r.routeId||r.id)===requested)){
 routeId=requested;picker.value=requested;
}else if(available.length){
 routeId=String(available[0].routeId||available[0].id);
 picker.value=routeId;
}
update();
}catch(error){explain("活动加载失败："+String(error.message||error));$("route").innerHTML='<option value="">暂时无法读取活动，请刷新重试</option>';}
})();
})();
</script></body></html>
