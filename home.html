    }

    }
  </style>

<script>
const playlist = [
  "music/14 Silent Night.mp3",
  "music/06 The Good, The Bad, And The Ugly.mp3",
  "music/19 Shalom Chaverim.mp3",
  "music/Dreaming.mp3",
  "music/07 Barrios Mangoré_ Un Sueño En La Floresta.mp3",
  "music/08 Imagine.mp3",
  "music/08 xindeshijie.mp3",
  "music/02 Amarantine.mp3",
  "music/10 Si Quieres Que Te Cortexe.mp3",
  "music/07 Victory Is Won.mp3",
  "music/12 Silent Night_Klusa Nakts.mp3",
  "music/01 Suerte (Whenever, Wherever).mp3",
  "music/02 La Vie En Rose.mp3",
  "music/2-08 Blaze Of Glory.mp3",
  "music/04 Stofnar Falla.mp3"
];

const silentNightStartTracks = [0, 10];
const REFERENCE_B_URL = "music/music.json";
let currentTrack = 0;

/*
 * 余 DSP Reference B 的响度数据来自对仓库原始 MP3 的离线实测：
 * ITU-R BS.1770 / EBU R128，目标 -20 LUFS，前 EQ True Peak 上限 -1.5 dBTP。
 * 页面启动时只预取 JSON，不创建 AudioContext，因此不会破坏默认锁屏播放。
 */
let referenceBTracks = {};
let referenceBPromise = null;

function loadReferenceBMap() {
  if (referenceBPromise) return referenceBPromise;

  referenceBPromise = fetch(REFERENCE_B_URL, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error(`Reference B map HTTP ${response.status}`);
      return response.json();
    })
    .then((data) => {
      if (!data || data.system !== "余 DSP Reference B" || !data.tracks) {
        throw new Error("Invalid Reference B loudness map");
      }
      referenceBTracks = data.tracks;
      applyCurrentTrackGain(true);
      return data;
    })
    .catch((error) => {
      console.warn("Reference B loudness map unavailable; using 0 dB track gain", error);
      referenceBTracks = {};
      return null;
    });

  return referenceBPromise;
}

/* 预取测量数据，但绝不因预取而启动 Web Audio。 */
loadReferenceBMap();

/*
 * 重要：音乐播放声明为 playback。
 * iOS/Safari 在锁屏或进入后台时会区别对待 ambient Web Audio 与真正的媒体播放。
 * 不支持 Audio Session API 的浏览器会安全忽略这一段。
 */
function configureAudioSessionForPlayback() {
  if (!("audioSession" in navigator)) return;
  try {
    navigator.audioSession.type = "playback";
  } catch (error) {
    console.debug("AudioSession playback mode unavailable", error);
  }
}

configureAudioSessionForPlayback();

const audio = new Audio(playlist[currentTrack]);
audio.preload = "metadata";

if ("mediaSession" in navigator && "MediaMetadata" in window) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: "同行之声",
    artist: "余生行走，不偏左右",
    album: "步道 budao.org",
    artwork: [{
      src: "https://budao.org/images/MEDIA.jpeg",
      sizes: "1024x1024",
      type: "image/jpeg"
    }]
  });
}

const dspBtn = document.getElementById("dspBtn");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

let isPlaying = false;
let hasStartedPlayback = false;
let dspEnabled = false;
let audioContext = null;
let sourceNode = null;
let bypassGain = null;
let trackGain = null;
let dspGain = null;

function dbToLinear(db) {
  return Math.pow(10, db / 20);
}

function getCurrentTrackGainDb() {
  const measurement = referenceBTracks[playlist[currentTrack]];
  const gainDb = measurement ? Number(measurement.gain_db) : 0;
  return Number.isFinite(gainDb) ? gainDb : 0;
}

function applyCurrentTrackGain(immediate = false) {
  if (!audioContext || !trackGain) return;

  const target = dbToLinear(getCurrentTrackGainDb());
  const now = audioContext.currentTime;

  trackGain.gain.cancelScheduledValues(now);
  if (immediate) {
    trackGain.gain.setValueAtTime(target, now);
    return;
  }

  trackGain.gain.setValueAtTime(trackGain.gain.value, now);
  trackGain.gain.linearRampToValueAtTime(target, now + 0.035);
}

/*
 * “余” DSP Reference B — Playback Mastering System
 *
 * 1. 每首独立静态响度增益：目标 -20 LUFS；不压缩、不改变 LRA。
 * 2. 高动态曲若达到 True Peak 安全边界，则宁可略低于目标，也不削峰。
 * 3. 极轻的步道 Playback Curve：只建立播放系统气质，不重做原母带。
 * 4. 无统一 compressor、无伪 true-peak limiter、无 stereo widening、无假环绕。
 *
 * DSP 引擎仍只在用户主动点击“余”后创建。
 * 默认播放保持原生 HTMLMediaElement 通道，以保留移动端锁屏/后台播放能力。
 */
function initAudioEngine() {
  if (audioContext) return;

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  configureAudioSessionForPlayback();

  audioContext = new AudioContextClass();
  sourceNode = audioContext.createMediaElementSource(audio);

  bypassGain = audioContext.createGain();
  trackGain = audioContext.createGain();
  dspGain = audioContext.createGain();

  const hpf = audioContext.createBiquadFilter();
  hpf.type = "highpass";
  hpf.frequency.value = 20;
  hpf.Q.value = 0.707;

  const lowShelf = audioContext.createBiquadFilter();
  lowShelf.type = "lowshelf";
  lowShelf.frequency.value = 95;
  lowShelf.gain.value = 0.45;

  const presence = audioContext.createBiquadFilter();
  presence.type = "peaking";
  presence.frequency.value = 2800;
  presence.Q.value = 0.70;
  presence.gain.value = -0.40;

  const air = audioContext.createBiquadFilter();
  air.type = "highshelf";
  air.frequency.value = 11000;
  air.gain.value = 0.25;

  /* 原始母带旁路 */
  sourceNode.connect(bypassGain);
  bypassGain.connect(audioContext.destination);

  /* Reference B：静态响度匹配 → Playback Curve → 输出 */
  sourceNode
    .connect(trackGain)
    .connect(hpf)
    .connect(lowShelf)
    .connect(presence)
    .connect(air)
    .connect(dspGain)
    .connect(audioContext.destination);

  applyCurrentTrackGain(true);
  bypassGain.gain.value = dspEnabled ? 0 : 1;
  dspGain.gain.value = dspEnabled ? 1 : 0;
}

async function ensureAudioEngineReady() {
  initAudioEngine();
  if (audioContext && (audioContext.state === "suspended" || audioContext.state === "interrupted")) {
    try {
      await audioContext.resume();
    } catch (error) {
      console.debug("AudioContext resume deferred", error);
    }
  }
}

function applyDspState() {
  dspBtn.classList.toggle("dsp-on", dspEnabled);
  dspBtn.setAttribute("aria-pressed", String(dspEnabled));

  if (!audioContext || !bypassGain || !dspGain) return;

  if (dspEnabled) applyCurrentTrackGain(true);

  const now = audioContext.currentTime;
  const fade = 0.025;

  bypassGain.gain.cancelScheduledValues(now);
  dspGain.gain.cancelScheduledValues(now);
  bypassGain.gain.setValueAtTime(bypassGain.gain.value, now);
  dspGain.gain.setValueAtTime(dspGain.gain.value, now);
  bypassGain.gain.linearRampToValueAtTime(dspEnabled ? 0 : 1, now + fade);
  dspGain.gain.linearRampToValueAtTime(dspEnabled ? 1 : 0, now + fade);
}

async function toggleDsp() {
  await loadReferenceBMap();
  await ensureAudioEngineReady();
  dspEnabled = !dspEnabled;
  applyDspState();
}

dspBtn.addEventListener("click", toggleDsp);
dspBtn.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleDsp();
  }
});

function syncPlaybackUi() {
  isPlaying = !audio.paused && !audio.ended;
  playBtn.classList.toggle("playing", isPlaying);

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
    } catch (error) {
      console.debug("MediaSession playback state unavailable", error);
    }
  }
}

audio.addEventListener("play", syncPlaybackUi);
audio.addEventListener("pause", syncPlaybackUi);

/* 播放当前曲目。
 * 默认不创建 AudioContext：未启用 DSP 时始终走原生媒体通道。 */
async function playCurrentTrack() {
  hasStartedPlayback = true;

  if (audioContext) {
    await ensureAudioEngineReady();
    applyCurrentTrackGain(true);
  }

  audio.src = playlist[currentTrack];
  audio.load();
  await audio.play();
}

async function resumeCurrentTrack() {
  if (audioContext) {
    await ensureAudioEngineReady();
    applyCurrentTrackGain(true);
  }
  await audio.play();
}

/* 点击“走” */
playBtn.addEventListener("click", async () => {
  if (!isPlaying) {
    if (!hasStartedPlayback) {
      currentTrack = silentNightStartTracks[
        Math.floor(Math.random() * silentNightStartTracks.length)
      ];
      await playCurrentTrack();
    } else {
      await resumeCurrentTrack();
    }
  } else {
    audio.pause();
  }
});

/* 点击“右” */
nextBtn.addEventListener("click", async () => {
  currentTrack++;
  if (currentTrack >= playlist.length) currentTrack = 0;
  await playCurrentTrack();
});

/* 点击“左” */
prevBtn.addEventListener("click", async () => {
  currentTrack--;
  if (currentTrack < 0) currentTrack = playlist.length - 1;
  await playCurrentTrack();
});

/* 一首结束后自动下一首 */
audio.addEventListener("ended", async () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  await playCurrentTrack();
});

/* 锁屏/后台返回后，若系统曾中断 Web Audio，前台恢复时重新激活。 */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && audioContext && !audio.paused && audioContext.state !== "running") {
    ensureAudioEngineReady();
  }
});

/* 让系统锁屏媒体控件和网页播放器共用同一套状态。 */
if ("mediaSession" in navigator) {
  const setMediaAction = (action, handler) => {
    try {
      navigator.mediaSession.setActionHandler(action, handler);
    } catch (error) {
      console.debug(`MediaSession action ${action} unavailable`, error);
    }
  };

  setMediaAction("play", async () => {
    await resumeCurrentTrack();
  });

  setMediaAction("pause", () => {
    audio.pause();
  });

  setMediaAction("nexttrack", async () => {
    currentTrack = (currentTrack + 1) % playlist.length;
    await playCurrentTrack();
  });

  setMediaAction("previoustrack", async () => {
    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
    await playCurrentTrack();
  });
}
</script>
</body>
</html>
