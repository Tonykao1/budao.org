<script>
const playlist = [
  "music/14 Silent Night.mp3",
  "music/06 The Good, The Bad, And The Ugly.mp3",
  "music/19 Shalom Chaverim.mp3",
  "music/Dreaming.mp3",
  "music/07 Barrios Mangoré_ Un Sueño En La Floresta.mp3",
  "music/08 Imagine.mp3",
  "music/08 xindeshijie.mp3",
  "music/02 Amarantine.mp3",
  "music/10 Si Quieres Que Te Cortexe.mp3",
  "music/07 Victory Is Won.mp3",
  "music/12 Silent Night_Klusa Nakts.mp3",
  "music/01 Suerte (Whenever, Wherever).mp3",
  "music/02 La Vie En Rose.mp3",
  "music/2-08 Blaze Of Glory.mp3",
  "music/04 Stofnar Falla.mp3",
  "music/06 You Shouldn't Kiss Me Like This.mp3"
];

const silentNightStartTracks = [0, 10];
const REFERENCE_B_URL = "music/music.json";
let currentTrack = 0;

/*
 * 余 DSP Reference B 的响度数据来自对仓库原始 MP3 的离线实测：
 * ITU-R BS.1770 / EBU R128，目标 -20 LUFS，前 EQ True Peak 上限 -1.5 dBTP。
 * 页面启动时只预取 JSON，不创建 AudioContext，因此不会破坏默认锁屏播放。
 */
let referenceBTracks = {};
let referenceBPromise = null;

function loadReferenceBMap() {
  if (referenceBPromise) return referenceBPromise;

  referenceBPromise = fetch(REFERENCE_B_URL, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error(`Reference B map HTTP ${response.status}`);
      return response.json();
    })
    .then((data) => {
      if (!data || data.system !== "余 DSP Reference B" || !data.tracks) {
        throw new Error("Invalid Reference B loudness map");
      }
      referenceBTracks = data.tracks;
      applyCurrentTrackGain(true);
      return data;
    })
    .catch((error) => {
      console.warn("Reference B loudness map unavailable; using 0 dB track gain", error);
      referenceBTracks = {};
      return null;
    });

  return referenceBPromise;
}

/* 预取测量数据，但绝不因预取而启动 Web Audio。 */
loadReferenceBMap();

/*
 * Safari/WebKit 的 MediaElementSource 在硬件输出采样率切换时曾出现
 * 44.1/48 kHz 时钟错配，从而让音乐整体变速、变调。
 * iOS/iPadOS 仍需要 playback AudioSession 来支持锁屏；macOS Safari 不主动改
 * AudioSession，避免在 Web Audio 已运行时触发不必要的音频会话重配置。
 */
function isIOSFamily() {
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}

function isSafariWebKit() {
  const ua = navigator.userAgent || "";
  return /AppleWebKit/.test(ua) && /Safari/.test(ua) &&
    !/CriOS|Chrome|Chromium|Edg|EdgiOS|FxiOS|OPiOS/.test(ua);
}

function configureAudioSessionForPlayback() {
  if (!isIOSFamily() || !("audioSession" in navigator)) return;
  try {
    navigator.audioSession.type = "playback";
  } catch (error) {
    console.debug("AudioSession playback mode unavailable", error);
  }
}

configureAudioSessionForPlayback();

function createAudioElement(src) {
  const element = new Audio(src);
  element.preload = "metadata";
  element.defaultPlaybackRate = 1;
  element.playbackRate = 1;
  if ("preservesPitch" in element) element.preservesPitch = true;
  if ("webkitPreservesPitch" in element) element.webkitPreservesPitch = true;
  return element;
}

let audio = createAudioElement(playlist[currentTrack]);

if ("mediaSession" in navigator && "MediaMetadata" in window) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: "同行之声",
    artist: "余生行走，不偏左右",
    album: "步道 budao.org",
    artwork: [{
      src: "https://budao.org/images/MEDIA.jpeg",
      sizes: "1024x1024",
      type: "image/jpeg"
    }]
  });
}

const dspBtn = document.getElementById("dspBtn");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

let isPlaying = false;
let hasStartedPlayback = false;
let dspEnabled = false;
let audioContext = null;
let sourceNode = null;
let bypassGain = null;
let trackGain = null;
let dspGain = null;
let audioPipelineRecoveryPromise = null;
let audioRecoveryTimer = null;
let clockProbeContextTime = null;
let clockProbeWallTime = null;

function dbToLinear(db) {
  return Math.pow(10, db / 20);
}

function getCurrentTrackGainDb() {
  const measurement = referenceBTracks[playlist[currentTrack]];
  const gainDb = measurement ? Number(measurement.gain_db) : 0;
  return Number.isFinite(gainDb) ? gainDb : 0;
}

function applyCurrentTrackGain(immediate = false) {
  if (!audioContext || !trackGain) return;

  const target = dbToLinear(getCurrentTrackGainDb());
  const now = audioContext.currentTime;

  trackGain.gain.cancelScheduledValues(now);
  if (immediate) {
    trackGain.gain.setValueAtTime(target, now);
    return;
  }

  trackGain.gain.setValueAtTime(trackGain.gain.value, now);
  trackGain.gain.linearRampToValueAtTime(target, now + 0.035);
}

function createPlaybackAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;

  try {
    return new AudioContextClass({ latencyHint: "playback" });
  } catch (error) {
    try {
      return new AudioContextClass();
    } catch (fallbackError) {
      console.debug("AudioContext unavailable", fallbackError);
      return null;
    }
  }
}

function resetClockProbe() {
  clockProbeContextTime = audioContext ? audioContext.currentTime : null;
  clockProbeWallTime = performance.now();
}

/*
 * “余” DSP Reference B — Playback Mastering System
 *
 * 1. 每首独立静态响度增益：目标 -20 LUFS；不压缩、不改变 LRA。
 * 2. 高动态曲若达到 True Peak 安全边界，则宁可略低于目标，也不削峰。
 * 3. 极轻的步道 Playback Curve：只建立播放系统气质，不重做原母带。
 * 4. 无统一 compressor、无伪 true-peak limiter、无 stereo widening、无假环绕。
 *
 * DSP 引擎仍只在用户主动点击“余”后创建。
 * 默认播放保持原生 HTMLMediaElement 通道，以保留移动端锁屏/后台播放能力。
 */
function initAudioEngine() {
  if (audioContext) return;

  configureAudioSessionForPlayback();

  audioContext = createPlaybackAudioContext();
  if (!audioContext) return;

  try {
    sourceNode = audioContext.createMediaElementSource(audio);
  } catch (error) {
    console.warn("Unable to attach music to Web Audio", error);
    audioContext.close().catch(() => {});
    audioContext = null;
    sourceNode = null;
    return;
  }

  bypassGain = audioContext.createGain();
  trackGain = audioContext.createGain();
  dspGain = audioContext.createGain();

  const hpf = audioContext.createBiquadFilter();
  hpf.type = "highpass";
  hpf.frequency.value = 20;
  hpf.Q.value = 0.707;

  const lowShelf = audioContext.createBiquadFilter();
  lowShelf.type = "lowshelf";
  lowShelf.frequency.value = 95;
  lowShelf.gain.value = 0.45;

  const presence = audioContext.createBiquadFilter();
  presence.type = "peaking";
  presence.frequency.value = 2800;
  presence.Q.value = 0.70;
  presence.gain.value = -0.40;

  const air = audioContext.createBiquadFilter();
  air.type = "highshelf";
  air.frequency.value = 11000;
  air.gain.value = 0.25;

  /* 原始母带旁路 */
  sourceNode.connect(bypassGain);
  bypassGain.connect(audioContext.destination);

  /* Reference B：静态响度匹配 → Playback Curve → 输出 */
  sourceNode
    .connect(trackGain)
    .connect(hpf)
    .connect(lowShelf)
    .connect(presence)
    .connect(air)
    .connect(dspGain)
    .connect(audioContext.destination);

  applyCurrentTrackGain(true);
  bypassGain.gain.value = dspEnabled ? 0 : 1;
  dspGain.gain.value = dspEnabled ? 1 : 0;
  resetClockProbe();
}

async function ensureAudioEngineReady() {
  initAudioEngine();
  if (audioContext && (audioContext.state === "suspended" || audioContext.state === "interrupted")) {
    try {
      await audioContext.resume();
      resetClockProbe();
    } catch (error) {
      console.debug("AudioContext resume deferred", error);
    }
  }
}

function applyDspState() {
  dspBtn.classList.toggle("dsp-on", dspEnabled);
  dspBtn.setAttribute("aria-pressed", String(dspEnabled));

  if (!audioContext || !bypassGain || !dspGain) return;

  if (dspEnabled) applyCurrentTrackGain(true);

  const now = audioContext.currentTime;
  const fade = 0.025;

  bypassGain.gain.cancelScheduledValues(now);
  dspGain.gain.cancelScheduledValues(now);
  bypassGain.gain.setValueAtTime(bypassGain.gain.value, now);
  dspGain.gain.setValueAtTime(dspGain.gain.value, now);
  bypassGain.gain.linearRampToValueAtTime(dspEnabled ? 0 : 1, now + fade);
  dspGain.gain.linearRampToValueAtTime(dspEnabled ? 1 : 0, now + fade);
}

function syncPlaybackUi() {
  isPlaying = !audio.paused && !audio.ended;
  playBtn.classList.toggle("playing", isPlaying);

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
    } catch (error) {
      console.debug("MediaSession playback state unavailable", error);
    }
  }
}

function forceUnityPlaybackRate() {
  if (audio.defaultPlaybackRate !== 1) audio.defaultPlaybackRate = 1;
  if (audio.playbackRate !== 1) audio.playbackRate = 1;
}

async function handleTrackEnded() {
  currentTrack = (currentTrack + 1) % playlist.length;
  await playCurrentTrack();
}

function bindAudioEvents(element) {
  element.addEventListener("play", syncPlaybackUi);
  element.addEventListener("pause", syncPlaybackUi);
  element.addEventListener("ended", handleTrackEnded);
  element.addEventListener("ratechange", forceUnityPlaybackRate);
}

function unbindAudioEvents(element) {
  element.removeEventListener("play", syncPlaybackUi);
  element.removeEventListener("pause", syncPlaybackUi);
  element.removeEventListener("ended", handleTrackEnded);
  element.removeEventListener("ratechange", forceUnityPlaybackRate);
}

bindAudioEvents(audio);

async function closeAudioContext() {
  const previous = audioContext;
  audioContext = null;
  sourceNode = null;
  bypassGain = null;
  trackGain = null;
  dspGain = null;
  resetClockProbe();

  if (previous && previous.state !== "closed") {
    try {
      await previous.close();
    } catch (error) {
      console.debug("AudioContext close deferred", error);
    }
  }
}

function waitForMetadata(element) {
  if (element.readyState >= 1) return Promise.resolve();

  return new Promise((resolve) => {
    const done = () => {
      element.removeEventListener("loadedmetadata", done);
      element.removeEventListener("error", done);
      resolve();
    };
    element.addEventListener("loadedmetadata", done, { once: true });
    element.addEventListener("error", done, { once: true });
  });
}

/*
 * Safari/WebKit 音频路由变化后的安全重建。
 * MediaElementAudioSourceNode 不能可靠地在旧 AudioContext 上继续承担硬件采样率切换，
 * 因此同时换掉 Audio 元素和 AudioContext，确保新图按当前输出硬件重新协商。
 */
async function rebuildSafariAudioPipeline(reason = "route/sample-rate change") {
  if (!isSafariWebKit()) return;
  if (audioPipelineRecoveryPromise) return audioPipelineRecoveryPromise;

  audioPipelineRecoveryPromise = (async () => {
    const oldAudio = audio;
    const resumeAfterRecovery = !oldAudio.paused && !oldAudio.ended;
    const position = Number.isFinite(oldAudio.currentTime) ? oldAudio.currentTime : 0;

    try {
      oldAudio.pause();
    } catch (error) {
      // Ignore a stale media element during route recovery.
    }
    unbindAudioEvents(oldAudio);
    await closeAudioContext();

    audio = createAudioElement(playlist[currentTrack]);
    bindAudioEvents(audio);
    await waitForMetadata(audio);

    if (position > 0 && Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = Math.min(position, Math.max(0, audio.duration - 0.05));
    }

    if (dspEnabled) {
      await ensureAudioEngineReady();
      applyCurrentTrackGain(true);
      applyDspState();
    } else {
      /* DSP 关闭时 Safari 回到真正的原生媒体通道。 */
      dspBtn.classList.remove("dsp-on");
      dspBtn.setAttribute("aria-pressed", "false");
    }

    if (resumeAfterRecovery) {
      try {
        await audio.play();
      } catch (error) {
        console.debug("Playback resume deferred after Safari audio recovery", reason, error);
      }
    } else {
      syncPlaybackUi();
    }

    resetClockProbe();
  })();

  try {
    return await audioPipelineRecoveryPromise;
  } finally {
    audioPipelineRecoveryPromise = null;
  }
}

function scheduleSafariAudioRecovery(reason) {
  if (!isSafariWebKit() || !audioContext || document.hidden) return;
  if (audioRecoveryTimer) window.clearTimeout(audioRecoveryTimer);
  audioRecoveryTimer = window.setTimeout(() => {
    audioRecoveryTimer = null;
    rebuildSafariAudioPipeline(reason);
  }, 180);
}

/*
 * WebKit 的典型 44.1 ↔ 48 kHz 错配会让 AudioContext 时钟相对真实时间
 * 偏离约 8–9%。这里以 4% 为保护阈值；正常调度抖动不会触发，真正变调会自动重建。
 */
window.setInterval(() => {
  if (!isSafariWebKit() || !audioContext || audioContext.state !== "running" ||
      audio.paused || document.hidden || audioPipelineRecoveryPromise) {
    resetClockProbe();
    return;
  }

  const nowWall = performance.now();
  const nowContext = audioContext.currentTime;
  if (clockProbeWallTime == null || clockProbeContextTime == null) {
    clockProbeWallTime = nowWall;
    clockProbeContextTime = nowContext;
    return;
  }

  const wallDelta = (nowWall - clockProbeWallTime) / 1000;
  const contextDelta = nowContext - clockProbeContextTime;
  clockProbeWallTime = nowWall;
  clockProbeContextTime = nowContext;

  if (wallDelta < 0.5 || wallDelta > 2.5) return;
  const clockRatio = contextDelta / wallDelta;
  if (clockRatio < 0.96 || clockRatio > 1.04) {
    console.warn("Safari Web Audio clock drift detected; rebuilding audio pipeline", {
      clockRatio,
      sampleRate: audioContext.sampleRate
    });
    rebuildSafariAudioPipeline("Web Audio clock drift");
  }
}, 1000);

async function toggleDsp() {
  await loadReferenceBMap();

  if (!dspEnabled) {
    await ensureAudioEngineReady();
    if (!audioContext) return;
    dspEnabled = true;
    applyDspState();
    return;
  }

  dspEnabled = false;
  applyDspState();

  /* Safari 的 bypass 必须是真正原生，而不是 0 dB Web Audio 旁路。 */
  if (isSafariWebKit() && audioContext) {
    await rebuildSafariAudioPipeline("DSP bypass");
  }
}

dspBtn.addEventListener("click", toggleDsp);
dspBtn.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleDsp();
  }
});

/* 播放当前曲目。
 * 默认不创建 AudioContext：未启用 DSP 时始终走原生媒体通道。 */
async function playCurrentTrack() {
  hasStartedPlayback = true;
  forceUnityPlaybackRate();

  if (audioContext) {
    await ensureAudioEngineReady();
    applyCurrentTrackGain(true);
  }

  audio.src = playlist[currentTrack];
  audio.load();
  forceUnityPlaybackRate();
  await audio.play();
  resetClockProbe();
}

async function resumeCurrentTrack() {
  forceUnityPlaybackRate();
  if (audioContext) {
    await ensureAudioEngineReady();
    applyCurrentTrackGain(true);
  }
  await audio.play();
  resetClockProbe();
}

/* 点击“走” */
playBtn.addEventListener("click", async () => {
  if (!isPlaying) {
    if (!hasStartedPlayback) {
      currentTrack = silentNightStartTracks[
        Math.floor(Math.random() * silentNightStartTracks.length)
      ];
      await playCurrentTrack();
    } else {
      await resumeCurrentTrack();
    }
  } else {
    audio.pause();
  }
});

/* 点击“右” */
nextBtn.addEventListener("click", async () => {
  currentTrack++;
  if (currentTrack >= playlist.length) currentTrack = 0;
  await playCurrentTrack();
});

/* 点击“左” */
prevBtn.addEventListener("click", async () => {
  currentTrack--;
  if (currentTrack < 0) currentTrack = playlist.length - 1;
  await playCurrentTrack();
});

/*
 * 锁屏/后台返回：Safari 如果正在走 Web Audio，就重建整条图；
 * 其他浏览器保持轻量 resume。这样避免在已变更硬件采样率上继续使用旧 context。
 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !audioContext || audio.paused) {
    resetClockProbe();
    return;
  }

  if (isSafariWebKit()) {
    scheduleSafariAudioRecovery("foreground resume");
  } else if (audioContext.state !== "running") {
    ensureAudioEngineReady();
  }
});

window.addEventListener("pageshow", () => {
  if (isSafariWebKit() && audioContext && !audio.paused) {
    scheduleSafariAudioRecovery("pageshow");
  }
});

/* 蓝牙/耳机/系统输出设备变化时，Safari 主动按新硬件重建 DSP 图。 */
if (navigator.mediaDevices && "addEventListener" in navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener("devicechange", () => {
    if (isSafariWebKit() && audioContext) {
      scheduleSafariAudioRecovery("audio device change");
    }
  });
}

/* 让系统锁屏媒体控件和网页播放器共用同一套状态。 */
if ("mediaSession" in navigator) {
  const setMediaAction = (action, handler) => {
    try {
      navigator.mediaSession.setActionHandler(action, handler);
    } catch (error) {
      console.debug(`MediaSession action ${action} unavailable`, error);
    }
  };

  setMediaAction("play", async () => {
    await resumeCurrentTrack();
  });

  setMediaAction("pause", () => {
    audio.pause();
  });

  setMediaAction("nexttrack", async () => {
    currentTrack = (currentTrack + 1) % playlist.length;
    await playCurrentTrack();
  });

  setMediaAction("previoustrack", async () => {
    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
    await playCurrentTrack();
  });
}
</script>
</body>
