<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
<title>步道卡 · 原定稿卡面｜BUDAO 牧场</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{overflow:hidden;background:rgba(8,46,47,.82);color:#315044}
main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#approvedCardFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#cardLoadStatus{position:relative;z-index:1;max-width:90vw;padding:18px 24px;background:#fff9e9;border:3px solid #476951;box-shadow:5px 6px #1b38354d;text-align:center;font-weight:800}
#approvedCardDock{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;width:min(650px,calc(100% - 25px));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:7px 10px;background:#fff9e9f5;border:2px solid #476951;box-shadow:3px 4px #254a4666;font:700 12px/1.45 system-ui,sans-serif;color:#315044}
#approvedCardHint{flex:1;min-width:140px}
button{cursor:pointer;border:2px solid #45685b;background:#d8e8c6;color:#285443;font-weight:800;padding:7px 10px}
button:focus-visible{outline:3px solid #214d7b;outline-offset:2px}
#cardReceipt{flex-basis:100%;padding:10px;background:#fffdf4;border:1px solid #c3cba8;line-height:1.65;font-weight:600}
#closeCardViewer{position:fixed;top:max(13px,env(safe-area-inset-top));right:15px;z-index:6;border:3px solid #254c3c;background:#f9f0d5;color:#264b3d;padding:8px 13px;font-size:14px;box-shadow:3px 3px #214b3b44}
[hidden]{display:none!important}
@media(max-width:550px){#approvedCardDock{font-size:11px}#cardReceiptToggle{font-size:12px}}
</style></head>
<body>
<main aria-label="步道卡原版六维卡面">
<iframe id="approvedCardFrame" title="步道卡 · 获批六维原稿正反面" loading="eager"></iframe>
<p id="cardLoadStatus" role="status" aria-live="polite">正在载入步道卡原定稿……</p>
<div id="approvedCardDock" hidden>
 <span id="approvedCardHint">定稿卡面展示 · 六维图案为视觉样张，不代表个人实际配卡</span>
 <button id="cardReceiptToggle" type="button">查看真实发行与激活状态</button>
 <button id="founderCardClaim" type="button" hidden>申请核对历史创始卡</button>
 <div id="cardReceipt" role="status" aria-live="polite" hidden></div>
</div>
<button id="closeCardViewer" type="button">收起 ×</button>
</main>
<script>
document.getElementById('closeCardViewer').addEventListener('click',()=>{
 if(window.parent&&window.parent!==window)window.parent.postMessage({type:'pasture-card-close-approved-v1'},location.origin);
 else location.assign('/tonglu.html');
});
</script>
<script src="/pasture-card-art/approved-engine.js" defer></script>
<script src="/pasture-card-viewer.js" defer></script>
</body></html>
