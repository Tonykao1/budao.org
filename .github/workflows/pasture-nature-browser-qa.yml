name: Pasture Nature V2 Browser Visual QA
on:
  pull_request:
    paths:
      - 'pasture-nature-events.js'
      - 'tonglu-core.html'
      - 'tonglu-pasture-portrait.html'
      - 'scripts/pasture-nature-browser-qa.mjs'
      - '.github/workflows/pasture-nature-browser-qa.yml'
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and browser runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run baseline nature tests
        run: node --test test/pasture-nature-events.test.js
      - name: Start local static scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pasture-nature-server.log 2>&1 &
          echo $! > /tmp/pasture-nature-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/tonglu-core.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pasture-nature-server.log
          exit 1
      - name: Screenshot and verify real landscape and portrait canvases
        run: node scripts/pasture-nature-browser-qa.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pasture-nature-v2-visual-evidence
          path: artifacts/pasture-nature-browser/
          retention-days: 14
          if-no-files-found: warn
