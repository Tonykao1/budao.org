name: Meteor RED
on:
  push:
    branches:
      - feature/pasture-meteor-v1
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 test/pasture-meteor.test.js test/pasture-meteor-integration.test.js
