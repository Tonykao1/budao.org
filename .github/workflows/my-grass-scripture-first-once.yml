name: My Grass scripture-first one-shot

on:
  push:
    branches:
      - feat/my-grass-cuv-shen-bible-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(my-grass): apply verified scripture-first refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Apply verified bounded refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pasture-preview/my-grass-v1.js')
          s=p.read_text()
          old='''    '<div class="gs-inline-ref"><label class="gs-field">经文出处<input data-field="reference" maxlength="96" placeholder="诗篇 23:1" value="'+escape(draft.scripture.reference)+'"></label>'+\n    '<button class="gs-action secondary" type="button" data-action="scripture-nav" aria-label="旧约新约、书卷、章节和节数导航">▣ 选经文</button></div>'+\n    '<label class="gs-field">译本<input data-field="translation" maxlength="64" placeholder="所使用的译本" value="'+escape(draft.scripture.translation)+'"></label>'+\n    '<label class="gs-field">经文<textarea class="gs-large" data-field="scriptureText" maxlength="10000" placeholder="在这里录入今日阅读的经文。">'+escape(draft.scripture.text)+'</textarea></label>'+\n    '<span class="gs-small">请按所选译本核对经文。</span></section>'+'''
          new='''    '<div class="gs-scripture-toolbar"><input class="gs-scripture-reference" data-field="reference" maxlength="96" aria-label="经文出处" value="'+escape(draft.scripture.reference)+'">'+\n    '<button class="gs-action secondary gs-scripture-nav-button" type="button" data-action="scripture-nav" aria-label="旧约新约、书卷和章节导航">选经文</button>'+\n    '<input data-field="translation" maxlength="64" value="'+escape(draft.scripture.translation)+'" hidden></div>'+\n    '<textarea data-field="scriptureText" maxlength="10000" hidden>'+escape(draft.scripture.text)+'</textarea></section>'+'''
          if old not in s: raise SystemExit('stageReading target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('pasture-preview/my-grass-reading-v1.js')
          s=p.read_text()
          a=s.find('  function chapterFromExistingEsv(book,chapter){')
          b=s.find('  async function hydrateChapter(){',a)
          if a<0 or b<0: raise SystemExit('ESV polling helper target not found')
          s=s[:a]+s[b:]
          old='''    let chapter=cache.get(key)||null;\n    if(!chapter&&tid===ESV_ID){\n     chapter=chapterFromExistingEsv(p.book,p.chapter);\n     if(!chapter){\n      const text=ws.querySelector('[data-field="scriptureText"]');\n      if(text?.dataset.scriptureState==='error')throw Error(text.placeholder||'ESV 经文暂时无法载入。');\n      reader.innerHTML='<span class="gs-small">正在载入 ESV 经文……</span>';lastStageKey='';schedule(80);return;\n     }\n    }\n    if(!chapter)chapter=await loadReadingChapter(p.book,p.chapter,tid);\n'''
          new='''    let chapter=cache.get(key)||null;\n    if(!chapter)chapter=await loadReadingChapter(p.book,p.chapter,tid);\n'''
          if old not in s: raise SystemExit('ESV hydrate target not found')
          s=s.replace(old,new,1).replace("    if(tid!==ESV_ID)cache.set(key,chapter);","    cache.set(key,chapter);",1)
          p.write_text(s)

          p=Path('pasture-preview/my-grass-bible-v04.js')
          s=p.read_text()
          if 'esvPassageCache' in s: raise SystemExit('ESV cache already present unexpectedly')
          s=s.replace(' const chapterCache=new Map();',' const chapterCache=new Map(),esvPassageCache=new Map();\n let esvCustomCaches=new WeakMap();',1)
          a=s.find(' async function loadEsvPassage(referenceOrState,fetchImpl){')
          b=s.find(' function resolveTranslationId(value){',a)
          if a<0 or b<0: raise SystemExit('loadEsvPassage target not found')
          newfn=''' async function loadEsvPassage(referenceOrState,fetchImpl){\n  const state=normalizeState(referenceOrState),reference=normalizeReference(state),canonicalRequest=toEnglishReference(state);\n  const cacheKey=canonicalRequest;\n  let passageCache=esvPassageCache;\n  if(fetchImpl&&typeof fetchImpl==='function'){\n   passageCache=esvCustomCaches.get(fetchImpl);\n   if(!passageCache){passageCache=new Map();esvCustomCaches.set(fetchImpl,passageCache)}\n  }\n  if(passageCache.has(cacheKey))return passageCache.get(cacheKey);\n  const pending=(async()=>{\n   const fetcher=fetchImpl||(typeof fetch==='function'?fetch:null);if(!fetcher)throw Error('当前环境无法载入 ESV 经文。');\n   const response=await fetcher(esvTranslation.endpoint+'?reference='+encodeURIComponent(canonicalRequest),{cache:'no-store',headers:{Accept:'application/json'}});\n   let data={};try{data=await response.json()}catch(e){}\n   if(!response.ok){\n    if(response.status===503&&data.reason==='esv_not_configured')throw Error('ESV API 尚未配置。请先在 Vercel 设置 ESV_API_KEY。');\n    if(response.status===429)throw Error('ESV 经文请求暂时较多，请稍后再试。');\n    throw Error('ESV 经文暂时无法载入。');\n   }\n   const text=String(data.text||'').trim();if(!text)throw Error('ESV 经文返回为空。');\n   return {reference,canonical:String(data.canonical||canonicalRequest),translation:esvTranslation.name,source:esvTranslation.id,storage:esvTranslation.storage,verseIds:verseIdsForState(state),text,copyright:String(data.copyright||'ESV')};\n  })();\n  passageCache.set(cacheKey,pending);\n  try{const result=await pending;passageCache.set(cacheKey,Promise.resolve(result));return result}\n  catch(error){passageCache.delete(cacheKey);throw error}\n }\n'''
          s=s[:a]+newfn+s[b:]
          s=s.replace("picker.innerHTML='<option value=\"'+cuvTranslation.id+'\">'+cuvTranslation.name+'</option><option value=\"'+esvTranslation.id+'\">'+esvTranslation.name+'</option>';","picker.innerHTML='<option value=\"'+cuvTranslation.id+'\">和合本（神版）</option><option value=\"'+esvTranslation.id+'\">ESV</option>';",1)
          s=s.replace(' function clearCache(){chapterCache.clear()}',' function clearCache(){chapterCache.clear();esvPassageCache.clear();esvCustomCaches=new WeakMap()}',1)
          p.write_text(s)

          p=Path('pasture-preview/my-grass-immersive-v04.css')
          s=p.read_text()
          marker='/* 经卷领受：保持既定古卷，只压缩控制区，让经文重新成为左页主体。 */'
          if marker in s: raise SystemExit('compact CSS already present unexpectedly')
          s+='''\n\n/* 经卷领受：保持既定古卷，只压缩控制区，让经文重新成为左页主体。 */\n#grassWorkspace .gs-scripture-toolbar{\n display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px;padding:0 0 5px;\n border-bottom:1px solid rgba(140,105,62,.22);\n}\n#grassWorkspace .gs-scripture-reference{\n flex:1 1 140px;min-width:0;width:auto!important;margin:0!important;padding:2px 2px!important;\n border:0!important;background:transparent!important;box-shadow:none!important;\n color:#4b3422;font:800 clamp(16px,1.25vw,20px)/1.35 STKaiti,KaiTi,"Songti SC",serif;\n}\n#grassWorkspace .gs-scripture-nav-button{\n min-height:32px!important;padding:5px 10px!important;border-width:1px!important;box-shadow:none!important;font-size:12px!important;\n}\n#grassWorkspace .gs-scripture-toolbar .gs-translation-picker{\n flex:0 0 auto;max-width:155px;min-height:32px;margin:0;padding:4px 24px 4px 8px;\n border:1px solid rgba(128,102,66,.55);background:rgba(255,247,220,.20);color:#4c3926;\n font:700 12px/1.3 "PingFang SC",system-ui,sans-serif;\n}\n#grassWorkspace .gs-scripture-toolbar #gsEsvAttribution{\n flex:1 0 100%;margin:0!important;font-size:9px!important;line-height:1.25!important;opacity:.62!important;\n}\n#grassWorkspace .gs-reading-panel{overflow:hidden!important;display:flex!important;flex-direction:column!important}\n#grassWorkspace .gs-reception-guide{\n flex:0 0 auto;margin:1px 0 3px!important;padding:1px 0 1px 8px!important;font-size:10px!important;line-height:1.4!important;\n}\n#grassWorkspace .gs-verse-reader{\n flex:1 1 auto!important;min-height:0!important;max-height:none!important;overflow:auto!important;padding:3px 4px 8px 1px!important;\n}\n#grassWorkspace .gs-reading-finish{flex:0 0 auto;padding-top:4px!important;margin-top:2px;border-top:1px solid rgba(140,105,62,.18)!important}\n#grassWorkspace .gs-reading-finish .gs-action{min-height:34px!important;padding:5px 10px!important;font-size:12px!important}\n@media(max-width:820px){\n #grassWorkspace .gs-scripture-toolbar{gap:6px}\n #grassWorkspace .gs-scripture-reference{flex-basis:110px}\n #grassWorkspace .gs-scripture-toolbar .gs-translation-picker{max-width:120px}\n #grassWorkspace .gs-verse-reader{min-height:280px!important}\n}\n'''
          p.write_text(s)

          p=Path('test/my-grass-reading-session.test.js')
          s=p.read_text()
          s=s.replace("const C=require('../pasture-preview/my-grass-core.js');\nconst R=require('../pasture-preview/my-grass-reading-v1.js');","const C=require('../pasture-preview/my-grass-core.js');\nconst B=require('../pasture-preview/my-grass-bible-v04.js');\nconst R=require('../pasture-preview/my-grass-reading-v1.js');",1)
          old="""test('ESV reader waits for the Bible hydrator instead of issuing a second UI request and fixes attribution visibility',()=>{\n const ui=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-reading-v1.js'),'utf8');\n assert.match(ui,/chapterFromExistingEsv/);\n assert.match(ui,/正在载入 ESV 经文/);\n assert.match(ui,/lastStageKey='';schedule\\(80\\);return/);\n assert.match(ui,/scriptureState==='error'/);\n assert.match(ui,/function syncAttribution/);\n assert.match(ui,/attribution\\.style\\.display=show\\?'block':'none'/);\n});"""
          new="""test('ESV reader uses the shared passage loader directly and fixes attribution visibility',()=>{\n const ui=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-reading-v1.js'),'utf8');\n assert.doesNotMatch(ui,/chapterFromExistingEsv/);\n assert.doesNotMatch(ui,/schedule\\(80\\)/);\n assert.match(ui,/await loadReadingChapter\\(p\\.book,p\\.chapter,tid\\)/);\n assert.match(ui,/function syncAttribution/);\n assert.match(ui,/attribution\\.style\\.display=show\\?'block':'none'/);\n});"""
          if old not in s: raise SystemExit('old ESV reader test not found')
          s=s.replace(old,new,1)
          s+='''\n\ntest('approved reading layout keeps scripture dominant with one compact toolbar',()=>{\n const shell=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-v1.js'),'utf8');\n const css=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-immersive-v04.css'),'utf8');\n assert.match(shell,/class="gs-scripture-toolbar"/);\n assert.match(shell,/class="gs-scripture-reference"[^>]*data-field="reference"/);\n assert.match(shell,/data-field="translation"[^>]*hidden/);\n assert.match(shell,/data-field="scriptureText"[^>]*hidden/);\n assert.doesNotMatch(shell,/<label class="gs-field">译本<input/);\n assert.doesNotMatch(shell,/<label class="gs-field">经文<textarea/);\n assert.match(css,/\\.gs-scripture-toolbar[\\s\\S]*display:flex/);\n assert.match(css,/\\.gs-verse-reader[\\s\\S]*flex:1/);\n});\n\ntest('ESV reading renders from the shared loader promise instead of polling hidden textarea',()=>{\n const ui=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-reading-v1.js'),'utf8');\n assert.doesNotMatch(ui,/chapterFromExistingEsv/);\n assert.doesNotMatch(ui,/schedule\\(80\\)/);\n assert.match(ui,/await loadReadingChapter\\(p\\.book,p\\.chapter,tid\\)/);\n});\n\ntest('concurrent ESV consumers share one in-memory request promise',async()=>{\n B.clearCache();\n let calls=0,release;\n const gate=new Promise(resolve=>{release=resolve});\n const fetcher=async()=>{\n  calls++;\n  await gate;\n  return {ok:true,status:200,json:async()=>({ok:true,canonical:'Revelation 3',text:'[1] First. [2] Second. (ESV)',copyright:'ESV'})};\n };\n const first=B.loadEsvPassage('启 3',fetcher);\n const second=B.loadEsvPassage('启 3',fetcher);\n await new Promise(resolve=>setImmediate(resolve));\n assert.equal(calls,1);\n release();\n const [a,b]=await Promise.all([first,second]);\n assert.equal(a.text,b.text);\n await B.loadEsvPassage('启 3',fetcher);\n assert.equal(calls,1);\n B.clearCache();\n});\n'''
          p.write_text(s)
          PY

      - name: Verify bounded change
        run: |
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit source changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add pasture-preview/my-grass-bible-v04.js pasture-preview/my-grass-immersive-v04.css pasture-preview/my-grass-reading-v1.js pasture-preview/my-grass-v1.js test/my-grass-reading-session.test.js
          git rm .github/workflows/my-grass-scripture-first-once.yml
          git commit -m 'fix(my-grass): restore scripture-first reading layout'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
