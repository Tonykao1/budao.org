name: Apply Calendar Centerline Layout Once

on:
  push:
    paths:
      - ".github/workflows/apply-calendar-centerline-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply vertical centerline marker layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('budao-calendar.css')
          css = path.read_text()
          old = '''.budao-calendar-step-stack[data-count="2"] .budao-calendar-step-mark:nth-child(1){
              top:2px;
              transform:translateX(calc(-50% - 14px)) rotate(-8deg);
          }

          .budao-calendar-step-stack[data-count="2"] .budao-calendar-step-mark:nth-child(2){
              top:2px;
              transform:translateX(calc(-50% + 14px)) rotate(8deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(1){
              top:4px;
              transform:translateX(calc(-50% - 22px)) rotate(-10deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(2){
              top:0;
              transform:translateX(-50%) rotate(1deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(3){
              top:4px;
              transform:translateX(calc(-50% + 22px)) rotate(10deg);
          }'''
          new = '''.budao-calendar-step-stack[data-count="2"] .budao-calendar-step-mark:nth-child(1){
              top:0;
              transform:translateX(-50%) rotate(-7deg);
          }

          .budao-calendar-step-stack[data-count="2"] .budao-calendar-step-mark:nth-child(2){
              top:12px;
              transform:translateX(-50%) rotate(7deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(1){
              top:0;
              transform:translateX(-50%) rotate(-8deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(2){
              top:8px;
              transform:translateX(-50%) rotate(0deg);
          }

          .budao-calendar-step-stack[data-count="3"] .budao-calendar-step-mark:nth-child(3){
              top:16px;
              transform:translateX(-50%) rotate(8deg);
          }'''
          if old not in css:
              raise SystemExit('expected horizontal multi-step layout not found')
          path.write_text(css.replace(old, new, 1))
          PY

      - name: Run calendar regression tests
        run: node --test test/calendar-strip.test.js

      - name: Commit layout and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "budao-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-calendar-centerline-once.yml
          git add budao-calendar.css
          git commit -m "style(calendar): align step marks to date centerline [skip ci]"
          git push origin main
