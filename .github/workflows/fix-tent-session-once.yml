name: One-shot Tent Session Repair

on:
  push:
    paths:
      - ".github/workflows/fix-tent-session-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch publisher session and expired-session message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          auth = Path("api/_security/auth.js")
          text = auth.read_text(encoding="utf-8")
          old = 'const SESSION_TTL_SECONDS = 60 * 60;'
          new = 'const SESSION_TTL_SECONDS = 8 * 60 * 60;'
          if old not in text:
              raise SystemExit("Expected 1-hour session TTL not found")
          auth.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = Path("tent-app.js")
          text = app.read_text(encoding="utf-8")
          needle = '    if (error && error.reason === "deploy_pending") {\n      return "部署尚未完成。请稍后查看。";\n    }\n\n    return "这段路已经预备好，还需要被送出。";'
          replacement = '    if (error && error.reason === "deploy_pending") {\n      return "部署尚未完成。请稍后查看。";\n    }\n\n    if (error && error.reason === "unauthorized") {\n      return "登录已过期，请重新进入帐篷；草稿已保留。";\n    }\n\n    return "这段路已经预备好，还需要被送出。";'
          if needle not in text:
              raise SystemExit("Expected publish failure block not found")
          app.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Run focused regression checks
        shell: bash
        run: |
          node --check api/_security/auth.js
          node --check tent-app.js
          node --test test/tent-session-regression.test.js
          node --test --test-concurrency=1 test/security.test.js test/tent-stability.test.js test/tent-publish-commit.test.js

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-tent-session-once.yml
          git config user.name "budao-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(tent): keep publisher session alive through editing [skip ci]"
          git push
