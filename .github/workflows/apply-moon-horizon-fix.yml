name: Apply moon horizon fix

on:
  push:
    branches: ['fix/moon-horizon-sprite']
    paths:
      - '.github/workflows/apply-moon-horizon-fix.yml'
      - '.github/scripts/fix_moon_horizon_sprite.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 .github/scripts/fix_moon_horizon_sprite.py
      - name: Verify focused and regression tests
        run: |
          node --test test/pasture-moon-horizon.test.js
          node --test test/pasture-sky-engine.test.js test/pasture-moon-visibility.test.js
          node --check pasture-sky-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['tonglu.html','tonglu-pasture-portrait.html']:
              s=Path(fn).read_text()
              scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
              assert scripts, fn
              Path('/tmp/'+fn+'.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tonglu.html.js
          node --check /tmp/tonglu-pasture-portrait.html.js
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'budao-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pasture-sky-engine.js tonglu.html tonglu-pasture-portrait.html
          git commit -m 'fix moon sprite horizon projection'
          git push
