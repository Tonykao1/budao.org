name: Apply Journey model
on:
  push:
    branches: [feat/my-grass-cuv-shen-bible-v1]
    paths: [.github/workflows/my-grass-journey-model-sync.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
      - name: Patch
        shell: bash
        run: |
          printf '%s' '...[truncated]' | base64 -d | gzip -d > /tmp/journey.patch
          git apply --check /tmp/journey.patch
          git apply /tmp/journey.patch
      - name: Validate
        run: |
          node --test test/my-grass-reading-journey.test.js test/my-grass-reading-session.test.js
          npm run build
          npm run lint
          git diff --check
      - name: Commit and clean workflow
        shell: bash
        run: |
          rm .github/workflows/my-grass-journey-model-sync.yml
          git config user.name 'Tonykao1'
          git config user.email '69593498+Tonykao1@users.noreply.github.com'
          git add pasture-preview/my-grass-core.js test/my-grass-reading-journey.test.js .github/workflows/my-grass-journey-model-sync.yml
          git commit -m 'feat(my-grass): add integrated reading journey model'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
