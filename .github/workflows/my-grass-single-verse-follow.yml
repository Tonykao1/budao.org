name: My Grass single verse follow apply

on:
  push:
    branches:
      - feat/my-grass-cuv-shen-bible-v1
    paths:
      - .github/workflows/my-grass-single-verse-follow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 0
      - name: Apply single verse playback emphasis fix
        shell: bash
        run: |
          cat > /tmp/fix.b64 <<'EOF'

EOF
          base64 -d /tmp/fix.b64 | gzip -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Verify fix
        run: |
          node --test test/my-grass-reading-session.test.js
          npm run build
          npm run lint
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/my-grass-single-verse-follow.yml
          git config user.name "Tonykao1"
          git config user.email "69593498+Tonykao1@users.noreply.github.com"
          git add pasture-preview/my-grass-reading-v1.js pasture-preview/my-grass-immersive-v04.css test/my-grass-reading-session.test.js .github/workflows/my-grass-single-verse-follow.yml
          git commit -m "fix(my-grass): keep playback emphasis to one verse"
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
