name: Sync newly published music to What's New
on:
  push:
    branches: [main]
    paths:
      - home.html
permissions:
  contents: write
concurrency:
  group: whats-new-music-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate news from newly added playlist entries
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/sync-whats-new-music.js
      - name: Publish updated news feed
        run: |
          if git diff --quiet -- whats-new.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whats-new.json
          git commit -m "news: publish newly added homepage music"
          git push
