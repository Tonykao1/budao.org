name: My Grass approved reading visual refinement once

on:
  push:
    branches: [feat/my-grass-cuv-shen-bible-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(my-grass): apply approved reading visual refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Apply verified patch
        shell: bash
        run: |
          cat > /tmp/my-grass-reading-visual.patch.gz.b64 <<'EOF'
          
          
          
          EOF
          tr -d '[:space:]' < /tmp/my-grass-reading-visual.patch.gz.b64 | base64 -d | gunzip > /tmp/my-grass-reading-visual.patch
          git apply --check /tmp/my-grass-reading-visual.patch
          git apply /tmp/my-grass-reading-visual.patch

      - name: Verify bounded change
        run: |
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add pasture-preview/my-grass-v1.js pasture-preview/my-grass-immersive-v04.css test/my-grass-reading-session.test.js
          git rm .github/workflows/my-grass-reading-visual-refine-once.yml
          git commit -m 'fix(my-grass): refine approved scripture reading visuals'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
