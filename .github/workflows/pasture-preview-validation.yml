name: Digital Pasture Preview Regression
on:
  push:
    branches:
      - preview/digital-pasture-complete-20260929
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card-and-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test six dimensions, approved art, identity sync and all eight exits
        run: >-
          node --test --test-concurrency=1
          test/pasture-six-dim.test.js
          test/pasture-card-approved-visual.test.js
          test/pasture-card-integrated.test.js
          test/pasture-eight-panels.test.js
          test/my-grass-core.test.js
          test/my-grass-bible-immersive.test.js
          test/pasture-resident-auth.test.js
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify full eight-module preview in Chromium
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/pasture-http.log 2>&1 &
          sleep 2
          node test/pasture-resident-browser.cjs
          # Legacy module-entry E2E is intentionally paused while every resident button is locked.
          # Static/module regressions above continue protecting those implementations until each feature is released.
      - name: Save browser failure image
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pasture-preview-failure
          path: |
            /tmp/pasture-preview-failure.png
            /tmp/my-grass-browser-failure.png
            /tmp/my-grass-v04-desktop.png
            /tmp/my-grass-v04-mobile.png
            /tmp/pasture-resident-failure.png
          if-no-files-found: ignore
      - name: Save immersion review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-grass-v04-visual-review
          path: |
            /tmp/my-grass-v04-desktop.png
            /tmp/my-grass-v04-mobile.png
          if-no-files-found: ignore
