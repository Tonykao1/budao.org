name: Pasture Registration Integration
on:
  push:
    branches:
      - integration/pasture-registration-20261005
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify registration backend
        run: node --test --test-concurrency=1 test/pasture-registration-backend.test.js
      - name: Verify deterministic daily sheep placement
        run: node --test --test-concurrency=1 test/pasture-position-domain.test.js
      - name: Verify registration frontend
        run: node --test --test-concurrency=1 test/pasture-registration-frontend.test.js
      - name: Verify durable login lifecycle
        run: node --test --test-concurrency=1 test/pasture-login-integration.test.js
      - name: Verify resident findability sync
        run: node --test --test-concurrency=1 test/pasture-resident-findability.test.js
      - name: Verify additive pasture UI contract
        run: node --test --test-concurrency=1 test/pasture-ui-restore.test.js test/pasture-login-additive-regression.test.js
      - name: Verify approved shop drawer and close system
        run: node --test --test-concurrency=1 test/pasture-approved-overlays.test.js
      - name: Verify sky and weather integrations
        run: node --test --test-concurrency=1 test/pasture-sky-engine.test.js test/pasture-sky-integration.test.js test/pasture-meteor.test.js test/pasture-meteor-integration.test.js
      - name: Verify pasture lamb behavior
        run: node --test --test-concurrency=1 tests/pasture-lamb-rest.test.js
      - name: Verify Vercel function budget
        run: node --test --test-concurrency=1 test/vercel-function-budget.test.js
      - name: Verify JavaScript syntax
        run: npm run lint
      - name: Verify schema module loading
        run: npm run typecheck
      - name: Verify security build
        run: npm run build
      - name: Verify Drizzle migrations
        run: npm run db:check
