name: Pasture Registration Integration
on:
  push:
    branches:
      - integration/pasture-registration-20261005
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify registration backend
        run: node --test --test-concurrency=1 test/pasture-registration-backend.test.js
      - name: Verify registration frontend
        run: node --test --test-concurrency=1 test/pasture-registration-frontend.test.js
      - name: Verify additive pasture UI contract
        run: node --test --test-concurrency=1 test/pasture-ui-restore.test.js test/pasture-login-additive-regression.test.js
      - name: Verify protected sky engine
        run: node --test --test-concurrency=1 test/pasture-sky-engine.test.js
      - name: Verify Vercel function budget
        run: node --test --test-concurrency=1 test/vercel-function-budget.test.js
