name: Meteor GREEN
on:
  push:
    branches:
      - feature/pasture-meteor-v1
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pasture-meteor-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply_meteor_patch.js
      - run: npm ci
      - name: Meteor focused tests
        run: node --test --test-concurrency=1 test/pasture-meteor.test.js test/pasture-meteor-integration.test.js test/pasture-sky-engine.test.js test/pasture-sky-integration.test.js
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pasture-sky-engine.js tonglu.html tonglu-pasture-portrait.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add rare shared pasture meteors"
          git push origin HEAD:feature/pasture-meteor-v1
