name: Archive Route Calendar Events

on:
  push:
    branches:
      - main
    paths:
      - "routes.json"

permissions:
  contents: write

concurrency:
  group: route-calendar-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Archive current published routes
        run: node scripts/sync-calendar-events.js

      - name: Commit calendar ledger when changed
        shell: bash
        run: |
          if git diff --quiet -- calendar-events.json; then
            echo "Calendar ledger already current."
            exit 0
          fi
          git config user.name "budao-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-events.json
          git commit -m "Sync route calendar events"
          git pull --rebase origin main
          git push origin HEAD:main
