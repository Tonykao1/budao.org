name: Apply tested pause-resume journey
on:
  push:
    branches: [feat/my-grass-cuv-shen-bible-v1]
    paths: [.github/workflows/my-grass-pause-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify pause-resume workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc | git apply --index
          node --test test/my-grass-journey-pause.test.js test/my-grass-journey-stop.test.js test/my-grass-journey-recorder.test.js test/my-grass-journey-reading-ui.test.js test/my-grass-reading-session.test.js test/my-grass-reading-journey.test.js test/my-grass-recording-v13.test.js
          npm run build
          npm run lint
          git rm -f .github/workflows/my-grass-pause-apply.yml
          git add pasture-preview/my-grass-v1.js pasture-preview/my-grass-reading-v1.js test/my-grass-journey-stop.test.js test/my-grass-journey-pause.test.js
          git diff --cached --check
          git -c user.name='Tonykao1' -c user.email='69593498+Tonykao1@users.noreply.github.com' commit -m 'fix(my-grass): pause recording during end confirmation'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
