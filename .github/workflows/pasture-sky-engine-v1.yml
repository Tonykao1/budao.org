name: Pasture Sky Engine v1

on:
  push:
    branches:
      - feature/pasture-sky-engine-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pasture-sky-engine-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sky engine tests
        run: node --test test/pasture-sky-engine.test.js test/pasture-sky-integration.test.js
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Build checks
        run: npm run build
