name: Audio Reference B Analysis

on:
  push:
    paths:
      - ".github/workflows/audio-reference-b.yml"
      - "home.html"
      - "music/*.mp3"
  workflow_dispatch:

concurrency:
  group: audio-reference-b-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Measure playlist loudness
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          from concurrent.futures import ThreadPoolExecutor

          # Read the actual homepage playlist so future additions cannot be omitted.
          html = pathlib.Path("home.html").read_text(encoding="utf-8")
          match = re.search(r'const playlist\s*=\s*(\[[\s\S]*?\]);', html)
          if not match:
              raise RuntimeError("Could not find homepage music playlist")
          playlist = json.loads(match.group(1))
          missing = [path for path in playlist if not pathlib.Path(path).is_file()]
          if missing:
              print("WARNING: playlist entries missing source files:", missing)
          playlist = [path for path in playlist if pathlib.Path(path).is_file()]
          if not playlist:
              raise RuntimeError("No available playlist audio files to measure")


          # Reference B prioritizes fidelity over streaming-style loudness.
          # -20 LUFS lets the high-LRA acoustic/classical masters keep their crest factor
          # without forcing a limiter to shave several dB off musical peaks.
          TARGET_LUFS = -20.0
          PRE_EQ_TP_CEILING = -1.5

          def measure(path):
              proc = subprocess.run(
                  [
                      "ffmpeg", "-threads", "1", "-hide_banner", "-nostats", "-i", path,
                      "-af", "loudnorm=I=-20:TP=-1.5:LRA=11:print_format=json",
                      "-f", "null", "-"
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True,
              )
              match = re.search(r'\{\s*"input_i".*?\}', proc.stderr, re.S)
              if not match:
                  raise RuntimeError(f"Could not parse loudnorm result for {path}")
              data = json.loads(match.group(0))

              input_i = float(data["input_i"])
              input_tp = float(data["input_tp"])
              input_lra = float(data["input_lra"])
              input_thresh = float(data["input_thresh"])

              loudness_gain = TARGET_LUFS - input_i
              peak_safe_gain = PRE_EQ_TP_CEILING - input_tp
              gain_db = min(loudness_gain, peak_safe_gain)

              return path, {
                  "integrated_lufs": round(input_i, 2),
                  "true_peak_dbtp": round(input_tp, 2),
                  "lra_lu": round(input_lra, 2),
                  "threshold_lufs": round(input_thresh, 2),
                  "gain_db": round(gain_db, 2),
                  "result_lufs_est": round(input_i + gain_db, 2),
                  "result_tp_est": round(input_tp + gain_db, 2),
                  "peak_limited": peak_safe_gain < loudness_gain,
              }

          with ThreadPoolExecutor(max_workers=8) as pool:
              measured = dict(pool.map(measure, playlist))

          tracks = {path: measured[path] for path in playlist}
          out = {
              "system": "余 DSP Reference B",
              "standard": "ITU-R BS.1770 / EBU R128 via ffmpeg loudnorm",
              "target_integrated_lufs": TARGET_LUFS,
              "pre_eq_true_peak_ceiling_dbtp": PRE_EQ_TP_CEILING,
              "note": "Per-track static loudness gain only. No dynamic compression or loudness-range reduction. Peak-limited tracks are intentionally allowed to sit slightly below target rather than altering their internal dynamics.",
              "tracks": tracks,
          }

          pathlib.Path("music/music.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Commit measured Reference B map
        shell: bash
        run: |
          if git diff --quiet -- music/music.json; then
            echo "No loudness-map changes"
            exit 0
          fi
          git config user.name "budao-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add music/music.json
          git commit -m "audio: measure Reference B loudness map"
          # The site can receive concurrent commits while ffmpeg measures the MP3s.
          # Rebase before pushing; never force-push or silently drop the new data.
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            python3 - <<'PY'
          import json, pathlib, re
          html = pathlib.Path("home.html").read_text(encoding="utf-8")
          match = re.search(r'const playlist\s*=\s*(\[[\s\S]*?\]);', html)
          if not match:
              raise SystemExit("Homepage playlist was changed; refusing stale DSP map")
          playlist = json.loads(match.group(1))
          tracks = json.loads(pathlib.Path("music/music.json").read_text(encoding="utf-8"))["tracks"]
          if list(tracks) != playlist:
              raise SystemExit("Playlist changed during measurement; next workflow must regenerate DSP map")
          PY
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Could not push DSP measurements after four safe rebases"
          exit 1
