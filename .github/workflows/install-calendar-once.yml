name: One-shot Route Calendar Install

on:
  push:
    paths:
      - ".github/workflows/install-calendar-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert isolated calendar module only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test.html")
          text = path.read_text(encoding="utf-8")

          css_anchor = '<link rel="stylesheet" href="invitation-engine.css?v=20260824-mode-b-share">'
          css_insert = css_anchor + '\n<link rel="stylesheet" href="budao-calendar.css?v=20260917">'
          if text.count(css_anchor) != 1:
              raise SystemExit("calendar css anchor mismatch")
          text = text.replace(css_anchor, css_insert, 1)

          calendar_anchor = '''    </div>\n\n   <div\nclass="route-grid"\nid="routeGrid"></div>'''
          calendar_insert = '''    </div>\n\n    <section class="budao-calendar" id="budaoCalendar" aria-label="步道日历"></section>\n\n   <div\nclass="route-grid"\nid="routeGrid"></div>'''
          if text.count(calendar_anchor) != 1:
              raise SystemExit("calendar placement anchor mismatch")
          text = text.replace(calendar_anchor, calendar_insert, 1)

          script_anchor = '<script>\n\nfunction openImage(src){'
          script_insert = '<script src="budao-calendar.js?v=20260917"></script>\n\n<script>\n\nfunction openImage(src){'
          if text.count(script_anchor) != 1:
              raise SystemExit("calendar script anchor mismatch")
          text = text.replace(script_anchor, script_insert, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify calendar contract
        shell: bash
        run: |
          node --check budao-calendar.js
          node --test test/calendar-strip.test.js
          git diff --check

      - name: Commit calendar insertion and remove installer
        shell: bash
        run: |
          rm .github/workflows/install-calendar-once.yml
          git config user.name "budao-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test.html .github/workflows/install-calendar-once.yml
          git commit -m "feat(calendar): place approved calendar above route slots [skip ci]"
          git push
