name: My Grass V1.3 recording verified apply

on:
  push:
    branches:
      - feat/my-grass-cuv-shen-bible-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Extract the already verified patch script
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Tonykao1/budao.org/7ef14f452ab2aeddbdeff5a839834c651149d6c1/.github/workflows/my-grass-recording-v13-apply.yml" -o /tmp/old-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/old-workflow.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(lines) if "python3 - <<'PY'" in line)
          body=[]
          for line in lines[start+1:]:
              if line == '          PY':
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          if not body:
              raise SystemExit('verified patch script not found')
          Path('/tmp/apply-recording-v13.py').write_text('\n'.join(body)+'\n')
          PY
          python3 /tmp/apply-recording-v13.py

      - name: Verify restored recording flow
        run: |
          node --test test/my-grass-recording-v13.test.js
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add package.json pasture-preview/my-grass-v1.js pasture-preview/my-grass-immersive-v04.css test/my-grass-recording-v13.test.js
          git rm .github/workflows/my-grass-recording-v13-run.yml
          git commit -m 'fix(my-grass): restore V1.3 recording controls'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
