name: My Grass compact reading patch once

on:
  push:
    branches: [feat/my-grass-cuv-shen-bible-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Apply verified patch
        shell: bash
        run: |
          cat > /tmp/my-grass-ui.patch.gz.b64 <<'EOF'
          
          
          
          
          EOF
          tr -d '[:space:]' < /tmp/my-grass-ui.patch.gz.b64 | base64 -d | gzip -d > /tmp/my-grass-ui.patch
          git apply --check /tmp/my-grass-ui.patch
          git apply /tmp/my-grass-ui.patch

      - name: Verify
        run: |
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add pasture-preview/my-grass-bible-v04.js pasture-preview/my-grass-immersive-v04.css pasture-preview/my-grass-reading-v1.js pasture-preview/my-grass-v1.js test/my-grass-reading-session.test.js
          git rm .github/workflows/my-grass-scripture-first-patch-once.yml
          git commit -m 'fix(my-grass): restore scripture-first reading layout'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
