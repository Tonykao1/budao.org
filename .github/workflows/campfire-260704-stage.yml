name: Finalize Campfire 260704 Photos
on:
  push:
    branches:
      - campfire/260704-dongjiao-wetland
    paths:
      - release-assets/260704-dongjiao.zip
      - .github/workflows/campfire-260704-stage.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: campfire-260704-staging
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campfire/260704-dongjiao-wetland
          fetch-depth: 0
      - name: Verify and extract approved photo assets
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          root = Path.cwd()
          archive = root / 'release-assets/260704-dongjiao.zip'
          expected = [f'campfire-photos/260704/260704-{i:02}.webp' for i in range(1, 4)]
          if not archive.is_file():
              raise FileNotFoundError(archive)
          with zipfile.ZipFile(archive) as z:
              for name in expected:
                  content = z.read(name)
                  if not (content[:4] == b'RIFF' and content[8:12] == b'WEBP'):
                      raise ValueError(f'Not a valid WebP file: {name}')
                  dest = root / name
                  if dest.exists():
                      raise FileExistsError(f'Refusing to overwrite: {name}')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
                  print('Verified', name, len(content))
          path = root / 'data/campfire-archive.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          albums = [a for a in data['albums'] if a.get('id') == '260704']
          if len(albums) != 1:
              raise ValueError('Expected exactly one 260704 album')
          album = albums[0]
          if [p['src'].lstrip('/') for p in album['photos']] != expected:
              raise ValueError('Photo order and archive filenames mismatch')
          if album.get('published'):
              raise ValueError('Staged album was already published')
          album['published'] = True
          album['publishedOn'] = '2026-11-10'
          album['editorialNote'] = ('管理员于2026-11-10提供2026-07-04东郊湿地公园的3张实拍，并明确同意公开发布。'
                                    '按水岸、林间、同行相拥的叙事次序编排；照片统一转为WebP并去除EXIF。'
                                    '不推断任何人物身份；保留依法申请更正或撤回的机制。')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit published album assets
        shell: bash
        run: |
          git config user.name "budao-campfire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/campfire-archive.json campfire-photos/260704/
          git rm release-assets/260704-dongjiao.zip
          git commit -m "feat(campfire): publish 260704 wetland gallery [skip ci]"
          git pull --rebase origin campfire/260704-dongjiao-wetland
          git push origin HEAD:campfire/260704-dongjiao-wetland
