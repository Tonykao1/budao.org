name: Campfire Trail Memories

on:
  push:
    paths:
      - "yhzd.html"
      - "campfire.css"
      - "campfire.js"
      - "data/campfire-archive.json"
      - "test/campfire-page.test.js"
      - "campfire-interactions.js"
      - "campfire-sparks-to-steps.js"
      - "campfire-privacy.html"
      - "api/_security/campfire-handler.js"
      - "db/migrations/20261106_campfire_interactions.sql"
      - "api/publish-route.js"
      - "vercel.json"
      - "package.json"
      - "scripts/campfire-production-migrate.js"
      - "test/campfire-production-migrate.test.js"
      - ".github/workflows/campfire-showcase.yml"
  pull_request:
    paths:
      - "yhzd.html"
      - "campfire.css"
      - "campfire.js"
      - "data/campfire-archive.json"
      - "test/campfire-page.test.js"
      - "campfire-interactions.js"
      - "campfire-sparks-to-steps.js"
      - "campfire-privacy.html"
      - "api/_security/campfire-handler.js"
      - "db/migrations/20261106_campfire_interactions.sql"
      - "api/publish-route.js"
      - "vercel.json"
      - "package.json"
      - "scripts/campfire-production-migrate.js"
      - "test/campfire-production-migrate.test.js"
      - ".github/workflows/campfire-showcase.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate campfire JavaScript
        run: node --check campfire.js
      - name: Validate interaction JavaScript
        run: node --check campfire-interactions.js && node --check api/_security/campfire-handler.js
      - name: Validate Sparks to Steps JavaScript
        run: node --check campfire-sparks-to-steps.js
      - name: Run campfire regression suite
        run: node --test test/campfire-page.test.js test/campfire-production-migrate.test.js
