name: Leader Route Architecture

on:
  push:
    paths:
      - "test/leader-route-architecture.test.js"
      - "test/public-route-projection-regression.test.js"
      - "test/calendar-data-sync.test.js"
      - "scripts/sync-calendar-events.js"
      - "api/_security/auth.js"
      - "api/auth/login.js"
      - "api/auth/session.js"
      - "api/routes.js"
      - "api/publish-route-v2.js"
      - "api/upload-route-image.js"
      - "api/_security/route-image.js"
      - "tent.html"
      - ".github/workflows/leader-route-architecture.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run leader route architecture tests
        run: node --test test/leader-route-architecture.test.js
      - name: Run public route projection regression tests
        run: node --test test/public-route-projection-regression.test.js
      - name: Run calendar data sync tests
        run: node --test test/calendar-data-sync.test.js
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run full test suite
        run: npm test
