name: Apply Historical Calendar Steps Once

on:
  push:
    paths:
      - ".github/workflows/apply-historical-calendar-steps-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add approved historical markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('budao-calendar.js')
          js = js_path.read_text()
          old_schedule = '''  const stepSchedule = {
            "2026-09-19": ["budao"]
          };'''
          new_schedule = '''  const stepSchedule = {
            "2026-09-04": ["fellowship"],
            "2026-09-05": ["budao", "pioneer"],
            "2026-09-11": ["pioneer"],
            "2026-09-12": ["budao"],
            "2026-09-13": ["budao"],
            "2026-09-19": ["budao"]
          };'''
          if old_schedule not in js:
              raise SystemExit('expected stepSchedule block not found')
          js_path.write_text(js.replace(old_schedule, new_schedule, 1))

          css_path = Path('budao-calendar.css')
          css = css_path.read_text()
          pattern = re.compile(r'(\.budao-calendar-step-mark--budao\{\s*)background-image:url\("(?P<data>data:image/png;base64,[^"]+)"\);(\s*\})')
          match = pattern.search(css)
          if not match:
              raise SystemExit('approved Budao footprint PNG rule not found')

          data = match.group('data')
          replacement = match.group(1) + 'background-image:var(--budao-step-shape);' + match.group(3)
          css = pattern.sub(replacement, css, count=1)
          css = ':root{\n    --budao-step-shape:url("' + data + '");\n}\n\n' + css

          variants = '''
.budao-calendar-step-mark--pioneer,
.budao-calendar-step-mark--fellowship{
    background-image:none;
    -webkit-mask-image:var(--budao-step-shape);
    mask-image:var(--budao-step-shape);
    -webkit-mask-position:center;
    mask-position:center;
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-size:contain;
    mask-size:contain;
}

.budao-calendar-step-mark--pioneer{
    background-color:#D89A08;
}

.budao-calendar-step-mark--fellowship{
    background-color:#8B56C7;
}
'''
          css_path.write_text(css.rstrip() + '\n\n' + variants)
          PY

      - name: Run calendar regression tests
        run: node --test test/calendar-strip.test.js

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "budao-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-historical-calendar-steps-once.yml
          git add budao-calendar.js budao-calendar.css
          git commit -m "feat(calendar): add approved historical step markers [skip ci]"
          git push origin main
