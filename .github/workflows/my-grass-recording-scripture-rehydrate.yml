name: My Grass recording scripture rehydrate fix

on:
  push:
    branches:
      - feat/my-grass-cuv-shen-bible-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Apply root fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pasture-preview/my-grass-reading-v1.js')
          s=p.read_text()
          replacements=[
            ("let timer=null,lastStageKey='',lastReaderSignature='';",
             "let timer=null,lastStageKey='',lastReaderSignature='',lastReaderNode=null;"),
            ("if(reader&&activeChapter&&signature!==lastReaderSignature){reader.innerHTML=activeChapter.verses.map(verseMarkup).join('');lastReaderSignature=signature}",
             "if(reader&&activeChapter&&(reader!==lastReaderNode||signature!==lastReaderSignature)){reader.innerHTML=activeChapter.verses.map(verseMarkup).join('');lastReaderSignature=signature;lastReaderNode=reader}"),
            ("if(key!==lastStageKey){lastStageKey=key;activeChapter=null;chapterKey='';hydrateChapter()}\n  }",
             "if(key!==lastStageKey){lastStageKey=key;activeChapter=null;chapterKey='';hydrateChapter()}\n   if(activeChapter)renderReader();\n  }"),
            ("session=null;activeChapter=null;chapterKey='';lastStageKey='';lastReaderSignature='';C.setRuntimeReadingSession(null);",
             "session=null;activeChapter=null;chapterKey='';lastStageKey='';lastReaderSignature='';lastReaderNode=null;C.setRuntimeReadingSession(null);")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('reading replacement target missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('test/my-grass-reading-session.test.js')
          text=t.read_text()
          marker="test('scripture reader survives a reading-stage DOM rebuild during microphone recording'"
          if marker not in text:
              text += """

test('scripture reader survives a reading-stage DOM rebuild during microphone recording',()=>{
 const ui=fs.readFileSync(path.join(__dirname,'..','pasture-preview','my-grass-reading-v1.js'),'utf8');
 assert.match(ui,/reader!==lastReaderNode\\|\\|signature!==lastReaderSignature/);
 assert.match(ui,/lastReaderNode=reader/);
 assert.match(ui,/function enhanceReadingStage\\(\\)[\\s\\S]*if\\(activeChapter\\)renderReader\\(\\)/);
});
"""
          t.write_text(text)
          PY

      - name: Verify fix
        run: |
          node --test test/my-grass-reading-session.test.js test/my-grass-recording-v13.test.js
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add pasture-preview/my-grass-reading-v1.js test/my-grass-reading-session.test.js
          git rm .github/workflows/my-grass-recording-scripture-rehydrate.yml
          git commit -m 'fix(my-grass): keep scripture visible while recording'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
