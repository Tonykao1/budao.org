name: Sky Color Fallback

on:
  push:
    branches:
      - feature/pasture-sky-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pasture-sky-engine-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch neutral fallback exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'tonglu.html':(
              "const warm=Number(star.colorIndex)>0.65,cool=Number(star.colorIndex)<0.05;",
              "const ci=Number(star.colorIndex),warm=Number.isFinite(ci)&&ci>0.65,cool=Number.isFinite(ci)&&ci<-.05;"
            ),
            'tonglu-pasture-portrait.html':(
              "const warm=Number(star.colorIndex)>0.65,cool=Number(star.colorIndex)<0.05,col=warm?'#fff1c8':cool?'#e7f4ff':'#f5f7f2';",
              "const ci=Number(star.colorIndex),warm=Number.isFinite(ci)&&ci>0.65,cool=Number.isFinite(ci)&&ci<-.05,col=warm?'#fff1c8':cool?'#e7f4ff':'#f5f7f2';"
            )
          }
          for name,(old,new) in replacements.items():
              p=Path(name); s=p.read_text()
              if new in s:
                  continue
              if s.count(old)!=1:
                  raise SystemExit(f'{name}: expected one color fallback anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Run focused sky tests
        run: node --test test/pasture-sky-engine.test.js test/pasture-sky-integration.test.js
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No color fallback changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tonglu.html tonglu-pasture-portrait.html
          git commit -m "fix: keep unknown star color neutral"
          git push origin HEAD:feature/pasture-sky-engine-v1
