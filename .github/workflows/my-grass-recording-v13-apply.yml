name: My Grass V1.3 recording restore

on:
  push:
    branches:
      - feat/my-grass-cuv-shen-bible-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/my-grass-cuv-shen-bible-v1
          fetch-depth: 1

      - name: Restore approved V1.3 recording controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('pasture-preview/my-grass-v1.js')
          s=p.read_text()
          s=s.replace("let recorder=null,recordStream=null,recordChunks=[],recordStart=0,recordLimit=null,activeAudioURL=null;","let recorder=null,recordStream=null,recordChunks=[],recordStart=0,recordLimit=null,activeAudioURL=null,activePlayer=null;")
          old="""  function saveEntry(){\n   if(audioPending||recorder?.state==='recording'){tell('请先结束录音，再保存对应的经文与声音。');return null}\n   const previous=getEntry(),input={scripture:draft.scripture,reflection:draft.reflection,reading:draft.reading};"""
          new="""  function saveEntry(){\n   if(audioPending||recorder?.state==='recording'){tell('请先结束录音，再保存对应的经文与声音。');return null}\n   if(draft.reading.audioId&&!draft.scripture.verifiedAgainstRecording){tell('这次原声还没有与经文建立绑定。请先按右侧链接键。');return null}\n   const previous=getEntry(),input={scripture:draft.scripture,reflection:draft.reflection,reading:draft.reading};"""
          if old not in s: raise SystemExit('saveEntry target missing')
          s=s.replace(old,new,1)
          pat=r"  function stageReading\(\)\{[\s\S]*?\n  \}\n  function stageReflection\(\)\{"
          replacement=r'''  function recordingSelectionReady(){
           const badge=$('#gsReadingDoneBadge');
           return !!(C.trim(draft.scripture.reference)&&badge&&!badge.hidden);
          }
          function recorderUiState(){
           if(recorder?.state==='recording')return 'recording';
           if(draft.reading.audioId&&draft.scripture.verifiedAgainstRecording)return activePlayer&&!activePlayer.paused&&!activePlayer.ended?'playing':'linked';
           if(draft.reading.audioId)return 'recorded';
           return 'idle';
          }
          function recorderStatusText(){
           const state=recorderUiState();
           if(state==='recording')return 'REC · 正在录制本人朗读';
           if(state==='playing')return 'PLAY · 正在回听';
           if(state==='linked')return 'LINKED · 已与 '+escape(draft.scripture.reference)+' 绑定';
           if(state==='recorded')return 'RECORDED · 请按右侧链接键';
           return 'READY · 先完成左侧经文阅读';
          }
          function stageReading(){
           const barHeights=Array.from({length:22},(_,i)=>10+Math.round(Math.abs(Math.sin(i*1.41)*Math.cos(i*.53))*46));
           const state=recorderUiState(),hasAudio=!!draft.reading.audioId,linked=!!draft.scripture.verifiedAgainstRecording;
           const recordDisabled=audioPending||hasAudio;
           const playDisabled=!hasAudio||!linked;
           const rerecordDisabled=!hasAudio;
           const linkDisabled=!hasAudio||linked;
           return '<div class="gs-grid"><section class="gs-panel" aria-label="圣经文字">'+
            '<div class="gs-scripture-heading"><div class="gs-scripture-titlecluster"><h3>今日经文</h3>'+
            '<input class="gs-scripture-reference" data-field="reference" maxlength="96" aria-label="经文出处" value="'+escape(draft.scripture.reference)+'"></div>'+
            '<div class="gs-scripture-controls"><button class="gs-action secondary gs-scripture-nav-button" type="button" data-action="scripture-nav" aria-label="旧约新约、书卷和章节导航">选经文</button>'+
            '<input data-field="translation" maxlength="64" value="'+escape(draft.scripture.translation)+'" hidden></div></div>'+
            '<textarea data-field="scriptureText" maxlength="10000" hidden>'+escape(draft.scripture.text)+'</textarea></section>'+
            '<section class="gs-panel gs-recording-panel" aria-label="个人原声朗读"><h3>我的朗读</h3>'+
            '<div class="gs-recorder-console" data-state="'+state+'">'+
              '<div class="gs-recorder-deck"><div class="gs-recorder-brand"><strong>ORIGINAL VOICE</strong><span>LOCAL RECORDER</span></div>'+
               '<div class="gs-recorder-keys">'+
                '<button class="gs-recorder-key gs-recorder-record" type="button" data-action="record" '+(recordDisabled?'disabled':'')+' aria-label="'+(recorder?.state==='recording'?'停止录音':'开始录音')+'"><span class="gs-recorder-key-icon">'+(recorder?.state==='recording'?'■':'●')+'</span><span>'+(recorder?.state==='recording'?'停止':'录音')+'</span></button>'+
                '<button class="gs-recorder-key" type="button" data-action="play" '+(playDisabled?'disabled':'')+' aria-label="播放或暂停本人原声"><span class="gs-recorder-key-icon">▶Ⅱ</span><span>播放/暂停</span></button>'+
                '<button class="gs-recorder-key" type="button" data-action="rerecord" '+(rerecordDisabled?'disabled':'')+' aria-label="放弃当前录音并重录"><span class="gs-recorder-key-icon">↻</span><span>重录</span></button>'+
               '</div></div>'+
              '<div class="gs-recorder-display"><div class="gs-recorder-screen" id="gsRecorderScreen" data-state="'+state+'">'+
                '<div class="gs-recorder-wave" aria-hidden="true">'+barHeights.map((v,i)=>'<span style="--h:'+v+'%;--i:'+i+'"></span>').join('')+'</div>'+
                '<div class="gs-recorder-status" id="gsRecorderStatus">'+recorderStatusText()+'</div></div>'+
               '<button class="gs-recorder-link" type="button" data-action="link-audio" '+(linkDisabled?'disabled':'')+' aria-label="把本人原声与当前经文建立绑定" title="链接经文与本人原声">🔗</button></div>'+
            '</div>'+
            '<div id="gsAudioHost" class="gs-audio-host" aria-live="polite"></div>'+
            '<p class="gs-recorder-note">'+(linked?'原声已与当前经文绑定，可以回听。':hasAudio?'录音已经保存在本机；先链接经文，再回听。':'选定并完成左侧经文后，按实体录音键开始。')+'</p>'+
            '<div class="gs-rule"></div><div class="gs-actions">'+
            '<button class="gs-action" type="button" data-action="save">留下领受</button>'+
            '<button class="gs-action secondary" type="button" data-action="next-reflection">继续默想 →</button></div></section></div>';
          }
          function stageReflection(){'''
          s,n=re.subn(pat,replacement,s,count=1)
          if n!=1: raise SystemExit(f'stageReading replace count {n}')
          s=s.replace("function clearPlayer(){if(activeAudioURL){URL.revokeObjectURL(activeAudioURL);activeAudioURL=null}}","function clearPlayer(){\n   try{activePlayer?.pause?.()}catch(_){}\n   activePlayer=null;\n   if(activeAudioURL){URL.revokeObjectURL(activeAudioURL);activeAudioURL=null}\n  }")
          pat=r"  async function restoreAudio\(id\)\{[\s\S]*?\n  \}\n  async function startOrStopRecording\(\)\{"
          replacement=r'''  async function restoreAudio(id){
           const host=$('#gsAudioHost');if(!host||!id)return null;
           try{
            const blob=await getAudio(id);
            if(!$('#gsAudioHost'))return null;
            if(!blob){host.textContent='本机没有找到对应原声。请重新录制。';return null}
            clearPlayer();activeAudioURL=URL.createObjectURL(blob);
            const player=document.createElement('audio');player.preload='metadata';player.src=activeAudioURL;player.hidden=true;player.dataset.audioId=id;
            activePlayer=player;host.replaceChildren(player);
            const sync=()=>{
             const state=player.ended||player.paused?'linked':'playing';
             const consoleNode=$('.gs-recorder-console'),screen=$('#gsRecorderScreen'),status=$('#gsRecorderStatus');
             if(consoleNode)consoleNode.dataset.state=state;if(screen)screen.dataset.state=state;
             if(status)status.textContent=state==='playing'?'PLAY · 正在回听':'LINKED · 已与 '+draft.scripture.reference+' 绑定';
            };
            player.addEventListener('play',sync);player.addEventListener('pause',sync);player.addEventListener('ended',sync);
            return player;
           }catch(e){host.textContent='无法读取本机原声：'+String(e.message||e);return null}
          }
          async function deleteAudio(id){
           if(!id)return;
           const db=await audioDatabase();
           try{return await new Promise((resolve,reject)=>{
            const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').delete(id);
            tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
           })}finally{db.close()}
          }
          async function togglePlayback(){
           if(!draft.reading.audioId){tell('还没有可回听的本人原声。');return}
           if(!draft.scripture.verifiedAgainstRecording){tell('请先按右侧链接键，把本人原声与当前经文链接后再回听。');return}
           let player=activePlayer;
           if(!player||player.dataset.audioId!==draft.reading.audioId)player=await restoreAudio(draft.reading.audioId);
           if(!player)return;
           if(player.paused||player.ended){if(player.ended)player.currentTime=0;await player.play().catch(()=>{})}
           else player.pause();
          }
          function linkRecording(){
           if(!draft.reading.audioId){tell('请先完成一次本人原声录音。');return}
           const reference=C.trim(draft.scripture.reference);
           if(!reference){tell('请先选择左侧经文。');return}
           if(!window.confirm('确认将这次本人原声与「'+reference+'」建立绑定吗？绑定后才能回听。'))return;
           draft.scripture.verifiedAgainstRecording=true;persistDraft();render();tell('已建立经文与本人原声的绑定，可以回听。');
          }
          async function rerecordAudio(){
           if(!draft.reading.audioId){await startOrStopRecording();return}
           if(!window.confirm('确定放弃这次录音并重新录制吗？当前这份原声会从本机删除。'))return;
           const oldId=draft.reading.audioId;clearPlayer();
           try{await deleteAudio(oldId)}catch(e){tell('旧录音清理失败，请稍后再试。');return}
           draft.reading={audioId:null,mimeType:null,size:0,durationSeconds:0};
           draft.scripture.verifiedAgainstRecording=false;persistDraft();
           tell('旧录音已放弃，准备重新录制。');await startOrStopRecording();
          }
          async function startOrStopRecording(){'''
          s,n=re.subn(pat,replacement,s,count=1)
          if n!=1: raise SystemExit(f'audio block replace count {n}')
          old="""  async function startOrStopRecording(){\n   if(recorder?.state==='recording'){recorder.stop();return}\n   if(audioPending)return;\n   if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){tell('当前浏览器不支持麦克风录音。仍可保存文字；建议换用支持录音的浏览器。');return}"""
          new="""  async function startOrStopRecording(){\n   if(recorder?.state==='recording'){recorder.stop();return}\n   if(audioPending)return;\n   if(draft.reading.audioId){tell('已经有一份录音；如要替换，请使用「↻ 重录」。');return}\n   if(!recordingSelectionReady()){tell('请先完成左侧经文的阅读选择，再开始录音。');return}\n   if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){tell('当前浏览器不支持麦克风录音。仍可保存文字；建议换用支持录音的浏览器。');return}"""
          if old not in s: raise SystemExit('start guard target missing')
          s=s.replace(old,new,1)
          s=s.replace("tell('原声已保存在本机，请回听并核对经文文字，再保存本次领受。');","tell('录音完成并保存在本机。请按右侧链接键，与当前经文建立绑定后再回听。');",1)
          s=s.replace("case 'play':await restoreAudio(draft.reading.audioId);$('#gsAudioHost audio')?.play?.().catch(()=>{});break;","case 'play':await togglePlayback();break;\n    case 'rerecord':await rerecordAudio();break;\n    case 'link-audio':linkRecording();break;",1)
          s=s.replace("""  root.addEventListener('change',e=>{\n   if(e.target.dataset.field==='audioVerified'){\n    draft.scripture.verifiedAgainstRecording=!!e.target.checked&&!!draft.reading.audioId;persistDraft();\n   }\n  });\n""","",1)
          s=s.replace("if(tab==='reading'&&!archiveOpen&&draft.reading.audioId)restoreAudio(draft.reading.audioId);","if(tab==='reading'&&!archiveOpen&&draft.reading.audioId&&draft.scripture.verifiedAgainstRecording)restoreAudio(draft.reading.audioId);",1)
          p.write_text(s)

          css=Path('pasture-preview/my-grass-immersive-v04.css')
          style=css.read_text()
          marker='/* 我的牧草 V1.3 · 右页复古随身录音机控制台（已定稿录音部分） */'
          if marker in style: raise SystemExit('recorder css already present')
          style += r'''

/* 我的牧草 V1.3 · 右页复古随身录音机控制台（已定稿录音部分） */
#grassWorkspace .gs-recording-panel{display:flex;flex-direction:column;min-height:0}
#grassWorkspace .gs-recorder-console{
 display:grid;grid-template-columns:minmax(0,.88fr) minmax(190px,1.12fr);gap:9px;
 padding:10px;margin:2px 0 7px;border:3px solid #6d573c;
 background:linear-gradient(145deg,#d6bc88 0,#b69768 48%,#8d714f 100%);
 box-shadow:inset 2px 2px rgba(255,239,198,.55),inset -3px -3px rgba(72,48,29,.22),4px 5px rgba(70,46,28,.16);
 color:#3d2b1c;
}
#grassWorkspace .gs-recorder-deck{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
#grassWorkspace .gs-recorder-brand{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid rgba(77,53,31,.38);padding:1px 2px 5px;font:800 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:#4c3724}
#grassWorkspace .gs-recorder-brand span{font-weight:600;letter-spacing:.05em;opacity:.72}
#grassWorkspace .gs-recorder-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
#grassWorkspace .gs-recorder-key{
 min-width:0;min-height:58px;padding:6px 4px;border:2px solid #55422f;border-radius:2px;
 background:linear-gradient(#e5d4ac,#b5976d);color:#39291d;
 box-shadow:inset 1px 1px rgba(255,246,218,.72),inset -2px -2px rgba(77,54,35,.20),0 3px 0 #5e4934;
 font:800 10px/1.2 "PingFang SC",system-ui,sans-serif;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
#grassWorkspace .gs-recorder-key:not(:disabled):active{transform:translateY(2px);box-shadow:inset 1px 1px rgba(255,246,218,.62),0 1px 0 #5e4934}
#grassWorkspace .gs-recorder-key:disabled{opacity:.42;cursor:not-allowed}
#grassWorkspace .gs-recorder-key-icon{font:900 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.12em}
#grassWorkspace .gs-recorder-record .gs-recorder-key-icon{color:#7f3e2f}
#grassWorkspace .gs-recorder-display{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:7px;min-width:0;align-items:stretch}
#grassWorkspace .gs-recorder-screen{
 min-height:90px;padding:9px 8px 7px;border:3px solid #4c4434;
 background:linear-gradient(180deg,#636b55,#4d5746);box-shadow:inset 3px 3px rgba(29,35,28,.36),inset -2px -2px rgba(219,220,171,.10);
 display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
}
#grassWorkspace .gs-recorder-wave{height:51px;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden}
#grassWorkspace .gs-recorder-wave span{display:block;width:4px;height:var(--h);min-height:4px;max-height:100%;background:#d5d29a;opacity:.68;box-shadow:1px 0 rgba(37,48,33,.30)}
#grassWorkspace .gs-recorder-status{font:700 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:#ece6bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#grassWorkspace .gs-recorder-link{
 min-height:90px;border:2px solid #55422f;background:linear-gradient(#d7c49b,#9f835d);box-shadow:inset 1px 1px rgba(255,244,213,.65),0 3px 0 #5e4934;
 font-size:19px;cursor:pointer;color:#44311f;
}
#grassWorkspace .gs-recorder-link:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #5e4934}
#grassWorkspace .gs-recorder-link:disabled{opacity:.36;cursor:not-allowed}
#grassWorkspace .gs-recorder-console[data-state="recording"] .gs-recorder-screen{background:linear-gradient(180deg,#685a48,#57463b)}
#grassWorkspace .gs-recorder-console[data-state="recording"] .gs-recorder-wave span{animation:gsRecorderPulse .58s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -31ms);opacity:.92}
#grassWorkspace .gs-recorder-console[data-state="playing"] .gs-recorder-wave span{animation:gsRecorderPulse .78s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -23ms)}
#grassWorkspace .gs-recorder-console[data-state="linked"] .gs-recorder-link{opacity:.72}
#grassWorkspace .gs-audio-host{height:0;overflow:hidden;margin:0;padding:0}
#grassWorkspace .gs-recorder-note{margin:3px 2px 8px;font:500 11px/1.55 "PingFang SC",system-ui,sans-serif;color:#72563b}
@keyframes gsRecorderPulse{from{transform:scaleY(.42)}to{transform:scaleY(1)}}
@media(max-width:1100px){
 #grassWorkspace .gs-recorder-console{grid-template-columns:1fr;gap:8px}
 #grassWorkspace .gs-recorder-display{grid-template-columns:minmax(0,1fr) 40px}
 #grassWorkspace .gs-recorder-screen,#grassWorkspace .gs-recorder-link{min-height:78px}
 #grassWorkspace .gs-recorder-wave{height:42px}
}
@media(max-width:820px){
 #grassWorkspace .gs-recorder-console{padding:8px}
 #grassWorkspace .gs-recorder-key{min-height:52px}
}
'''
          css.write_text(style)

          test=Path('test/my-grass-recording-v13.test.js')
          test.write_text(r'''const {test}=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs'),path=require('node:path');
const base=path.join(__dirname,'..','pasture-preview');
const app=()=>fs.readFileSync(path.join(base,'my-grass-v1.js'),'utf8');
const css=()=>fs.readFileSync(path.join(base,'my-grass-immersive-v04.css'),'utf8');

test('V1.3 recording restores the compact physical recorder console instead of generic form buttons',()=>{
 const src=app();
 assert.match(src,/gs-recorder-console/);
 assert.match(src,/gs-recorder-key[\s\S]*data-action="record"/);
 assert.match(src,/data-action="play"[\s\S]*播放\/暂停/);
 assert.match(src,/data-action="rerecord"[\s\S]*重录/);
 assert.match(src,/gs-recorder-screen/);
 assert.match(src,/data-action="link-audio"/);
 assert.doesNotMatch(src,/data-field="audioVerified"/);
 assert.doesNotMatch(src,/gs-voice-mark/);
});

test('recording cannot start until the scripture reading selection is explicitly completed',()=>{
 const src=app();
 assert.match(src,/function recordingSelectionReady\(\)/);
 assert.match(src,/gsReadingDoneBadge/);
 assert.match(src,/if\(!recordingSelectionReady\(\)\)[\s\S]{0,220}请先完成左侧经文的阅读选择/);
});

test('recorded audio must be linked to the selected scripture before playback or save',()=>{
 const src=app();
 assert.match(src,/function linkRecording\(/);
 assert.match(src,/confirm\([\s\S]{0,220}建立绑定/);
 assert.match(src,/verifiedAgainstRecording=true/);
 assert.match(src,/function togglePlayback\(/);
 assert.match(src,/if\(!draft\.scripture\.verifiedAgainstRecording\)[\s\S]{0,220}先.*链接/);
 assert.match(src,/function saveEntry\([\s\S]*draft\.reading\.audioId&&!draft\.scripture\.verifiedAgainstRecording/);
});

test('re-recording has a remorse confirmation and clears the previous binding',()=>{
 const src=app();
 assert.match(src,/function rerecordAudio\(/);
 assert.match(src,/confirm\([\s\S]{0,220}放弃这次录音/);
 assert.match(src,/deleteAudio\(/);
 assert.match(src,/verifiedAgainstRecording=false/);
});

test('physical recorder styling stays compact and uses a screen-plus-key layout',()=>{
 const style=css();
 assert.match(style,/\.gs-recorder-console\{/);
 assert.match(style,/\.gs-recorder-keys\{/);
 assert.match(style,/\.gs-recorder-key\{/);
 assert.match(style,/\.gs-recorder-screen\{/);
 assert.match(style,/\.gs-recorder-link\{/);
 assert.match(style,/data-state="recording"/);
});
''')

          pkg=Path('package.json')
          data=json.loads(pkg.read_text())
          if 'test/my-grass-recording-v13.test.js' not in data['scripts']['build']:
              data['scripts']['build']=data['scripts']['build'].replace('test/my-grass-reading-session.test.js','test/my-grass-reading-session.test.js test/my-grass-recording-v13.test.js')
          if 'pasture-preview/my-grass-v1.js' not in data['scripts']['lint']:
              data['scripts']['lint'] += ' && node --check pasture-preview/my-grass-v1.js'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Verify restored recording flow
        run: |
          node --test test/my-grass-recording-v13.test.js
          npm run build
          npm run lint
          node --test --test-name-pattern='Hobby deployment stays within twelve' test/vercel-function-budget.test.js
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add package.json pasture-preview/my-grass-v1.js pasture-preview/my-grass-immersive-v04.css test/my-grass-recording-v13.test.js
          git rm .github/workflows/my-grass-recording-v13-apply.yml
          git commit -m 'fix(my-grass): restore V1.3 recording controls'
          git push origin HEAD:feat/my-grass-cuv-shen-bible-v1
