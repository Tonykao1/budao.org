name: Route Calendar Regression

on:
  push:
    paths:
      - "test/calendar-strip.test.js"
      - "budao-calendar.js"
      - "budao-calendar.css"
      - "test.html"
      - ".github/workflows/calendar-strip-regression.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run calendar contract
        run: node --test test/calendar-strip.test.js
