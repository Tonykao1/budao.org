<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>万物同颂 · 24首预览</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#182b24;color:#f7f4e9;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:25px;font-weight:600;margin:0}small,p{color:#c4d1c5}p{margin:8px 0 12px}.stage{margin:16px auto;background:#9fe8ff;overflow:hidden;border-radius:12px;aspect-ratio:16/10;width:100%;position:relative}.stage.portrait{aspect-ratio:9/16;max-width:390px}.stage iframe{width:100%;height:100%;border:0;display:block}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #758c7d;color:#f7f4e9;background:#294337;border-radius:7px;padding:10px 13px}button:hover,button:focus-visible{background:#3c5b47}button.primary{background:#d6e3b8;color:#182b24;border-color:#d6e3b8;font-weight:700}button:disabled{opacity:.5}select{flex:1;min-width:180px}label{font-size:13px;display:flex;align-items:center;gap:6px}input{accent-color:#d6e3b8}.progress{width:100%;height:6px;accent-color:#c5df9b;margin-top:12px}.status{font-variant-numeric:tabular-nums;min-height:1.5em}.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px;margin-top:10px}.tracks button{text-align:left;font-size:13px}.tracks button[aria-current=true]{outline:2px solid #d6e3b8}.heading{color:#d6e3b8;font-size:13px;letter-spacing:.12em}.foot{font-size:12px;color:#a9bdad}@media(max-width:560px){main{padding:12px}.controls button{padding:9px}.stage{border-radius:6px}}
</style></head><body><main><header><div><div class="heading">BUDAO · 数字牧场 · 独立预览</div><h1>万物同颂 · 全员整点编队 V3</h1><p>All Creation Praises · 24个整点编排 · 12首原整点圣诗 · 半点照常播放、不编队</p></div><button id="layout">切换竖屏</button></header>
<div class="stage" id="stage"><iframe src="/praise-preview-core.html" title="牧场预览"></iframe></div>
<div class="controls"><select id="song" aria-label="选择赞美诗"></select><button class="primary" id="play">播放</button><button id="stop">停止</button><button id="prev">上一首</button><button id="next">下一首</button><label><input type="checkbox" id="full">完整节数</label><label><input type="checkbox" id="auto">连续试听</label><label>音量<input type="range" id="volume" min="0" max="100" value="32"></label></div>
<p class="heading" id="formation">队形：等待播放</p><progress class="progress" id="progress" value="0" max="1"></progress><p class="status" id="status" role="status">请选择一首赞美诗，再点击播放。默认试听一节，可切换完整节数。</p>
<div class="heading">24个整点 · 点击即试听</div><div class="tracks" id="tracks"></div><p class="foot">预览不注册居民、不更改正式牧场设置、不触发整点或半点报时。全员参与；卧姿羊起立，结束恢复初始位置和姿态。队形按牧场地形分区适配，不强行穿越河道。实际音色采用原时辰赞美合成器。</p>
</main><script src="/pasture-hourly-scores.js"></script><script src="/pasture-hourly-last-score.js"></script><script src="/pasture-half-hour-scores.js"></script><script src="/pasture-hourly-hymns.js"></script><script src="/praise-preview-motion.js?v=3.1"></script><script>
'use strict';
const $=id=>document.getElementById(id),api=window.BudaoHourlyHymns,motion=window.BudaoPraisePreview;
const songs=Array.from({length:24},(_,h)=>window.BudaoPastureHymnScores[h%12]);
const models=songs.map((s,i)=>motion.prepare(s,api,i));let ctx=null,active=null,serial=0,idx=0;const scenes=new Map();
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const clock=()=>{if(!ctx)return 0;const ts=ctx.getOutputTimestamp?.();return ts&&ts.performanceTime>0?Math.min(ctx.currentTime,ts.contextTime+Math.max(0,performance.now()-ts.performanceTime)/1000):Math.max(0,ctx.currentTime-(ctx.outputLatency||0))};
window.__budaoPreviewLayout=(mode,W,H,layout)=>{
 const sig=W+'|'+H+'|'+layout.map(o=>o.id+':'+o.x.toFixed(1)+','+o.y.toFixed(1)+','+o.s.toFixed(2)+','+(o.rest?1:0)).join(';');
 if(scenes.get(mode)?.sig===sig)return;
 scenes.set(mode,{sig,layout,g:{mode,W,H,minY:mode==='portrait'?Math.round(H*.405)+8:155},plans:new Map()});
};
function getPlan(mode,hour){const s=scenes.get(mode);if(!s)return null;if(!s.plans.has(hour))s.plans.set(hour,motion.build(s.layout,s.g,hour));return s.plans.get(hour)}
window.__budaoPreviewMotion=(x,y,id,rest,scale,mode='landscape')=>{if(!active||ctx?.state!=='running')return null;const elapsed=clock()-active.at;if(elapsed<0||elapsed>=active.duration)return null;const model=models[active.idx],plan=getPlan(mode,active.idx);return motion.motion(model,elapsed,active.duration,plan,id)};
function select(i){idx=(i+songs.length)%songs.length;$('song').value=String(idx);document.querySelectorAll('#tracks button').forEach((b,j)=>b.setAttribute('aria-current',String(j===idx)))}
function clearActive(){const a=active;active=null;if(a){try{a.source.stop()}catch(e){}try{a.source.disconnect();a.gain.disconnect()}catch(e){}}}
function stop(){serial++;clearActive();$('formation').textContent='队形：归回日常分布';$('progress').value=0;$('status').textContent='已停止 · 羊群恢复原来的状态';$('play').disabled=false}
async function play(i){const run=++serial;clearActive();select(i);$('progress').value=0;$('play').disabled=true;$('status').textContent='正在准备 '+songs[idx].zh+'…';try{
 const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)throw Error('浏览器不支持音频');if(!ctx)ctx=new Ctor({sampleRate:32000});await ctx.resume();if(run!==serial)return;
 const j=idx,s=songs[j],mode=$('stage').classList.contains('portrait')?'portrait':'landscape';const plan=getPlan(mode,j);if(!plan||plan.count!==44)throw Error('羊群布局尚未就绪，请再试一次');const buffer=api.renderOnePass(ctx,s),source=ctx.createBufferSource(),gain=ctx.createGain(),duration=models[j].cycle*($('full').checked?s.stanzas:1);
 source.buffer=buffer;source.loop=true;source.connect(gain);gain.connect(ctx.destination);const at=ctx.currentTime+.09;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(Number($('volume').value)/100,at+.08);source.start(at);source.stop(at+duration);active={idx:j,at,duration,source,gain};
 source.onended=()=>{if(active?.source!==source)return;clearActive();$('formation').textContent='队形：已恢复初始分布';$('progress').value=1;$('status').textContent=s.zh+' · 结束';if($('auto').checked)play((j+1)%songs.length)};
 }catch(e){if(run===serial){clearActive();$('status').textContent='无法试听：'+e.message}}finally{if(run===serial)$('play').disabled=false}}
songs.forEach((s,i)=>{const name=String(i).padStart(2,'0')+':00 · '+s.zh+' · '+motion.program(i).name;const o=document.createElement('option');o.value=i;o.textContent=name;$('song').append(o);const b=document.createElement('button');b.textContent=name;b.onclick=()=>play(i);$('tracks').append(b)});
$('song').onchange=()=>{stop();select(Number($('song').value))};$('play').onclick=()=>play(idx);$('stop').onclick=stop;$('prev').onclick=()=>play((idx+23)%24);$('next').onclick=()=>play((idx+1)%24);$('volume').oninput=()=>{if(active)active.gain.gain.setTargetAtTime(Number($('volume').value)/100,ctx.currentTime,.04)};$('layout').onclick=()=>{const p=$('stage').classList.toggle('portrait');$('layout').textContent=p?'切换横屏':'切换竖屏'};window.addEventListener('pagehide',stop);
function update(){if(active){const t=Math.max(0,clock()-active.at);$('progress').value=Math.min(1,t/active.duration);const c=motion.cue(models[active.idx],t,active.duration),mode=$('stage').classList.contains('portrait')?'portrait':'landscape',plan=getPlan(mode,active.idx);$('formation').textContent=c.stage+' · '+(plan?plan.program.name+' · '+plan.count+'/44 只参与 · '+plan.moving+' 只换位':'等待画面布局');$('status').textContent=songs[active.idx].zh+' · '+fmt(t)+' / '+fmt(active.duration)+' · '+(models[active.idx].voices.length===4?'四声部':'双声部')+(ctx.state==='running'?'':' · 音频暂停')}requestAnimationFrame(update)}select(0);update();
</script></body></html>
