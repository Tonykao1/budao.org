<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>万物同颂 · 24首预览</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#182b24;color:#f7f4e9;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:25px;font-weight:600;margin:0}small,p{color:#c4d1c5}p{margin:8px 0 12px}.stage{margin:16px auto;background:#9fe8ff;overflow:hidden;border-radius:12px;aspect-ratio:16/10;width:100%;position:relative}.stage.portrait{aspect-ratio:9/16;max-width:390px}.stage iframe{width:100%;height:100%;border:0;display:block}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #758c7d;color:#f7f4e9;background:#294337;border-radius:7px;padding:10px 13px}button:hover,button:focus-visible{background:#3c5b47}button.primary{background:#d6e3b8;color:#182b24;border-color:#d6e3b8;font-weight:700}button:disabled{opacity:.5}select{flex:1;min-width:180px}label{font-size:13px;display:flex;align-items:center;gap:6px}input{accent-color:#d6e3b8}.progress{width:100%;height:6px;accent-color:#c5df9b;margin-top:12px}.status{font-variant-numeric:tabular-nums;min-height:1.5em}.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px;margin-top:10px}.tracks button{text-align:left;font-size:13px}.tracks button[aria-current=true]{outline:2px solid #d6e3b8}.heading{color:#d6e3b8;font-size:13px;letter-spacing:.12em}.foot{font-size:12px;color:#a9bdad}@media(max-width:560px){main{padding:12px}.controls button{padding:9px}.stage{border-radius:6px}}
</style></head><body><main><header><div><div class="heading">BUDAO · 数字牧场 · 独立预览</div><h1>万物同颂 · V4</h1><p>All Creation Praises · 整点 · 全员队形　|　半点 · 分声部原地律动</p></div><button id="layout">切换竖屏</button></header>
<div class="stage" id="stage"><iframe src="/praise-preview-core.html" title="牧场预览"></iframe></div>
<div class="controls"><select id="song" aria-label="选择赞美诗"></select><button class="primary" id="play">播放</button><button id="stop">停止</button><button id="prev">上一首</button><button id="next">下一首</button><label><input type="checkbox" id="full">完整节数</label><label><input type="checkbox" id="auto">连续试听</label><label>音量<input type="range" id="volume" min="0" max="100" value="32"></label></div>
<p class="heading" id="formation">队形：等待播放</p><progress class="progress" id="progress" value="0" max="1"></progress><p class="status" id="status" role="status">请选择一首赞美诗，再点击播放。默认试听一节，可切换完整节数。</p>
<div class="heading">全天48个时刻 · 24首原有圣诗</div><div class="tracks" id="tracks"></div><p class="foot">预览不注册居民、不更改正式牧场设置、不触发整点或半点报时。全员主阵及分岸辅助队列，按脚下位置统一深度排序。半点四声部原地律动。预览不修改生产环境。实际音色采用原时辰赞美合成器。</p>
</main><script src="/pasture-hourly-scores.js"></script><script src="/pasture-hourly-last-score.js"></script><script src="/pasture-half-hour-scores.js"></script><script src="/pasture-hourly-hymns.js"></script><script src="/praise-preview-motion-v4.js?v=4"></script><script>
'use strict';
const $=id=>document.getElementById(id),api=window.BudaoHourlyHymns,motion=window.BudaoPraisePreview;
const slots=Array.from({length:48},(_,i)=>({hour:Math.floor(i/2),half:i%2===1,score:(i%2?window.BudaoPastureHalfHourScores:window.BudaoPastureHymnScores)[Math.floor(i/2)%12]}));
const models=slots.map(v=>motion.prepare(v.score,api,v.hour));let ctx=null,active=null,returning=null,serial=0,idx=0;const scenes=new Map();
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const mode=()=>$('stage').classList.contains('portrait')?'portrait':'landscape';
const clock=()=>{if(!ctx)return 0;const ts=ctx.getOutputTimestamp?.();return ts&&ts.performanceTime>0?Math.min(ctx.currentTime,ts.contextTime+Math.max(0,performance.now()-ts.performanceTime)/1000):Math.max(0,ctx.currentTime-(ctx.outputLatency||0))};
window.__budaoPreviewLayout=(name,W,H,layout)=>{if(active||returning)return;const sig=W+'|'+H+'|'+layout.map(o=>o.id+':'+o.x.toFixed(2)+','+o.y.toFixed(2)+','+o.s.toFixed(3)+','+(o.rest?1:0)).join(';');if(scenes.get(name)?.sig===sig)return;scenes.set(name,{sig,layout,byId:new Map(layout.map(o=>[o.id,o])),g:{mode:name,W,H,minY:name==='portrait'?Math.round(H*.405)+8:155},plans:new Map()})};
function getPlan(name,hour){const s=scenes.get(name);if(!s)return null;if(!s.plans.has(hour))s.plans.set(hour,motion.buildShape(s.layout,s.g,hour));return s.plans.get(hour)}
window.__budaoPreviewMotion=(x,y,id,rest,scale,name='landscape')=>{
 if(returning&&returning.mode===name){const r=returning,q=Math.min(1,(performance.now()-r.start)/r.duration),f=r.factor*(1-q*q*(3-2*q));if(r.plan)return motion.pathPose(r.plan,id,f,1-q,0,r.model.beat);const o=r.scene.byId.get(id),p=r.poses.get(id);if(o&&p)return {...p,head:p.head*(1-q),step:p.step*(1-q),sway:p.sway*(1-q)};return null}
 if(!active||active.mode!==name||ctx?.state!=='running')return null;const t=clock()-active.at,m=models[active.idx],o=active.scene.byId.get(id);if(!o)return null;
 if(slots[active.idx].half)return motion.halfPose(m,t,active.duration,o,active.scene.g);
 return motion.formationPose(m,t,active.duration,active.plan,id);
};
function select(i){idx=(i+slots.length)%slots.length;$('song').value=String(idx);document.querySelectorAll('#tracks button').forEach((b,j)=>b.setAttribute('aria-current',String(j===idx)))}
function lock(value){for(const id of ['song','play','prev','next','layout','full'])$(id).disabled=value;document.querySelectorAll('#tracks button').forEach(b=>b.disabled=value)}
function disposeAudio(a){if(!a)return;try{a.source.stop()}catch(e){}try{a.source.disconnect();a.gain.disconnect()}catch(e){}}
function stop(){serial++;const a=active;if(!a)return;const elapsed=Math.max(0,Math.min(a.duration,clock()-a.at)),m=models[a.idx];active=null;disposeAudio(a);const poses=new Map(a.scene.layout.map(o=>[o.id,motion.halfPose(m,elapsed,a.duration,o,a.scene.g)]).filter(v=>v[1]));returning={mode:a.mode,start:performance.now(),duration:a.plan?Math.max(1000,Math.min(12000,motion.timing(m,a.duration).edge*1000*motion.formationFactor(m,elapsed,a.duration))):500,factor:motion.formationFactor(m,elapsed,a.duration),plan:a.plan,scene:a.scene,model:m,poses};$('formation').textContent='停止 · 平滑归位';$('status').textContent='正在恢复初始位置';}
async function play(i){if(active||returning)return;const run=++serial;select(i);lock(true);$('progress').value=0;$('status').textContent='正在准备 '+slots[idx].score.zh+'…';try{
 const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)throw Error('浏览器不支持音频');if(!ctx)ctx=new Ctor({sampleRate:32000});await ctx.resume();if(run!==serial){lock(false);return}
 const j=idx,slot=slots[j],s=slot.score,name=mode(),scene=scenes.get(name);if(!scene||scene.layout.length!==44)throw Error('羊群尚未就绪，请再次点击播放');
 const plan=slot.half?null:getPlan(name,slot.hour);if(!slot.half&&(!plan||plan.count!==44))throw Error('队形规划失败');
 const buffer=api.renderOnePass(ctx,s),source=ctx.createBufferSource(),gain=ctx.createGain(),duration=models[j].cycle*($('full').checked?s.stanzas:1);
 source.buffer=buffer;source.loop=true;source.connect(gain);gain.connect(ctx.destination);const at=ctx.currentTime+.09;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(Number($('volume').value)/100,at+.08);source.start(at);source.stop(at+duration);active={idx:j,at,duration,source,gain,mode:name,scene,plan};
 source.onended=()=>{if(active?.source!==source)return;active=null;disposeAudio({source,gain});$('formation').textContent='已归位 · 日常牧场';$('progress').value=1;$('status').textContent=s.zh+' · 结束';lock(false);if($('auto').checked)play((j+1)%slots.length)};
 }catch(e){if(run===serial){active=null;$('status').textContent='无法试听：'+e.message;lock(false)}}}
slots.forEach((s,i)=>{const name=String(s.hour).padStart(2,'0')+(s.half?':30':':00')+' · '+s.score.zh+' · '+(s.half?'原地分声部':motion.program(s.hour).name);const o=document.createElement('option');o.value=i;o.textContent=name;$('song').append(o);const b=document.createElement('button');b.textContent=name;b.onclick=()=>play(i);$('tracks').append(b)});
$('song').onchange=()=>select(Number($('song').value));$('play').onclick=()=>play(idx);$('stop').onclick=stop;$('prev').onclick=()=>play((idx+47)%48);$('next').onclick=()=>play((idx+1)%48);$('volume').oninput=()=>{if(active)active.gain.gain.setTargetAtTime(Number($('volume').value)/100,ctx.currentTime,.04)};$('layout').onclick=()=>{if(active||returning)return;const p=$('stage').classList.toggle('portrait');$('layout').textContent=p?'切换横屏':'切换竖屏'};window.addEventListener('pagehide',()=>{disposeAudio(active);active=null;returning=null});
function update(){if(returning&&performance.now()-returning.start>=returning.duration){returning=null;$('formation').textContent='已恢复初始位置';$('status').textContent='已停止';$('progress').value=0;lock(false)}
 if(active){const t=Math.max(0,clock()-active.at),slot=slots[active.idx],model=models[active.idx],p=active.plan;$('progress').value=Math.min(1,t/active.duration);
 $('formation').textContent=slot.half?'半点 · 四声部原地律动 · 44只':(t<motion.timing(model,active.duration).edge?'列阵':t>active.duration-motion.timing(model,active.duration).edge?'归位':'保持队形')+' · '+p.program.name+' · '+p.moving+'/44 移动 · '+p.formed+'/44 目标点到位（规划）';
 $('status').textContent=slot.score.zh+' · '+fmt(t)+' / '+fmt(active.duration)+(ctx.state==='running'?'':' · 音频暂停')}
 requestAnimationFrame(update)}select(0);update();
</script></body></html>
