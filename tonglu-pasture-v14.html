<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>同路 · 数字牧场 v14</title></head>
<body style="margin:0;background:#a8e9ff">
<script>
(async()=>{
  const r=await fetch('./tonglu-pasture-v10.html',{cache:'no-store'});
  let html=await r.text();
  html=html.replaceAll('同路 · 数字牧场 v10','同路 · 数字牧场 v14');

  html=html.replace("NEED_KEY='tonglu.self.need.v1'","NEED_KEY='tonglu.self.need.v5'");
  html=html.replace("OFFER_KEY='tonglu.self.offer.v1'","OFFER_KEY='tonglu.self.offer.v5'");
  html=html.replace("FEED_ID='lingliang-demo-001'","FEED_ID='lingliang-demo-005'");

  html=html.replace('#careHit{left:13%;top:47%;width:18%;height:28%}','#careHit{left:9%;top:44%;width:15%;height:25%}');
  html=html.replace('#feedHit{left:32%;top:67%;width:18%;height:23%}','#feedHit{left:21%;top:69%;width:14%;height:20%}');
  html=html.replace('#departHit{right:12%;top:45%;width:22%;height:30%}','#departHit{right:8%;top:42%;width:18%;height:27%}');
  html=html.replace('#askHit{left:20%;bottom:5%;width:18%;height:20%}','#askHit{left:61%;top:52%;width:14%;height:20%}');
  html=html.replace('#offerHit{right:20%;bottom:5%;width:18%;height:20%}','#offerHit{left:70%;top:73%;width:15%;height:18%}');

  const extraCss=`
  .stage.focus .hotspot{border:2px solid transparent;transition:background .12s ease,border-color .12s ease,box-shadow .12s ease,transform .12s ease}
  .stage.focus .hotspot:hover,.stage.focus .hotspot:focus-visible{border-color:rgba(255,250,200,.92);background:rgba(255,248,190,.13);box-shadow:0 0 0 3px rgba(126,184,92,.18),inset 0 0 0 1px rgba(255,255,255,.58);transform:translateY(-1px)}
  .stage.focus .hotspot::after{opacity:.94;top:auto;bottom:-22px;padding:4px 7px;background:rgba(255,254,239,.96);border:1px solid rgba(80,72,58,.16);box-shadow:1px 1px 0 rgba(80,72,58,.12)}
  .stage.focus #careHit::after{left:78%;bottom:8%;transform:translateX(0)}
  .stage.focus #feedHit::after{left:52%;bottom:-19px}
  .stage.focus #departHit::after{left:52%;bottom:8%}
  .stage.focus #askHit::after{left:76%;bottom:30%;transform:translateX(0)}
  .stage.focus #offerHit::after{left:50%;bottom:-20px}
  .stage.focus .hotspot:hover::after,.stage.focus .hotspot:focus-visible::after{opacity:1;font-weight:750}
  .life-slip{position:absolute;z-index:20;left:50%;bottom:5.5%;transform:translate(-50%,12px);width:min(390px,calc(100vw - 28px));padding:15px 16px 14px;background:rgba(255,252,224,.98);border:2px solid rgba(112,90,57,.30);box-shadow:4px 4px 0 rgba(90,72,48,.15);opacity:0;pointer-events:none;transition:opacity .14s ease,transform .14s ease;color:#514c42}
  .life-slip.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .life-slip .slip-kicker{font-size:11px;letter-spacing:.12em;color:#7d755f;margin-bottom:6px}
  .life-slip .slip-title{font-size:17px;font-weight:760;margin-bottom:7px}
  .life-slip .slip-body{font-size:13px;line-height:1.65;color:#5e594e}
  .life-slip .slip-close{position:absolute;right:9px;top:8px;border:0;background:transparent;font-size:18px;color:#7b735f;cursor:pointer;padding:4px 7px}
  .life-slip input,.life-slip textarea,.life-slip select{width:100%;border:1px solid rgba(94,79,54,.26);background:#fffdf0;color:#514c42;font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:8px;margin-top:8px;outline:none;border-radius:0}
  .life-slip textarea{min-height:62px;resize:none}
  .life-slip .slip-action{border:1px solid rgba(88,75,52,.24);background:#f6e6aa;color:#5a5040;font-weight:700;padding:7px 11px;margin-top:10px;cursor:pointer;box-shadow:2px 2px 0 rgba(83,69,44,.10)}
  .life-slip .slip-note{font-size:11px;color:#817866;margin-top:7px}
  `;
  html=html.replace('</style>',extraCss+'</style>');
  html=html.replace('data-label="风铃 · 有人来关心你"','data-label="风铃"');
  html=html.replace('data-label="发出需要"','data-label="需要"');

  html=html.replace('<div class="toast" id="toast"></div>','<div class="toast" id="toast"></div><div class="life-slip" id="lifeSlip"><button class="slip-close" id="slipClose" aria-label="关闭">×</button><div class="slip-kicker" id="slipKicker"></div><div class="slip-title" id="slipTitle"></div><div class="slip-body" id="slipBody"></div></div>');

  html=html.replace(/function needWave\(px,py,strong=false\)\{[\s\S]*?\}\nfunction cloth/,
`function needWave(px,py,strong=false){const ph=(tick%32)>>3;ctx.save();ctx.globalAlpha=strong?1:.72;ctx.strokeStyle=C.need;ctx.lineWidth=strong?2.2:1.8;const count=strong?3:2;for(let i=0;i<count;i++){const r=(strong?7:8)+i*5+ph;ctx.beginPath();ctx.arc(px,py,r,-.9,.9);ctx.stroke()}ctx.restore()}
function cloth`);
  html=html.replace(/function cloth\(px,py,s=1\)\{[\s\S]*?\}\nfunction sheepBody/,
`function cloth(px,py,s=1,active=false){const base=active?'#ffd477':'#ffe7a4',fold=active?'#e7a84f':'#efc879';rect(px+5*s,py,10*s,2*s,base);rect(px+2*s,py+2*s,16*s,2*s,base);rect(px,py+4*s,20*s,5*s,base);rect(px+2*s,py+9*s,16*s,2*s,base);rect(px+5*s,py+11*s,10*s,1*s,base);rect(px+15*s,py+7*s,5*s,4*s,fold);rect(px+4*s,py+4*s,5*s,1*s,'#fff5d0')}
function sheepBody`);

  html=html.replace("if(o.give)cloth(px-6,py+20,1);if(o.self&&selfNeed)needWave(px+32*o.s,py+6*o.s,true);if(o.self&&selfOffer)cloth(px-6,py+20,1)","if(o.self&&selfNeed)needWave(px+32*o.s,py+6*o.s,true);if(o.self&&selfOffer)cloth(px-3,py+20,.72,true)");

  const detail=`function detailSheep(){
    rect(0,0,W,106,C.sky2);fill([[0,126],[55,126],[55,118],[122,118],[122,124],[196,124],[196,116],[270,116],[270,123],[345,123],[345,117],[410,117],[410,123],[480,123],[480,300],[0,300]],'#a6dc83');fill([[0,169],[80,169],[80,163],[170,163],[170,171],[258,171],[258,164],[345,164],[345,172],[430,172],[430,166],[480,166],[480,300],[0,300]],'#83cc64');rect(0,224,W,76,C.grass);
    tree(52,145,2.15,true);
    if(!feedOpened){feed(118,230,2.9);if((tick%24)<12){rect(111,223,2,2,'#fff3a0');rect(151,228,2,2,'#fff8c4');rect(138,218,2,2,'#fff3a0')}}
    rect(362,154,7,36,C.woodDark);rect(345,145,55,22,C.wood);rect(350,150,39,3,'#d8b27a');rect(350,157,28,3,C.woodDark);rect(396,150,8,12,C.wood);for(let i=0;i<6;i++)rect(370+i*13,188+i*8,5,2,i%2?'#d9c796':'#c8b787');
    const bob=(Math.sin(tick/14)>0?0:1),px=168,py=143-bob;rect(px-10,py+92,120,10,'rgba(255,248,195,.42)');rect(px,py+18,96,48,C.self);rect(px+12,py,64,82,C.self);rect(px+30,py-14,34,100,C.self);rect(px-6,py+30,18,26,'#c9dfb0');rect(px+78,py+24,20,32,'#abc892');rect(px+19,py+9,18,12,'#d4e7c2');rect(px+54,py+4,17,13,'#aac690');rect(px+5,py+52,18,14,'#aac690');rect(px+62,py+61,21,14,'#d2e5be');rect(px+80,py+24,45,40,C.selfHead);rect(px+118,py+30,14,15,C.selfHead);rect(px+72,py+27,13,12,C.selfHead);rect(px+87,py+20,12,7,'#8c7f6e');rect(px+103,py+34,5,5,C.ink);rect(px+111,py+36,4,4,C.ink);rect(px+119,py+45,6,2,'#645c52');rect(px+22,py+76,12,33,'#5d5851');rect(px+67,py+76,12,33,'#5d5851');rect(px+20,py+105,16,6,'#4f4b46');rect(px+65,py+105,16,6,'#4f4b46');if((tick%28)<14){rect(px+17,py+27,7,4,'#dceccc');rect(px+48,py+18,6,4,'#dceccc')}else{rect(px+20,py+30,7,4,'#dceccc');rect(px+51,py+21,6,4,'#dceccc')}needWave(px+140,py+47,selfNeed);cloth(px+171,py+98,1.65,selfOffer);
  }`;
  html=html.replace(/function detailSheep\(\)\{[\s\S]*?\}\nfunction render\(\)/,detail+'\nfunction render()');

  html=html.replace("const FEED_ID='lingliang-demo-005',FEED_KEY='tonglu.lingliang.opened.'+FEED_ID,MEDIA_URL='audio/dkd.mp3';let feedOpened=localStorage.getItem(FEED_KEY)==='1';","const FEED_ID='lingliang-demo-005',FEED_KEY='tonglu.lingliang.opened.'+FEED_ID,MEDIA_URL='audio/dkd.mp3';let feedOpened=localStorage.getItem(FEED_KEY)==='1';if(feedOpened)document.getElementById('feedHit').style.display='none';");
  html=html.replace("localStorage.setItem(FEED_KEY,'1');feedOpened=true;showToast('灵粮已开启 · 本次之后不再出现');","localStorage.setItem(FEED_KEY,'1');feedOpened=true;document.getElementById('feedHit').style.display='none';showToast('灵粮已开启 · 本次之后不再出现');");

  html=html.replace("function pulseLabel(el){el.classList.add('show-label');setTimeout(()=>el.classList.remove('show-label'),1400)}",
`function pulseLabel(el){el.classList.add('show-label');setTimeout(()=>el.classList.remove('show-label'),1400)}
const slip=document.getElementById('lifeSlip'),slipKicker=document.getElementById('slipKicker'),slipTitle=document.getElementById('slipTitle'),slipBody=document.getElementById('slipBody');
function closeSlip(){slip.classList.remove('open')}
function openSlip(kicker,title,body){slipKicker.textContent=kicker;slipTitle.textContent=title;slipBody.innerHTML=body;slip.classList.add('open')}
document.getElementById('slipClose').addEventListener('click',closeSlip);
function openNeedSlip(){openSlip('需要','让牧场听见你的呼唤','<select id="needType"><option value="实际帮助">实际帮助</option><option value="陪伴">陪伴</option><option value="安慰">安慰</option><option value="路线与装备">路线与装备</option><option value="生活关怀">生活关怀</option></select><textarea id="needText" maxlength="80" placeholder="用一句话说出你现在需要什么"></textarea><button class="slip-action" id="needSend">发出呼唤</button><div class="slip-note">原型阶段只保存在这个浏览器。</div>');document.getElementById('needSend').addEventListener('click',()=>{const type=document.getElementById('needType').value,text=document.getElementById('needText').value.trim();if(!text){showToast('先写下一句话');return}localStorage.setItem(NEED_KEY,'1');localStorage.setItem('tonglu.self.need.text.v1',JSON.stringify({type,text}));selfNeed=true;closeSlip();showToast('你的需要已经被牧场听见')})}
function openGiveSlip(){openSlip('给出','今天愿意把什么给出去？','<input id="giveText" maxlength="40" placeholder="例如：一本绘本 / 登山杖 / 外套"><button class="slip-action" id="giveSend">放到草地上</button><div class="slip-note">先是给予，不是交易。</div>');document.getElementById('giveSend').addEventListener('click',()=>{const text=document.getElementById('giveText').value.trim();if(!text){showToast('先写下愿意给出的东西');return}localStorage.setItem(OFFER_KEY,'1');localStorage.setItem('tonglu.self.offer.text.v1',text);selfOffer=true;closeSlip();showToast('这份给予已经放到牧场')})}`);

  html=html.replace("document.getElementById('careHit').addEventListener('click',e=>pulseLabel(e.currentTarget));",
"document.getElementById('careHit').addEventListener('click',e=>{pulseLabel(e.currentTarget);openSlip('风铃','有人来关心你','<div>来自：同行者（示例）</div><div style=\"margin-top:5px\">“今天还好吗？”</div>')});");
  html=html.replace("document.getElementById('departHit').addEventListener('click',e=>{pulseLabel(e.currentTarget);showToast('今天有一条与你有关的路')});",
"document.getElementById('departHit').addEventListener('click',e=>{pulseLabel(e.currentTarget);openSlip('出发','一次与你有关的出发','<div>示例出发 · 本周六 15:00</div><div style=\"margin-top:5px\">这不是公开活动列表，而是一条只与你有关的路。</div><button class=\"slip-action\" id=\"departOkay\">知道了</button>');setTimeout(()=>{const b=document.getElementById('departOkay');if(b)b.addEventListener('click',closeSlip)},0)});");
  html=html.replace("document.getElementById('askHit').addEventListener('click',()=>{selfNeed=!selfNeed;localStorage.setItem(NEED_KEY,selfNeed?'1':'0');showToast(selfNeed?'已让牧场看见你的需要':'已收起这个需要')});","document.getElementById('askHit').addEventListener('click',openNeedSlip);");
  html=html.replace("document.getElementById('offerHit').addEventListener('click',()=>{selfOffer=!selfOffer;localStorage.setItem(OFFER_KEY,selfOffer?'1':'0');showToast(selfOffer?'已把一份给予放到牧场':'已收起这份给予')});","document.getElementById('offerHit').addEventListener('click',openGiveSlip);");
  html=html.replace("back.addEventListener('click',()=>{mode='world';stage.classList.remove('focus')});","back.addEventListener('click',()=>{closeSlip();mode='world';stage.classList.remove('focus')});");

  document.open();document.write(html);document.close();
})().catch(err=>{document.body.innerHTML='<div style="padding:30px;font:14px sans-serif">v14 加载失败，请刷新。<br>'+String(err)+'</div>'});
</script>
</body></html>
